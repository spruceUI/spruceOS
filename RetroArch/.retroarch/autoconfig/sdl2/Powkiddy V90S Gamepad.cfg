# Powkiddy V90S internal pad on oakMOSS (adc-joypad, vendor 0x0133 product 0x1190), as
# RetroArch's sdl2 joypad driver sees it through SDL's GameController map (V90S.cfg). No sticks.
# The binds are the input_player1_* values retroarch-V90S.cfg already sets.
input_driver = "sdl2"
input_device = "Powkiddy V90S Gamepad"
input_vendor_id = "307"
input_product_id = "4496"

input_b_btn = "0"
input_b_btn_label = "B"
input_a_btn = "1"
input_a_btn_label = "A"
input_x_btn = "3"
input_x_btn_label = "X"
input_y_btn = "2"
input_y_btn_label = "Y"

input_l_btn = "9"
input_l_btn_label = "L1"
input_r_btn = "10"
input_r_btn_label = "R1"
input_l2_axis = "+4"
input_l2_axis_label = "L2"
input_r2_axis = "+5"
input_r2_axis_label = "R2"

input_select_btn = "4"
input_select_btn_label = "Select"
input_start_btn = "6"
input_start_btn_label = "Start"

input_up_btn = "11"
input_up_btn_label = "D-Pad Up"
input_down_btn = "12"
input_down_btn_label = "D-Pad Down"
input_left_btn = "13"
input_left_btn_label = "D-Pad Left"
input_right_btn = "14"
input_right_btn_label = "D-Pad Right"
