# Powkiddy V20 internal pad on oakMOSS (adc-joypad, vendor 0x0133 product 0x1190), as
# RetroArch's sdl2 joypad driver sees it through SDL's GameController map (V20.cfg). Two sticks; untested.
# The binds are the input_player1_* values retroarch-V20.cfg already sets.
input_driver = "sdl2"
input_device = "Powkiddy V20 Gamepad"
input_vendor_id = "307"
input_product_id = "4496"

input_b_btn = "0"
input_b_btn_label = "B"
input_a_btn = "1"
input_a_btn_label = "A"
input_x_btn = "3"
input_x_btn_label = "X"
input_y_btn = "2"
input_y_btn_label = "Y"

input_l_btn = "9"
input_l_btn_label = "L1"
input_r_btn = "10"
input_r_btn_label = "R1"
input_l2_axis = "+4"
input_l2_axis_label = "L2"
input_r2_axis = "+5"
input_r2_axis_label = "R2"
input_l3_btn = "7"
input_l3_btn_label = "L3"
input_r3_btn = "8"
input_r3_btn_label = "R3"

input_select_btn = "4"
input_select_btn_label = "Select"
input_start_btn = "6"
input_start_btn_label = "Start"

input_up_btn = "11"
