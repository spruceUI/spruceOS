# Powkiddy RGB30 internal pad (singleadc-joypad driver).
#
# Every input_player1_*_btn in retroarch-RGB30.cfg is "nul" - the platform
# config carries hotkeys only and expects player 1 to come from here.
#
# Button numbers are the pad's udev indices, confirmed three ways: derived by
# inverting SDL's ascending-evdev-code ordering against MinUI's JOY_* table,
# reproduced exactly by a live UnofficialOS card's es_input.cfg and its
# profile.d/098-controller, and then observed on hardware - hotkey 8 (select),
# fps toggle 2 (X) and menu toggle 3 (Y) all landed on the right buttons.
#
# Two things differ from the Anbernic profile beside it and are the reason it
# could not simply be reused:
#   - The d-pad is four discrete buttons, 13-16, not a hat. h0up and friends
#     bind to nothing here.
#   - L2 and R2 are digital buttons, 6 and 7, not axes.
input_driver = "udev"
input_device = "retrogame_joypad"
input_vendor_id = "18507"
input_product_id = "4353"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"

input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

input_select_btn = "8"
input_start_btn = "9"

input_l3_btn = "11"
input_r3_btn = "12"

input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
