# 32-bit RetroArch (ra32.h700) overlay for AnbernicXX720480, layered over
# retroarch-AnbernicXX720480.cfg with --appendconfig. The 64-bit build needs
# no overlay: the platform cfg carries its sdl2 drivers and binds.
#
# BaseOS runs no udevd. The 64-bit build reads the pad through the mali-fbdev
# SDL2 we stage, but the 32-bit SDL2 harvested from the stock image dlopens
# libudev and finds no joystick here (verified on a CubeXX, with and without
# SDL_JOYSTICK_DISABLE_UDEV=1: zero devices either way). RetroArch's linuxraw
# joypad driver reads the legacy /dev/input/js0 instead and needs neither udev
# nor SDL; it numbers buttons in kernel order, matching neither the udev nor
# the sdl2 profile, and has no hat support, so the d-pad binds as axes. The
# player binds and the fleet hotkeys below are that numbering for this
# platform's pad layout (2stick); input_driver stays sdl2 for the keyboard
# nothing here has.
#
# Config saving is off for the session: RetroArch would otherwise write these
# linuxraw numbers back into the platform cfg and scramble the next 64-bit
# launch. Settings changed inside RetroArch on the 32-bit build therefore do
# not persist; the 64-bit build is the default and keeps the cfg user-owned.
# The modifier comes from retroarch-AnbernicRG_XX-32bit-modifier-*.cfg,
# appended after this file according to the spruce Menu/Select/Start option.
input_driver = "sdl2"
input_joypad_driver = "linuxraw"
video_context_driver = "fbdev_mali"
config_save_on_exit = "false"
input_player1_a_btn = "0"
input_player1_a_axis = "nul"
