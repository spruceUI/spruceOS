# Anbernic RG-XX internal pad WITHOUT sticks (RG28XX, the NoStick models), as
# the 32-bit RetroArch build sees it (linuxraw). Binds mirror
# retroarch-AnbernicRG28XX-32bit.cfg; the d-pad is axes 3 and 4 here, one lower
# than on the stick models.
input_driver = "linuxraw"
input_device = "ANBERNIC-keys"
input_vendor_id = "1"
input_product_id = "1"

input_b_btn = "1"
input_b_btn_label = "B"
input_a_btn = "0"
input_a_btn_label = "A"
input_x_btn = "3"
input_x_btn_label = "X"
input_y_btn = "2"
input_y_btn_label = "Y"

input_l_btn = "4"
input_l_btn_label = "L1"
input_r_btn = "5"
input_r_btn_label = "R1"
input_l2_btn = "9"
input_l2_btn_label = "L2"
input_r2_btn = "10"
input_r2_btn_label = "R2"

input_select_btn = "6"
input_select_btn_label = "Select"
input_start_btn = "7"
input_start_btn_label = "Start"

input_up_axis = "-4"
input_up_axis_label = "D-Pad Up"
input_down_axis = "+4"
input_down_axis_label = "D-Pad Down"
input_left_axis = "-3"
input_left_axis_label = "D-Pad Left"
input_right_axis = "+3"
input_right_axis_label = "D-Pad Right"
