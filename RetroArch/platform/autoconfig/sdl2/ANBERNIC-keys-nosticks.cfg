# Anbernic RG-XX internal pad WITHOUT sticks (RG28XX, the NoStick models), as
# the 64-bit RetroArch build sees it (sdl2).
#
# Same device name and ids as the stick models - RetroArch cannot tell them
# apart - but with no L3/R3 every button after them shifts down by one, so
# L2/R2 are 12/13 here and 13/14 there. AnbernicXXCommon.sh stages whichever
# of the two matches this device.
#
# Binds mirror retroarch-AnbernicRG28XX.cfg.bak, including the left-stick axes
# that file declares on a device with no stick.
input_driver = "sdl2"
input_device = "ANBERNIC-keys"
input_vendor_id = "1"
input_product_id = "1"

input_b_btn = "4"
input_b_btn_label = "B"
input_a_btn = "3"
input_a_btn_label = "A"
input_x_btn = "6"
input_x_btn_label = "X"
input_y_btn = "5"
input_y_btn_label = "Y"

input_l_btn = "7"
input_l_btn_label = "L1"
input_r_btn = "8"
input_r_btn_label = "R1"
input_l2_btn = "12"
input_l2_btn_label = "L2"
input_r2_btn = "13"
input_r2_btn_label = "R2"

input_select_btn = "9"
input_select_btn_label = "Select"
input_start_btn = "10"
input_start_btn_label = "Start"

input_up_btn = "h0up"
input_up_btn_label = "D-Pad Up"
input_down_btn = "h0down"
input_down_btn_label = "D-Pad Down"
input_left_btn = "h0left"
input_left_btn_label = "D-Pad Left"
input_right_btn = "h0right"
input_right_btn_label = "D-Pad Right"

input_l_x_minus_axis = "-0"
input_l_x_plus_axis = "+0"
input_l_y_minus_axis = "-1"
input_l_y_plus_axis = "+1"
