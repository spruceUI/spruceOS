# MagicX Zero 40 (one stick, left) internal pad, as RetroArch's sdl2 joypad driver sees it.
#
# Without this file RetroArch reports "magicx-input (46098/26214) not configured,
# using fallback" at every launch. The binds are not new: they are the
# input_player1_* values retroarch-Zero40.cfg already sets, so this changes nothing
# except the notification. All three boards report the same name and ids (the
# simplepad driver, vendor 0xb412 product 0x6666) with different sticks, hence one
# file per layout, staged at boot.
input_driver = "sdl2"
input_device = "magicx-input"
input_vendor_id = "46098"
input_product_id = "26214"

input_b_btn = "0"
input_b_btn_label = "B"
input_a_btn = "1"
input_a_btn_label = "A"
input_x_btn = "3"
input_x_btn_label = "X"
input_y_btn = "2"
input_y_btn_label = "Y"

input_l_btn = "9"
input_l_btn_label = "L1"
input_r_btn = "10"
input_r_btn_label = "R1"
input_l2_axis = "+4"
input_l2_axis_label = "L2"
input_r2_axis = "+5"
input_r2_axis_label = "R2"
input_l3_btn = "7"
input_l3_btn_label = "L3"

input_select_btn = "4"
input_select_btn_label = "Select"
input_start_btn = "6"
input_start_btn_label = "Start"

input_up_btn = "11"
input_up_btn_label = "D-Pad Up"
input_down_btn = "12"
input_down_btn_label = "D-Pad Down"
input_left_btn = "13"
input_left_btn_label = "D-Pad Left"
input_right_btn = "14"
input_right_btn_label = "D-Pad Right"

input_l_x_minus_axis = "-0"
input_l_x_minus_axis_label = "Left Stick Left"
input_l_x_plus_axis = "+0"
input_l_x_plus_axis_label = "Left Stick Right"
input_l_y_minus_axis = "-1"
input_l_y_minus_axis_label = "Left Stick Up"
input_l_y_plus_axis = "+1"
input_l_y_plus_axis_label = "Left Stick Down"
