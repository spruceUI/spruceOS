# Anbernic RG-XX internal pad, as the 64-bit RetroArch build sees it (sdl2).
#
# Without this file RetroArch reports "ANBERNIC-keys (1/1) not configured,
# using fallback" at every launch (issue #1676). The binds are not new: they
# are the input_player1_* values retroarch-AnbernicXX*.cfg already sets, so
# this changes nothing except the notification.
#
# The kernel reports the pad as bus 0x19 vendor 0001 product 0001
# (gpio-keys-polled), hence the ids below.
input_driver = "sdl2"
input_device = "ANBERNIC-keys"
input_vendor_id = "1"
input_product_id = "1"

input_b_btn = "4"
input_b_btn_label = "B"
input_a_btn = "3"
input_a_btn_label = "A"
input_x_btn = "6"
input_x_btn_label = "X"
input_y_btn = "5"
input_y_btn_label = "Y"

input_l_btn = "7"
input_l_btn_label = "L1"
input_r_btn = "8"
input_r_btn_label = "R1"
input_l2_btn = "13"
input_l2_btn_label = "L2"
input_r2_btn = "14"
input_r2_btn_label = "R2"
input_l3_btn = "12"
input_l3_btn_label = "L3"
input_r3_btn = "15"
input_r3_btn_label = "R3"

input_select_btn = "9"
input_select_btn_label = "Select"
input_start_btn = "10"
input_start_btn_label = "Start"

input_up_btn = "h0up"
input_up_btn_label = "D-Pad Up"
input_down_btn = "h0down"
input_down_btn_label = "D-Pad Down"
input_left_btn = "h0left"
input_left_btn_label = "D-Pad Left"
input_right_btn = "h0right"
input_right_btn_label = "D-Pad Right"

input_l_x_minus_axis = "-0"
input_l_x_minus_axis_label = "Left Stick Left"
input_l_x_plus_axis = "+0"
input_l_x_plus_axis_label = "Left Stick Right"
input_l_y_minus_axis = "-1"
input_l_y_minus_axis_label = "Left Stick Up"
input_l_y_plus_axis = "+1"
input_l_y_plus_axis_label = "Left Stick Down"
input_r_x_minus_axis = "-2"
input_r_x_minus_axis_label = "Right Stick Left"
input_r_x_plus_axis = "+2"
input_r_x_plus_axis_label = "Right Stick Right"
input_r_y_minus_axis = "-3"
input_r_y_minus_axis_label = "Right Stick Up"
input_r_y_plus_axis = "+3"
input_r_y_plus_axis_label = "Right Stick Down"
