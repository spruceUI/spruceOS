# Modifier for the 32-bit RetroArch on the XX line: START in linuxraw numbering.
# Appended after retroarch-<PLATFORM>-32bit.cfg by the launcher according to
# the spruce Menu/Select/Start option (Custom falls back to MENU: a modifier
# chosen inside the 64-bit build is an sdl2 number linuxraw cannot use). The
# buttons below MENU are numbered the same on every XX pad layout, so one file
# serves every platform.
input_enable_hotkey_btn = "7"
input_enable_hotkey_axis = "nul"
