# BaseOS overlay for the 32-bit RetroArch on 1stick pads, layered over the
# platform cfg (retroarch-$PLATFORM.cfg) with --appendconfig. The 64-bit build
# uses retroarch-AnbernicRG_XX-baseos.cfg instead; only one of the two is ever
# applied. One file per XX_PAD_LAYOUT because linuxraw numbers the triggers and
# the d-pad axes differently per layout; the launcher picks this one by name.
#
# Same reasoning as the 64-bit overlay for everything except the joypad. BaseOS
# runs no udevd, so RetroArch's udev input drivers enumerate nothing.
#
# The difference is that the 64-bit build can fall back on the mali-fbdev SDL2
# we stage, which carries the H700 joystick-classification patch, while the
# 32-bit SDL2 harvested from the stock image dlopens libudev and so finds no
# joystick here. Verified on a CubeXX, with and without
# SDL_JOYSTICK_DISABLE_UDEV=1: zero devices either way.
#
# RetroArch's linuxraw joypad driver reads the legacy /dev/input/js0 instead and
# needs neither udev nor SDL. It picks the pad up as "ANBERNIC-keys" (0/0), and
# ra_functions.sh writes the matching autoconfig into autoconfig/linuxraw/
# before launch. Confirmed on device: "[Autoconf] ANBERNIC-keys configured in
# port 1."
#
# input_driver stays sdl2 - that one handles the keyboard, which nothing here
# has, and swapping it for linuxraw would have RetroArch fighting for the
# console.
input_driver = "sdl2"
input_joypad_driver = "linuxraw"

# Drive the Mali blob directly instead of going RetroArch -> SDL2 -> mali fbdev
# EGL. ra32.h700 is built --enable-mali_fbdev, same as the 64-bit build.
video_context_driver = "fbdev_mali"

# The platform cfg ships its hotkeys in the 64-bit build's sdl2 numbering,
# which means nothing to linuxraw, so this overlay carries the same fleet
# layout in linuxraw numbering for this pad layout: modifier + B exit, + A
# screenshot, + X menu, + Y fps, + L1 load, + R1 save, + L2 slow-motion, + R2
# fast-forward, + UP shader, + LEFT/RIGHT state slot (the d-pad is axes under
# linuxraw). The modifier comes from the sibling
# retroarch-AnbernicRG_XX-baseos32-modifier-*.cfg the launcher appends after
# this file, following the spruce Menu/Select/Start option.
#
# Config saving is off for the session: RetroArch would otherwise write these
# linuxraw numbers back into the platform cfg and scramble the next 64-bit
# launch. Settings changed inside RetroArch on the 32-bit build therefore do
# not persist; the 64-bit build is the default and keeps the cfg user-owned.
config_save_on_exit = "false"
input_exit_emulator_btn = "1"
input_exit_emulator_axis = "nul"
input_screenshot_btn = "0"
input_screenshot_axis = "nul"
input_menu_toggle_btn = "3"
input_menu_toggle_axis = "nul"
input_fps_toggle_btn = "2"
input_fps_toggle_axis = "nul"
input_load_state_btn = "4"
input_load_state_axis = "nul"
input_save_state_btn = "5"
input_save_state_axis = "nul"
input_toggle_slowmotion_btn = "10"
input_toggle_slowmotion_axis = "nul"
input_toggle_fast_forward_btn = "11"
input_toggle_fast_forward_axis = "nul"
input_shader_toggle_btn = "nul"
input_shader_toggle_axis = "-5"
input_state_slot_decrease_btn = "nul"
input_state_slot_decrease_axis = "-4"
input_state_slot_increase_btn = "nul"
input_state_slot_increase_axis = "+4"
