# Modifier for the 32-bit RetroArch on BaseOS: SELECT in linuxraw numbering.
# Appended after the per-layout retroarch-AnbernicRG_XX-baseos32-<layout>.cfg
# by the launcher according to the spruce Menu/Select/Start option (Custom
# falls back to MENU: a modifier chosen inside the 64-bit build is an sdl2
# number linuxraw cannot use). The buttons below MENU are numbered the same
# on every XX pad layout, so one file serves all three.
input_enable_hotkey_btn = "6"
input_enable_hotkey_axis = "nul"
