name: Remove Changes Requested Label on PR Update

on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  remove-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove changes requested label
        uses: actions/github-script@v7
        with:
          script: |
            const label = "changes requested";

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label
              });

              console.log(`Removed label: ${label}`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Label "${label}" is not present on this PR.`);
              } else {
                throw error;
              }
            }