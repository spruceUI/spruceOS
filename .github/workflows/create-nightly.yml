name: Create Nightly

on:
#  schedule:
#    - cron: '10 10 * * *'
  workflow_dispatch:
#  push:
#    branches: [ Development ]

jobs:
  create-7z:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # update-ota-on-publish.yml pushes to the same OTA repositories; never race it.
    concurrency:
      group: ota-metadata
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: Development
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Get version and date
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ ! -f "spruce/spruce" ]; then
            echo "Error: spruce/spruce file not found"
            exit 1
          fi

          VERSION="$(< spruce/spruce)"
          FULL_VERSION="${VERSION}-$(date '+%Y%m%d')"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"

          # One release per RUN, never a reused tag. The release action deletes
          # an existing tag's assets before uploading the new ones, so a failed
          # upload used to leave a published release with nothing in it while
          # the OTA feed still advertised the file (2026-09-17: two runs in a
          # row hit a GitHub 500 there and every device 404'd on download).
          #
          # The version string is unchanged - devices read NIGHTLY_VERSION and
          # follow NIGHTLY_LINK, neither of which cares what the tag is called.
          TAG="v${FULL_VERSION}"
          n=1
          while gh api "repos/spruceUI/spruceOSNightlies/releases/tags/${TAG}" >/dev/null 2>&1; do
            n=$((n + 1))
            TAG="v${FULL_VERSION}.${n}"
          done
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag for this run: ${TAG}"

          # Get last commit hash and commits, save to file
          {
            echo "Last commit: $(git rev-parse HEAD)"
            echo ""
            echo "Changes in last 24 hours:"
            git log --since="24 hours ago" --pretty=format:'- %s (%an)'
          } > commits_nightly.txt

      - name: Record current Development commit
        id: current_commit
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Current Development commit: ${HEAD_SHA}"

      - name: Find last stable release
        id: previous_stable
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Finding most recent published stable release..."

          RELEASE_JSON="$(gh api \
            "repos/spruceUI/spruceOS/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | .[0]')"

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "Error: No previous stable release was found."
            exit 1
          fi

          TAG_NAME="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "Error: Could not determine tag of previous stable release."
            exit 1
          fi

          echo "Previous stable release: ${TAG_NAME}"

          # Resolve the stable release tag to its actual commit.
          BASE_SHA="$(git rev-list -n 1 "$TAG_NAME")"

          if [ -z "$BASE_SHA" ]; then
            echo "Error: Could not resolve ${TAG_NAME} to a commit."
            exit 1
          fi

          echo "Previous stable release commit: ${BASE_SHA}"

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write nightly markers
        run: |
          # Every nightly package (full and diff) carries the stable release it
          # was generated from and its own version, so that any install - by
          # the updater, the PC installer or a manual copy - identifies itself:
          #   Saves/spruce/ota_nightly_base   stable base (read by downloader.sh)
          #   /<version>                      root marker read by get_version_complex
          #   commits_nightly.txt             "Last commit: <sha>" = build identity,
          #                                   compared with NIGHTLY_COMMIT in OTA/spruce
          # .ota_extra_files lists generated files the OTA manifest step adds.
          mkdir -p Saves/spruce
          printf '%s\n' "${{ steps.previous_stable.outputs.version }}" > Saves/spruce/ota_nightly_base
          : > "${{ steps.get_version.outputs.version }}"
          printf '%s\n' \
            "commits_nightly.txt" \
            "Saves/spruce/ota_nightly_base" \
            "${{ steps.get_version.outputs.version }}" \
            > .ota_extra_files

      - name: Check for commits
        id: check_commits
        run: |
          # Get all commits from last 24 hours
          COMMITS=$(git log --since="24 hours ago" --pretty=format:'- %s (%an)%n')

          if [ -z "$COMMITS" ]; then
            echo "No commits in the last 24 hours"
            exit 1
          fi

          # Write commits to output
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Recombine large files
        run: |
          # Miyoo rootfs
          if ls spruce/flip/miyoo355_rootfs_32.img_part* 1>/dev/null 2>&1; then
            rm -f spruce/flip/miyoo355_rootfs_32.img
            cat spruce/flip/miyoo355_rootfs_32.img_part* > spruce/flip/miyoo355_rootfs_32.img
            rm -f spruce/flip/miyoo355_rootfs_32.img_part*
          fi

          # muOS pixie
          if ls spruce/flip/muOS-pixie-reduced.sqsh-part* 1>/dev/null 2>&1; then
            rm -f spruce/flip/muOS-pixie-reduced.sqsh
            cat spruce/flip/muOS-pixie-reduced.sqsh-part* > spruce/flip/muOS-pixie-reduced.sqsh
            rm -f spruce/flip/muOS-pixie-reduced.sqsh-part*
          fi

          # scummvm libretro core
          if ls RetroArch/.retroarch/cores64/scummvm_libretro.so.part* 1>/dev/null 2>&1; then
            cat RetroArch/.retroarch/cores64/scummvm_libretro.so.part* > RetroArch/.retroarch/cores64/scummvm_libretro.so
            rm -f RetroArch/.retroarch/cores64/scummvm_libretro.so.part*
          fi

      - name: Pull selected PyUI Themes
        # TODO(OTA): these archives are downloaded from a fixed PyUI-Themes
        # release tag and are not tracked in git, so they never appear in the
        # OTA diff manifest: only full archives deliver theme updates.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Themes
          RELEASE_URL="https://github.com/spruceUI/PyUI-Themes/releases/download/1"

          echo "Downloading selected themes from PyUI-Themes release..."

          wget -q --no-check-certificate -O "Themes/ALEKFULL_NX_ES.7z" "${RELEASE_URL}/ALEKFULL_NX_ES.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_OUTLINE.7z" "${RELEASE_URL}/ART_BOOK_OUTLINE.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_NEXT.7z" "${RELEASE_URL}/ART_BOOK_NEXT.7z" || true
          wget -q --no-check-certificate -O "Themes/Avocado.7z" "${RELEASE_URL}/Avocado.7z" || true
          wget -q --no-check-certificate -O "Themes/Cosy by KyleBing.7z" "${RELEASE_URL}/Cosy_by_KyleBing.7z" || true
          wget -q --no-check-certificate -O "Themes/Grape.7z" "${RELEASE_URL}/Grape.7z" || true
          wget -q --no-check-certificate -O "Themes/GREEN.7z" "${RELEASE_URL}/GREEN.7z" || true
          wget -q --no-check-certificate -O "Themes/HeyDW's Blue.7z" "${RELEASE_URL}/HeyDWs_Blue.7z" || true
          wget -q --no-check-certificate -O "Themes/M.7z" "${RELEASE_URL}/M.7z" || true
          wget -q --no-check-certificate -O "Themes/MINIMAL.7z" "${RELEASE_URL}/MINIMAL.7z" || true
          wget -q --no-check-certificate -O "Themes/MinUInspired (logos).7z" "${RELEASE_URL}/MinUInspired_(logos).7z" || true
          wget -q --no-check-certificate -O "Themes/OTB.7z" "${RELEASE_URL}/OTB.7z" || true
          wget -q --no-check-certificate -O "Themes/Pico-8.7z" "${RELEASE_URL}/Pico-8.7z" || true
          wget -q --no-check-certificate -O "Themes/SLABS.7z" "${RELEASE_URL}/SLABS.7z" || true
          wget -q --no-check-certificate -O "Themes/SPRUCE (simple).7z" "${RELEASE_URL}/SPRUCE_(simple).7z" || true

          # Remove any empty files from failed downloads
          find Themes -name "*.7z" -empty -delete

          echo "Themes downloaded:"
          ls -lh Themes

      - name: Archive Licenses folder
        run: |
          7z a -t7z -mx=9 Licenses.7z Licenses/
          rm -rf Licenses/

      - name: Generate OTA diff manifest
        id: ota_diff
        run: |
          BASE_SHA="${{ steps.previous_stable.outputs.sha }}"
          HEAD_SHA="${{ steps.current_commit.outputs.sha }}"

          echo "=========================================="
          echo "Generating OTA diff"
          echo "=========================================="
          echo "Base stable release: ${{ steps.previous_stable.outputs.tag }}"
          echo "Base SHA:            ${BASE_SHA}"
          echo "Development SHA:     ${HEAD_SHA}"
          echo ""

          OTA_MANIFEST=".ota_manifest"
          OTA_DELETE=".ota_delete"
          OTA_FILES=".ota_files"

          rm -f "$OTA_MANIFEST" "$OTA_DELETE" "$OTA_FILES"

          touch "$OTA_MANIFEST"
          touch "$OTA_DELETE"
          touch "$OTA_FILES"

          # Files excluded from the full release archive should also be
          # excluded from the OTA package.
          is_excluded() {
            case "$1" in
              .git/*|.git|.github/*|.github|.gitignore|.gitattributes)
                return 0
                ;;
              create_spruce_release.bat|create_spruce_release.sh|To-Do.txt)
                return 0
                ;;
              spruce/flags/developer_mode)
                return 0
                ;;
              commits_nightly.txt)
                return 0
                ;;

            esac

            return 1
          }

          # Paths that the release build regenerates after checkout
          # (see "Recombine split files" and "Archive Licenses folder").
          # A change to any INPUT must ship the generated OUTPUT: the inputs
          # no longer exist in the working tree by the time 7z runs, and the
          # device only ever has the recombined file.
          translate_path() {
            case "$1" in
              spruce/flip/miyoo355_rootfs_32.img_part*)
                echo "spruce/flip/miyoo355_rootfs_32.img"
                ;;
              spruce/flip/muOS-pixie-reduced.sqsh-part*)
                echo "spruce/flip/muOS-pixie-reduced.sqsh"
                ;;
              RetroArch/.retroarch/cores64/scummvm_libretro.so.part*)
                echo "RetroArch/.retroarch/cores64/scummvm_libretro.so"
                ;;
              Licenses/*)
                echo "Licenses.7z"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          RAW_ADD="$(mktemp)"
          RAW_DEL="$(mktemp)"

          # The package must bring ANY installation derived from the base
          # release to HEAD - not only the base release itself. A nightly
          # device may carry files that Development changed and later
          # reverted, or added and later removed; a plain tree diff between
          # base and HEAD never mentions those. So the frame of reference is
          # every path touched since the base (history) united with every
          # path that differs from it (tree): paths present at HEAD are
          # shipped (restoring base content where needed), paths absent at
          # HEAD are deleted.
          #
          # --no-renames intentionally causes a rename to appear as a delete
          # of the old path plus an add of the new path, which is exactly
          # what the OTA updater needs.
          {
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA"
            git log --no-renames --name-only --format= -z "${BASE_SHA}..${HEAD_SHA}"
          } |
          sort -z -u |
          while IFS= read -r -d '' FILE; do

            if [ -z "$FILE" ]; then
              continue
            fi

            if is_excluded "$FILE"; then
              continue
            fi

            OUT_PATH="$(translate_path "$FILE")"

            if git cat-file -e "${HEAD_SHA}:${FILE}" 2>/dev/null; then
              printf '%s\n' "$OUT_PATH" >> "$RAW_ADD"
            elif [ "$OUT_PATH" != "$FILE" ] && [ -e "$OUT_PATH" ]; then
              # A removed input of a generated file means the generated
              # file changed, not that it was removed.
              printf '%s\n' "$OUT_PATH" >> "$RAW_ADD"
            else
              printf '%s\n' "$OUT_PATH" >> "$RAW_DEL"
            fi

          done

          # A full archive re-creates every tracked flag file (the first-boot
          # lock for each platform, run_upgrades.lock), which the device
          # consumes at runtime; that is how a full update re-arms the
          # first-boot lane. Ship the same tracked flag files in every OTA
          # package so an incremental update re-arms exactly what a full
          # update would, without the updater needing per-platform knowledge.
          git ls-tree -r --name-only "$HEAD_SHA" -- spruce/flags |
          while IFS= read -r FLAG_FILE; do
            [ -z "$FLAG_FILE" ] && continue
            if is_excluded "$FLAG_FILE"; then
              continue
            fi
            printf '%s\n' "$FLAG_FILE" >> "$RAW_ADD"
          done

          # Generated files that must travel in every package (nightly
          # markers, commit log), listed by an earlier step in .ota_extra_files.
          if [ -f .ota_extra_files ]; then
            while IFS= read -r EXTRA_FILE; do
              if [ -n "$EXTRA_FILE" ] && [ -f "$EXTRA_FILE" ]; then
                printf '%s\n' "$EXTRA_FILE" >> "$RAW_ADD"
              fi
            done < .ota_extra_files
          fi

          sort -u "$RAW_ADD" > "$OTA_FILES"
          sort -u "$RAW_DEL" | grep -vxF -f "$OTA_FILES" > "$OTA_DELETE" || true

          # Every packaged path must exist as a regular file NOW. A path that
          # is missing here would silently drop out of the archive.
          MISSING=0
          while IFS= read -r OTA_PATH; do
            [ -z "$OTA_PATH" ] && continue
            if [ ! -f "$OTA_PATH" ]; then
              echo "ERROR: manifest path does not exist at packaging time: $OTA_PATH"
              MISSING=1
            fi
          done < "$OTA_FILES"

          if [ "$MISSING" -ne 0 ]; then
            echo "Refusing to build an OTA archive with missing payload."
            exit 1
          fi

          echo ""
          echo "Changed files:"
          if [ -s "$OTA_FILES" ]; then
            cat "$OTA_FILES"
          else
            echo "(none)"
          fi

          echo ""
          echo "Deleted files:"
          if [ -s "$OTA_DELETE" ]; then
            cat "$OTA_DELETE"
          else
            echo "(none)"
          fi

          # Add metadata to the beginning of the manifest.
          {
            echo "# spruceOS OTA manifest"
            echo "# From stable release: ${{ steps.previous_stable.outputs.tag }}"
            echo "# From SHA: $BASE_SHA"
            echo "# To nightly version: ${{ steps.get_version.outputs.version }}"
            echo "# To SHA: $HEAD_SHA"
            echo ""
            echo "# Files to add/update:"
            cat "$OTA_FILES"
            echo ""
            echo "# Deleted files are listed in .ota_delete"
          } > "$OTA_MANIFEST"

          rm -f "$RAW_ADD" "$RAW_DEL"

          echo "manifest=${OTA_MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "delete_list=${OTA_DELETE}" >> "$GITHUB_OUTPUT"
          echo "file_list=${OTA_FILES}" >> "$GITHUB_OUTPUT"

      - name: Create OTA archive
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PREVIOUS_VERSION="${{ steps.previous_stable.outputs.tag }}"

          OTA_ARCHIVE="spruceOTA-${PREVIOUS_VERSION}-to-v${VERSION}.7z"

          echo "Creating OTA archive: ${OTA_ARCHIVE}"

          # Build a temporary 7z list containing:
          #   - the manifest
          #   - the delete list
          #   - every changed/added file
          OTA_7Z_LIST="$(mktemp)"

          printf '%s\n' ".ota_manifest" >> "$OTA_7Z_LIST"
          printf '%s\n' ".ota_delete" >> "$OTA_7Z_LIST"

          if [ -s ".ota_files" ]; then
            cat ".ota_files" >> "$OTA_7Z_LIST"
          fi

          7z a \
            -t7z \
            -m0=lzma2:d=16m \
            -mx=7 \
            -ms=off \
            -mf- \
            "$OTA_ARCHIVE" \
            @"$OTA_7Z_LIST"

          rm -f "$OTA_7Z_LIST"

          echo ""
          echo "OTA archive created:"
          ls -lh "$OTA_ARCHIVE"

          echo ""
          echo "Archive contents:"
          7z l "$OTA_ARCHIVE"

      - name: Create 7z archive
        run: |
          # Dot-directories must be named explicitly - the shell's * does not
          # match them. .system carries the BaseOS hand-off shim, and without it
          # a fresh install leaves an Anbernic XX on "ADD FRONTEND TO SD CARD".
          7z a -t7z -m0=lzma2:d=16m -mx=7 -ms=off -mf- "spruceV${{ steps.get_version.outputs.version }}.7z" * .tmp_update .system \
            -xr!.git \
            -xr!.github \
            -x!.gitignore \
            -x!.gitattributes \
            -x!create_spruce_release.bat \
            -x!create_spruce_release.sh \
            -x!commits_nightly.txt \
            -x!To-Do.txt \
            -x!.ota_manifest \
            -x!.ota_delete \
            -x!.ota_files \
            -x!.ota_extra_files \
            -x!spruceOTA-*.7z

          # Add the commits file separately to place it at the root
          7z u "spruceV${{ steps.get_version.outputs.version }}.7z" commits_nightly.txt

      # The release is created empty and the archives are uploaded one at a
      # time below. The action uploads its files in parallel with no timeout,
      # no retry and no per-file error: on 2026-09-17 the 1.6 GB archive took
      # a 500 twice and then hung for 11 minutes with no output, while the
      # small diff beside it uploaded fine every time.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success() && steps.check_commits.outcome == 'success'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          body: |
            ${{ steps.check_commits.outputs.commits }}

            ## OTA Update

            This nightly includes an OTA package containing all changes from stable release `${{ steps.previous_stable.outputs.tag }}` to this Development build.

            OTA package:
            `spruceOTA-${{ steps.previous_stable.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z`

            Base stable commit:
            `${{ steps.previous_stable.outputs.sha }}`

            Development commit:
            `${{ steps.current_commit.outputs.sha }}`

          repository: spruceUI/spruceOSNightlies
          token: ${{ secrets.PAT_TOKEN }}
          draft: false
          prerelease: false

      - name: Upload release assets
        if: success() && steps.check_commits.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          upload() {
              _file="$1"
              _size="$(ls -l --block-size=1M "$_file" | awk '{print $5}')"
              for _attempt in 1 2 3; do
                  echo "Uploading $_file (${_size} MB), attempt ${_attempt}..."
                  _start="$(date +%s)"
                  if timeout 900 gh release upload "$TAG" "$_file" \
                      --repo spruceUI/spruceOSNightlies --clobber; then
                      echo "  done in $(( $(date +%s) - _start ))s"
                      return 0
                  fi
                  echo "  failed after $(( $(date +%s) - _start ))s"
                  sleep 30
              done
              echo "::error::giving up on $_file after 3 attempts"
              return 1
          }

          # Smallest first: the OTA diff is what most devices take.
          upload "spruceOTA-${{ steps.previous_stable.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z"
          upload "spruceV${{ steps.get_version.outputs.version }}.7z"

      # The upload can fail after the release exists. Publishing a feed that
      # points at a release with no assets is what breaks every device's OTA,
      # so check before writing it.
      - name: Verify release assets
        if: success() && steps.check_commits.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          for asset in \
            "spruceV${{ steps.get_version.outputs.version }}.7z" \
            "spruceOTA-${{ steps.previous_stable.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z"
          do
            state="$(gh api "repos/spruceUI/spruceOSNightlies/releases/tags/${{ steps.get_version.outputs.tag }}" \
              --jq ".assets[] | select(.name == \"${asset}\") | .state")"
            if [ "$state" != "uploaded" ]; then
              echo "::error::${asset} is not uploaded on ${{ steps.get_version.outputs.tag }} (state='${state:-missing}')"
              exit 1
            fi
            echo "${asset}: uploaded"
          done

      - name: Update OTA files
        if: success() && steps.check_commits.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Clone both repositories
          git clone https://github.com/spruceUI/spruceui.github.io.git ota_repo
          git clone https://github.com/spruceUI/spruceSource.git source_repo

          # Calculate full nightly release info
          CHECKSUM=$(md5sum "spruceV${{ steps.get_version.outputs.version }}.7z" | cut -d' ' -f1)
          SIZE_MB=$(ls -l --block-size=1M "spruceV${{ steps.get_version.outputs.version }}.7z" | awk '{print $5}')

          # Calculate stable -> nightly OTA diff info
          DIFF_ARCHIVE="spruceOTA-${{ steps.previous_stable.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z"
          DIFF_CHECKSUM=$(md5sum "$DIFF_ARCHIVE" | cut -d' ' -f1)
          DIFF_SIZE_MB=$(ls -l --block-size=1M "$DIFF_ARCHIVE" | awk '{print $5}')

          echo "Nightly checksum: $CHECKSUM"
          echo "Nightly size: ${SIZE_MB} MB"
          echo "Stable -> nightly diff checksum: $DIFF_CHECKSUM"
          echo "Stable -> nightly diff size: ${DIFF_SIZE_MB} MB"

          # Function to update OTA file
          update_ota_file() {
              local file="$1"
              local content
              content=$(cat "$file")

              # Remove existing nightly variables.
              # Only one stable -> nightly diff is needed because every
              # nightly is generated from the current stable release.
              echo "$content" | grep -v "^NIGHTLY_" > "$file"

              # Full nightly release
              echo "NIGHTLY_VERSION=${{ steps.get_version.outputs.version }}" >> "$file"
              echo "NIGHTLY_CHECKSUM=$CHECKSUM" >> "$file"
              echo "NIGHTLY_SIZE_IN_MB=$SIZE_MB" >> "$file"
              echo "NIGHTLY_LINK=https://github.com/spruceUI/spruceOSNightlies/releases/download/${{ steps.get_version.outputs.tag }}/spruceV${{ steps.get_version.outputs.version }}.7z" >> "$file"
              echo "NIGHTLY_INFO=https://github.com/spruceUI/spruceOSNightlies/releases/tag/${{ steps.get_version.outputs.tag }}" >> "$file"
              # Build identity: the commit this nightly was built from. Several
              # nightlies built on one day share a version string; a device
              # compares this with "Last commit:" in its commits_nightly.txt to
              # tell a rebuild from the build it already runs.
              echo "NIGHTLY_COMMIT=${{ steps.current_commit.outputs.sha }}" >> "$file"

              # Stable -> nightly OTA diff
              # Same representation as RELEASE_VERSION (no v prefix): the
              # downloader compares the two to make sure the diff was built
              # against the stable release the device will be on.
              echo "NIGHTLY_DIFF_BASE_VERSION=${{ steps.previous_stable.outputs.version }}" >> "$file"
              echo "NIGHTLY_DIFF_VERSION=${{ steps.get_version.outputs.version }}" >> "$file"
              echo "NIGHTLY_DIFF_CHECKSUM=$DIFF_CHECKSUM" >> "$file"
              echo "NIGHTLY_DIFF_SIZE_IN_MB=$DIFF_SIZE_MB" >> "$file"
              echo "NIGHTLY_DIFF_LINK=https://github.com/spruceUI/spruceOSNightlies/releases/download/${{ steps.get_version.outputs.tag }}/${DIFF_ARCHIVE}" >> "$file"
          }

          # Update both OTA files
          update_ota_file "ota_repo/OTA/spruce"
          update_ota_file "source_repo/OTA/spruce"

          # Update primary OTA repo
          cd ota_repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add OTA/spruce

          if git diff --cached --quiet; then
            echo "No changes to commit in primary OTA repository."
          else
            git commit -m "Update nightly release to ${{ steps.get_version.outputs.version }}"
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/spruceUI/spruceui.github.io.git main
          fi

          # Update backup OTA repo
          cd ../source_repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add OTA/spruce

          if git diff --cached --quiet; then
            echo "No changes to commit in backup OTA repository."
          else
            git commit -m "Update nightly release to ${{ steps.get_version.outputs.version }}"
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/spruceUI/spruceSource.git main
          fi

      - name: Delete old releases
        if: success() && steps.check_commits.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Keep only the five most recent nightly releases. Each RUN makes its
          # own release now, so a day with reruns uses more than one.
          RELEASES=$(gh api repos/spruceUI/spruceOSNightlies/releases --paginate | \
            jq -r '.[] | .id')

          COUNT=0
          for RELEASE_ID in $RELEASES; do
            COUNT=$((COUNT + 1))

            if [ $COUNT -gt 5 ]; then
              gh api repos/spruceUI/spruceOSNightlies/releases/$RELEASE_ID -X DELETE
            fi
          done