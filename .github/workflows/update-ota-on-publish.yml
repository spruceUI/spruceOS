name: Update OTA on Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to update OTA file for (without v prefix)'
        required: true
        type: string

jobs:
  update-ota:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Debug event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: spruceUI/spruceOS
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using version: $VERSION"

      - name: Determine previous stable release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Finding previous stable release..."

          PREVIOUS_VERSION=$(gh release list \
            --repo spruceUI/spruceOS \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '
              [.[] |
                select(.tagName != ("v" + env.VERSION))
              ][0].tagName
            ' | sed 's/^v//')

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "No previous stable release found."
            echo "HAS_PREVIOUS_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "Previous stable release: $PREVIOUS_VERSION"
            echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
            echo "HAS_PREVIOUS_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Downloading release v${VERSION}"

          # Full release archive
          gh release download "v${VERSION}" \
            --repo spruceUI/spruceOS \
            -p "spruceV${VERSION}.7z"

          if [ "$HAS_PREVIOUS_RELEASE" = "true" ]; then

            # The stable release workflow names the incremental archive after
            # the previous release TAG (which carries the v prefix):
            #
            # spruceOTA-v${PREVIOUS_VERSION}-to-v${VERSION}.7z
            #
            DIFF_ASSET="spruceOTA-v${PREVIOUS_VERSION}-to-v${VERSION}.7z"

            echo "Looking for stable incremental archive:"
            echo "$DIFF_ASSET"

            if gh release download "v${VERSION}" \
                --repo spruceUI/spruceOS \
                -p "$DIFF_ASSET"; then

              echo "Incremental archive downloaded:"
              ls -lh "$DIFF_ASSET"

              echo "HAS_DIFF=true" >> "$GITHUB_ENV"

            else
              echo "ERROR: Expected incremental archive was not found."
              echo ""
              echo "The stable release workflow should have created:"
              echo "  $DIFF_ASSET"
              echo ""
              echo "Refusing to update OTA metadata without the incremental archive."

              exit 1
            fi

          else
            echo "No previous stable release; skipping incremental archive."
            echo "HAS_DIFF=false" >> "$GITHUB_ENV"
          fi

      - name: Update OTA files
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ env.VERSION }}
          PREVIOUS_VERSION: ${{ env.PREVIOUS_VERSION }}
        run: |
          set -e

          # Clone both OTA repositories.
          git clone https://github.com/spruceUI/spruceui.github.io.git ota_repo
          git clone https://github.com/spruceUI/spruceSource.git mirror_repo

          OTA_FILE="OTA/spruce"

          # ------------------------------------------------------------
          # Full stable release metadata
          # ------------------------------------------------------------

          CHECKSUM=$(md5sum "spruceV${VERSION}.7z" | cut -d' ' -f1)
          SIZE_MB=$(ls -l --block-size=1M "spruceV${VERSION}.7z" | awk '{print $5}')

          echo "Full release:"
          echo "  Version:  $VERSION"
          echo "  Checksum: $CHECKSUM"
          echo "  Size:     ${SIZE_MB} MB"

          # ------------------------------------------------------------
          # Stable -> stable incremental metadata
          # ------------------------------------------------------------

          if [ "$HAS_DIFF" = "true" ]; then

            DIFF_FILE="spruceOTA-v${PREVIOUS_VERSION}-to-v${VERSION}.7z"

            DIFF_CHECKSUM=$(md5sum "$DIFF_FILE" | cut -d' ' -f1)
            DIFF_SIZE_MB=$(ls -l --block-size=1M "$DIFF_FILE" | awk '{print $5}')

            DIFF_LINK="https://github.com/spruceUI/spruceOS/releases/download/v${VERSION}/${DIFF_FILE}"

            echo ""
            echo "Stable incremental release:"
            echo "  From:     $PREVIOUS_VERSION"
            echo "  To:       $VERSION"
            echo "  File:     $DIFF_FILE"
            echo "  Checksum: $DIFF_CHECKSUM"
            echo "  Size:     ${DIFF_SIZE_MB} MB"
            echo "  Link:     $DIFF_LINK"

          fi

          # ------------------------------------------------------------
          # Update one OTA metadata file
          # ------------------------------------------------------------

          update_ota_file() {
            local file="$1"
            local tmp_file

            tmp_file="$(mktemp)"

            echo ""
            echo "Updating $file"

            # Preserve every existing RELEASE_DIFF_* entry except the
            # exact transition we are replacing.
            #
            # Everything beginning with RELEASE_* that is NOT a
            # RELEASE_DIFF_* entry is removed and regenerated below.
            awk \
              -v prev="$PREVIOUS_VERSION" \
              -v ver="$VERSION" '
                /^RELEASE_DIFF_/ {
                  if ($0 ~ "^RELEASE_DIFF_.*_" prev "_" ver "=") {
                    next
                  }

                  print
                  next
                }

                /^RELEASE_/ {
                  next
                }

                {
                  print
                }
              ' "$file" > "$tmp_file"

            # ----------------------------------------------------------
            # Current latest stable release
            # ----------------------------------------------------------

            {
              echo "RELEASE_VERSION=${VERSION}"
              echo "RELEASE_CHECKSUM=${CHECKSUM}"
              echo "RELEASE_SIZE_IN_MB=${SIZE_MB}"
              echo "RELEASE_LINK=https://github.com/spruceUI/spruceOS/releases/download/v${VERSION}/spruceV${VERSION}.7z"
              echo "RELEASE_INFO=https://github.com/spruceUI/spruceOS/releases/tag/v${VERSION}"
            } >> "$tmp_file"

            # ----------------------------------------------------------
            # New stable -> stable incremental transition
            # ----------------------------------------------------------

            if [ "$HAS_DIFF" = "true" ]; then
              {
                echo "RELEASE_DIFF_LINK_${PREVIOUS_VERSION}_${VERSION}=${DIFF_LINK}"
                echo "RELEASE_DIFF_CHECKSUM_${PREVIOUS_VERSION}_${VERSION}=${DIFF_CHECKSUM}"
                echo "RELEASE_DIFF_SIZE_IN_MB_${PREVIOUS_VERSION}_${VERSION}=${DIFF_SIZE_MB}"
              } >> "$tmp_file"
            fi

            mv "$tmp_file" "$file"

            echo ""
            echo "Resulting OTA metadata:"
            cat "$file"
          }

          # Update primary OTA repository.
          update_ota_file "ota_repo/$OTA_FILE"

          # Update mirror OTA repository.
          update_ota_file "mirror_repo/$OTA_FILE"

          # ------------------------------------------------------------
          # Push primary OTA repository
          # ------------------------------------------------------------

          cd ota_repo

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add "$OTA_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit in primary OTA repository."
          else
            git commit -m "Update stable OTA metadata to ${VERSION}"

            git push \
              "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/spruceUI/spruceui.github.io.git" \
              main
          fi

          # ------------------------------------------------------------
          # Push mirror OTA repository
          # ------------------------------------------------------------

          cd ../mirror_repo

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add "$OTA_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit in mirror OTA repository."
          else
            git commit -m "Update stable OTA metadata to ${VERSION}"

            git push \
              "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/spruceUI/spruceSource.git" \
              main
          fi

      - name: Summary
        run: |
          echo "=========================================="
          echo "OTA metadata updated successfully"
          echo "=========================================="
          echo "Stable version: ${VERSION}"

          if [ "$HAS_PREVIOUS_RELEASE" = "true" ]; then
            echo "Previous stable: ${PREVIOUS_VERSION}"
            echo ""
            echo "Incremental transition:"
            echo "  ${PREVIOUS_VERSION} -> ${VERSION}"
            echo ""
            echo "Archive:"
            echo "  spruceOTA-v${PREVIOUS_VERSION}-to-v${VERSION}.7z"
          else
            echo "No previous stable release."
            echo "No incremental transition was created."
          fi

          echo "=========================================="