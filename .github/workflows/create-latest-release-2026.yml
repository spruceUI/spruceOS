name: Create NEW Latest Release (2026rev.)

on:
  workflow_dispatch:

jobs:
  create-latest-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Record current commit
        id: current_commit
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Current main commit: ${HEAD_SHA}"

      - name: Read version from spruce/spruce
        id: get_version
        run: |
          if [ ! -f "spruce/spruce" ]; then
            echo "Error: spruce/spruce file not found"
            exit 1
          fi

          VERSION="$(< spruce/spruce)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Find previous stable release
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Finding most recent published stable release..."

          RELEASE_JSON="$(gh api \
            "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false)] | .[0]')"

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "Error: No previous stable release was found."
            exit 1
          fi

          TAG_NAME="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "Error: Could not determine tag of previous stable release."
            exit 1
          fi

          echo "Previous stable release: ${TAG_NAME}"

          if [ "$TAG_NAME" = "v${{ steps.get_version.outputs.version }}" ]; then
            echo "Error: v${{ steps.get_version.outputs.version }} is already the latest published stable release."
            echo "Re-running this workflow after publishing would diff the release against itself"
            echo "and reset the release to a draft. Bump spruce/spruce or delete the release first."
            exit 1
          fi

          # Resolve the tag to the actual commit.
          BASE_SHA="$(git rev-list -n 1 "$TAG_NAME")"

          if [ -z "$BASE_SHA" ]; then
            echo "Error: Could not resolve ${TAG_NAME} to a commit."
            exit 1
          fi

          echo "Previous stable release commit: ${BASE_SHA}"

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Recombine split files
        run: |
          # Miyoo rootfs
          if ls spruce/flip/miyoo355_rootfs_32.img_part* 1>/dev/null 2>&1; then
            echo "Recombining miyoo355_rootfs_32.img..."
            rm -f spruce/flip/miyoo355_rootfs_32.img
            cat spruce/flip/miyoo355_rootfs_32.img_part* > spruce/flip/miyoo355_rootfs_32.img
            rm -f spruce/flip/miyoo355_rootfs_32.img_part*
            echo "✓ miyoo355_rootfs_32.img recombined"
          fi

          # muOS pixie
          if ls spruce/flip/muOS-pixie-reduced.sqsh-part* 1>/dev/null 2>&1; then
            echo "Recombining muOS-pixie-reduced.sqsh..."
            rm -f spruce/flip/muOS-pixie-reduced.sqsh
            cat spruce/flip/muOS-pixie-reduced.sqsh-part* > spruce/flip/muOS-pixie-reduced.sqsh
            rm -f spruce/flip/muOS-pixie-reduced.sqsh-part*
            echo "✓ muOS-pixie-reduced.sqsh recombined"
          fi

          # ScummVM libretro core
          if ls RetroArch/.retroarch/cores64/scummvm_libretro.so.part* 1>/dev/null 2>&1; then
            echo "Recombining scummvm_libretro.so..."
            cat RetroArch/.retroarch/cores64/scummvm_libretro.so.part* > RetroArch/.retroarch/cores64/scummvm_libretro.so
            rm -f RetroArch/.retroarch/cores64/scummvm_libretro.so.part*
            echo "✓ scummvm_libretro.so recombined"
          fi

      - name: Pull PyUI Themes
        # TODO(OTA): these archives are downloaded from a fixed PyUI-Themes
        # release tag and are not tracked in git, so they never appear in the
        # OTA diff manifest: only full archives deliver theme updates.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Themes
          RELEASE_URL="https://github.com/spruceUI/PyUI-Themes/releases/download/1"

          echo "Downloading selected themes from PyUI-Themes release..."

          wget -q --no-check-certificate -O "Themes/ALEKFULL_NX_ES.7z" "${RELEASE_URL}/ALEKFULL_NX_ES.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_OUTLINE.7z" "${RELEASE_URL}/ART_BOOK_OUTLINE.7z" || true
          wget -q --no-check-certificate -O "Themes/ART_BOOK_NEXT.7z" "${RELEASE_URL}/ART_BOOK_NEXT.7z" || true
          wget -q --no-check-certificate -O "Themes/Avocado.7z" "${RELEASE_URL}/Avocado.7z" || true
          wget -q --no-check-certificate -O "Themes/Cosy by KyleBing.7z" "${RELEASE_URL}/Cosy_by_KyleBing.7z" || true
          wget -q --no-check-certificate -O "Themes/Grape.7z" "${RELEASE_URL}/Grape.7z" || true
          wget -q --no-check-certificate -O "Themes/GREEN.7z" "${RELEASE_URL}/GREEN.7z" || true
          wget -q --no-check-certificate -O "Themes/HeyDW's Blue.7z" "${RELEASE_URL}/HeyDWs_Blue.7z" || true
          wget -q --no-check-certificate -O "Themes/M.7z" "${RELEASE_URL}/M.7z" || true
          wget -q --no-check-certificate -O "Themes/MINIMAL.7z" "${RELEASE_URL}/MINIMAL.7z" || true
          wget -q --no-check-certificate -O "Themes/MinUInspired (logos).7z" "${RELEASE_URL}/MinUInspired_(logos).7z" || true
          wget -q --no-check-certificate -O "Themes/OTB.7z" "${RELEASE_URL}/OTB.7z" || true
          wget -q --no-check-certificate -O "Themes/Pico-8.7z" "${RELEASE_URL}/Pico-8.7z" || true
          wget -q --no-check-certificate -O "Themes/SLABS.7z" "${RELEASE_URL}/SLABS.7z" || true
          wget -q --no-check-certificate -O "Themes/SPRUCE (simple).7z" "${RELEASE_URL}/SPRUCE_(simple).7z" || true

          # Remove any empty files from failed downloads
          find Themes -name "*.7z" -empty -delete

          echo "Themes downloaded:"
          ls -lh Themes

      - name: Archive Licenses folder
        run: |
          7z a -t7z -mx=9 Licenses.7z Licenses/
          rm -rf Licenses/

      - name: Generate OTA diff manifest
        id: ota_diff
        run: |
          BASE_SHA="${{ steps.previous_release.outputs.sha }}"
          HEAD_SHA="${{ steps.current_commit.outputs.sha }}"

          echo "=========================================="
          echo "Generating OTA diff"
          echo "=========================================="
          echo "Base release: ${{ steps.previous_release.outputs.tag }}"
          echo "Base SHA:     ${BASE_SHA}"
          echo "Current SHA:  ${HEAD_SHA}"
          echo ""

          OTA_MANIFEST=".ota_manifest"
          OTA_DELETE=".ota_delete"
          OTA_FILES=".ota_files"

          rm -f "$OTA_MANIFEST" "$OTA_DELETE" "$OTA_FILES"

          touch "$OTA_MANIFEST"
          touch "$OTA_DELETE"
          touch "$OTA_FILES"

          # Files excluded from the full release archive should also be
          # excluded from the OTA package.
          is_excluded() {
            case "$1" in
              .git/*|.git|.github/*|.github|.gitignore|.gitattributes)
                return 0
                ;;
              create_spruce_release.bat|create_spruce_release.sh|To-Do.txt)
                return 0
                ;;
              spruce/flags/developer_mode)
                return 0
                ;;
              App/adbd|App/adbd/*)
                return 0
                ;;

            esac

            return 1
          }

          # Paths that the release build regenerates after checkout
          # (see "Recombine split files" and "Archive Licenses folder").
          # A change to any INPUT must ship the generated OUTPUT: the inputs
          # no longer exist in the working tree by the time 7z runs, and the
          # device only ever has the recombined file.
          translate_path() {
            case "$1" in
              spruce/flip/miyoo355_rootfs_32.img_part*)
                echo "spruce/flip/miyoo355_rootfs_32.img"
                ;;
              spruce/flip/muOS-pixie-reduced.sqsh-part*)
                echo "spruce/flip/muOS-pixie-reduced.sqsh"
                ;;
              RetroArch/.retroarch/cores64/scummvm_libretro.so.part*)
                echo "RetroArch/.retroarch/cores64/scummvm_libretro.so"
                ;;
              Licenses/*)
                echo "Licenses.7z"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          RAW_ADD="$(mktemp)"
          RAW_DEL="$(mktemp)"

          # The package must bring ANY installation derived from the base
          # release to HEAD - not only the base release itself. A nightly
          # device may carry files that Development changed and later
          # reverted, or added and later removed; a plain tree diff between
          # base and HEAD never mentions those. So the frame of reference is
          # every path touched since the base (history) united with every
          # path that differs from it (tree): paths present at HEAD are
          # shipped (restoring base content where needed), paths absent at
          # HEAD are deleted.
          #
          # --no-renames intentionally causes a rename to appear as a delete
          # of the old path plus an add of the new path, which is exactly
          # what the OTA updater needs.
          {
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA"
            git log --no-renames --name-only --format= -z "${BASE_SHA}..${HEAD_SHA}"
          } |
          sort -z -u |
          while IFS= read -r -d '' FILE; do

            if [ -z "$FILE" ]; then
              continue
            fi

            if is_excluded "$FILE"; then
              continue
            fi

            OUT_PATH="$(translate_path "$FILE")"

            if git cat-file -e "${HEAD_SHA}:${FILE}" 2>/dev/null; then
              printf '%s\n' "$OUT_PATH" >> "$RAW_ADD"
            elif [ "$OUT_PATH" != "$FILE" ] && [ -e "$OUT_PATH" ]; then
              # A removed input of a generated file means the generated
              # file changed, not that it was removed.
              printf '%s\n' "$OUT_PATH" >> "$RAW_ADD"
            else
              printf '%s\n' "$OUT_PATH" >> "$RAW_DEL"
            fi

          done

          # A full archive re-creates every tracked flag file (the first-boot
          # lock for each platform, run_upgrades.lock), which the device
          # consumes at runtime; that is how a full update re-arms the
          # first-boot lane. Ship the same tracked flag files in every OTA
          # package so an incremental update re-arms exactly what a full
          # update would, without the updater needing per-platform knowledge.
          git ls-tree -r --name-only "$HEAD_SHA" -- spruce/flags |
          while IFS= read -r FLAG_FILE; do
            [ -z "$FLAG_FILE" ] && continue
            if is_excluded "$FLAG_FILE"; then
              continue
            fi
            printf '%s\n' "$FLAG_FILE" >> "$RAW_ADD"
          done

          sort -u "$RAW_ADD" > "$OTA_FILES"
          sort -u "$RAW_DEL" | grep -vxF -f "$OTA_FILES" > "$OTA_DELETE" || true

          # Every packaged path must exist as a regular file NOW. A path that
          # is missing here would silently drop out of the archive.
          MISSING=0
          while IFS= read -r OTA_PATH; do
            [ -z "$OTA_PATH" ] && continue
            if [ ! -f "$OTA_PATH" ]; then
              echo "ERROR: manifest path does not exist at packaging time: $OTA_PATH"
              MISSING=1
            fi
          done < "$OTA_FILES"

          if [ "$MISSING" -ne 0 ]; then
            echo "Refusing to build an OTA archive with missing payload."
            exit 1
          fi

          echo ""
          echo "Changed files:"
          if [ -s "$OTA_FILES" ]; then
            cat "$OTA_FILES"
          else
            echo "(none)"
          fi

          echo ""
          echo "Deleted files:"
          if [ -s "$OTA_DELETE" ]; then
            cat "$OTA_DELETE"
          else
            echo "(none)"
          fi

          # Add metadata to the beginning of the manifest.
          {
            echo "# spruceOS OTA manifest"
            echo "# From release: ${{ steps.previous_release.outputs.tag }}"
            echo "# From SHA: $BASE_SHA"
            echo "# To version: ${{ steps.get_version.outputs.version }}"
            echo "# To SHA: $HEAD_SHA"
            echo ""
            echo "# Files to add/update:"
            cat "$OTA_FILES"
            echo ""
            echo "# Deleted files are listed in .ota_delete"
          } > "$OTA_MANIFEST"

          rm -f "$RAW_ADD" "$RAW_DEL"

          echo "manifest=${OTA_MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "delete_list=${OTA_DELETE}" >> "$GITHUB_OUTPUT"
          echo "file_list=${OTA_FILES}" >> "$GITHUB_OUTPUT"

      - name: Create OTA archive
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PREVIOUS_VERSION="${{ steps.previous_release.outputs.tag }}"

          OTA_ARCHIVE="spruceOTA-${PREVIOUS_VERSION}-to-v${VERSION}.7z"

          echo "Creating OTA archive: ${OTA_ARCHIVE}"

          # Build a temporary 7z list containing:
          #   - the manifest
          #   - the delete list
          #   - every changed/added file
          OTA_7Z_LIST="$(mktemp)"

          printf '%s\n' ".ota_manifest" >> "$OTA_7Z_LIST"
          printf '%s\n' ".ota_delete" >> "$OTA_7Z_LIST"

          if [ -s ".ota_files" ]; then
            cat ".ota_files" >> "$OTA_7Z_LIST"
          fi

          7z a \
            -t7z \
            -m0=lzma2:d=16m \
            -mx=7 \
            -ms=off \
            -mf- \
            "$OTA_ARCHIVE" \
            @"$OTA_7Z_LIST"

          rm -f "$OTA_7Z_LIST"

          echo ""
          echo "OTA archive created:"
          ls -lh "$OTA_ARCHIVE"

          echo ""
          echo "Archive contents:"
          7z l "$OTA_ARCHIVE"

      - name: Create 7z archive
        run: |
          7z a -t7z -m0=lzma2:d=16m -mx=7 -ms=off -mf- "spruceV${{ steps.get_version.outputs.version }}.7z" * .tmp_update .system \
            -xr!.git \
            -xr!.github \
            -x!.gitignore \
            -x!.gitattributes \
            -x!create_spruce_release.bat \
            -x!create_spruce_release.sh \
            -x!spruce/flags/developer_mode \
            -xr!App/adbd \
            -x!To-Do.txt \
            -x!.ota_manifest \
            -x!.ota_delete \
            -x!.ota_files

          echo "Archive created: spruceV${{ steps.get_version.outputs.version }}.7z"
          ls -lh "spruceV${{ steps.get_version.outputs.version }}.7z"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if gh release view "v${{ steps.get_version.outputs.version }}" --repo spruceUI/spruceOS >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.get_version.outputs.version }} already exists, will update archives only"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.get_version.outputs.version }} does not exist, will create new draft"
          fi

      - name: Update existing release archives
        if: steps.check_release.outputs.exists == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            spruceV${{ steps.get_version.outputs.version }}.7z
            spruceOTA-${{ steps.previous_release.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z
          tag_name: v${{ steps.get_version.outputs.version }}
          repository: spruceUI/spruceOS
          token: ${{ secrets.PAT_TOKEN }}
          draft: true
          prerelease: false

      - name: Create new draft release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            spruceV${{ steps.get_version.outputs.version }}.7z
            spruceOTA-${{ steps.previous_release.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z
          tag_name: v${{ steps.get_version.outputs.version }}
          name: spruceOS v${{ steps.get_version.outputs.version }}
          body: |
            | Device                | Support Status        |
            |-----------------------|-----------------------|
            | Miyoo Flip            | Stable |
            | Miyoo A30             | Stable |
            | Trimui Smart Pro      | Stable |
            | Trimui Brick          | Stable |
            | Trimui Smart Pro S    | Stable |
            | Trimui Brick Pro      | Stable |
            | Miyoo Mini Flip       | Stable |
            | Miyoo Mini Plus       | Stable |
            | Miyoo Mini v1-4       | Stable |
            | Anbernic RGXX+ series | In Development, testers wanted! |

            > **Anbernic RGXX+ series:** these devices need a modified TF1 image, which you can grab [here](https://github.com/spruceUI/RGXX-images/releases/tag/images). TF2 takes a standard spruceOS installation, so your spruceOS card stays freely swappable between supported devices.

            # What's New

            Check out the wiki for info on ROM folders and apps [Here](https://github.com/spruceUI/spruceOS/wiki)

            Join our Discord [here!](https://discord.gg/sDeaS3TMuJ)

            # Changelog

            ## Bug Fixes
            -

            ## Improvements
            -

            ## Installation

            ## New Installer App
            - Try the all-in-one installer app for a super easy installation!
            - No need to download a release or format your card manually!
            - Compatible versions for Windows, Mac and Linux!
            - Lets you install Stable, Nightlies, Sprig (mini flip only) and Twig (GKD Pixel 2 only) all in one click!

            | Platform | Download |
            |----------|----------|
            | Windows (x64) | [spruceos-installer-windows.exe](https://github.com/spruceUI/spruceOS-Installer/releases/latest/download/spruceos-installer-windows.exe) |
            | macOS (Apple Silicon + Intel) | [SpruceOS-Installer-macOS-Universal.zip](https://github.com/spruceUI/spruceOS-Installer/releases/latest/download/SpruceOS-Installer-macOS-Universal.zip) |
            | Linux x64 | [spruceos-installer-linux-x64.tar.gz](https://github.com/spruceUI/spruceOS-Installer/releases/latest/download/spruceos-installer-linux-x64.tar.gz) |
            | Linux ARM64 | [spruceos-installer-linux-arm64.tar.gz](https://github.com/spruceUI/spruceOS-Installer/releases/latest/download/spruceos-installer-linux-arm64.tar.gz) |
            | Linux ARMv7 | [spruceos-installer-linux-armv7.tar.gz](https://github.com/spruceUI/spruceOS-Installer/releases/latest/download/spruceos-installer-linux-armv7.tar.gz) |
            | Linux i686 (32-bit) | [spruceos-installer-linux-i686.tar.gz](https://github.com/spruceUI/spruceOS-Installer/releases/latest/download/spruceos-installer-linux-i686.tar.gz) |

            These always grab the newest installer — [see all installer releases here](https://github.com/spruceUI/spruceOS-Installer/releases/latest)

            ## Manual Installation
            - Download spruceV${{ steps.get_version.outputs.version }}.7z
            - Extract onto your PC using [7zip](https://www.7-zip.org/download.html)
            - Copy the entire contents to a blank FAT32 formatted SD card.
            - Seriously, use 7zip to extract onto your PC THEN copy the files. IDK why but Windows breaks stuff if you use its built in extraction tool.

            ## OTA Update

            - `spruceOTA-${{ steps.previous_release.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z` contains only the files changed since the previous stable release.
            - It also contains a deletion manifest for files removed since the previous stable release.
            - This package is intended for OTA updates from `${{ steps.previous_release.outputs.tag }}` to `v${{ steps.get_version.outputs.version }}`.

          repository: spruceUI/spruceOS
          token: ${{ secrets.PAT_TOKEN }}
          draft: true
          prerelease: false

      - name: Summary
        run: |
          echo "=========================================="
          echo "✓ Draft release created successfully!"
          echo "=========================================="
          echo "Version: ${{ steps.get_version.outputs.version }}"
          echo "Tag: v${{ steps.get_version.outputs.version }}"
          echo "File: spruceV${{ steps.get_version.outputs.version }}.7z"
          echo ""
          echo "OTA:"
          echo "From: ${{ steps.previous_release.outputs.tag }}"
          echo "From SHA: ${{ steps.previous_release.outputs.sha }}"
          echo "To SHA: ${{ steps.current_commit.outputs.sha }}"
          echo "File: spruceOTA-${{ steps.previous_release.outputs.tag }}-to-v${{ steps.get_version.outputs.version }}.7z"
          echo ""
          echo "Next steps:"
          echo "1. Review the draft release in GitHub UI"
          echo "2. Edit the release notes"
          echo "3. Publish the release"
          echo "4. OTA files will auto-update via update-ota-on-publish.yml"
          echo "=========================================="