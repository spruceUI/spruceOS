# Songo#5 configuration
#
# One key=value per line; lines starting with # are comments. Songo reads this
# file from beside its runtime (this folder). A value of "default"
# leaves the choice to Songo, or to the controller script for your CFW, which
# fills in its own value wherever this file still says "default". Anything you
# set here yourself is kept.
#
# The launcher fills in its values on the first launch only, then creates a
# songo_configs_built file next to this one. Delete songo_configs_built to have
# them worked out again on the next launch.

# --- Music ---
# A music folder for Songo to add, as a full path (eg: /mnt/SDCARD/Music).
# It's added once: removing it in Data and Storage sticks, and a different
# path here gets added on the next launch. "default" adds nothing.
pre_set_music_dir=default

# --- Theme ---
# The theme Songo uses until you pick one in UI and Customization: a theme's
# folder name, either one of Songo's own (SongoClassic, Sakura, XBop, Ringing)
# or an external theme in songo_themes/ or downloaded with Theme Downloader.
# "default", or a theme that can't be found, is Songo Classic.
theme=Spruce

# --- Volume indicator ---
# Set by the launcher on first launch: 1 when your CFW tells Songo about volume
# changes (through chai), so Songo listens for them and shows its volume
# indicator, 0 otherwise.
volume_tcp_server=default

# --- Screen fades ---
# Set by the launcher on first launch: 0 when your CFW can report the screen's
# brightness (through chai), so Songo dims the backlight for screen fades, 1
# when it can't, so Songo fades a black overlay instead.
no_bright_fade_available=default

# --- Developer ---
# true: on the next launch Songo asks you to press a button for each control in
# turn, then saves them to its controller settings and to the ctrl_* keys
# below, and sets this back to false. Pressing a button that's already mapped
# cancels it with nothing changed (it asks again on the next launch).
dev_ctrl_remap=false

# --- Controls ---
# The default button for each control, used on first launch and by "Reset to
# Defaults" in Songo's controller settings. Use Godot's names: JOY_BUTTON_A,
# JOY_BUTTON_B, JOY_BUTTON_X, JOY_BUTTON_Y, JOY_BUTTON_LEFT_SHOULDER,
# JOY_BUTTON_RIGHT_SHOULDER, JOY_BUTTON_START, JOY_BUTTON_BACK,
# JOY_AXIS_TRIGGER_LEFT, JOY_AXIS_TRIGGER_RIGHT, or a key like KEY_ENTER.
ctrl_accept=default
ctrl_back=default
ctrl_shuffle=default
ctrl_quick_menu=default
ctrl_l1=default
ctrl_r1=default
ctrl_l2=default
ctrl_r2=default
ctrl_start=default
ctrl_select=default
