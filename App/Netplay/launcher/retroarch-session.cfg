# Appended to spruce's RetroArch config for netplay sessions only, by
# retroarch.sh (--appendconfig). Outside a session RetroArch runs exactly as
# spruce configured it.

# These settings must not outlive the session. RetroArch writes its config
# back on exit, appended settings included, so without this one a session
# would leave save states off in spruce's own config for good.
config_save_on_exit = "false"

# Save states: a state from one device means nothing to the other. The shim
# also refuses loads; these keep RetroArch from offering them or writing an
# auto state that the next solo launch would resume from.
savestate_auto_save = "false"
savestate_auto_load = "false"
quick_menu_show_save_load_state = "false"
quick_menu_show_undo_save_load_state = "false"
input_save_state = "nul"
input_save_state_btn = "nul"
input_save_state_axis = "nul"
input_load_state = "nul"
input_load_state_btn = "nul"
input_load_state_axis = "nul"

# Both players' ports configured on every device. RetroArch only sets a core's
# controller port devices below input_max_users, and spruce's Miyoo Mini config
# has 1: its fceumm then left Player 2's port at the core default while the
# host's (an A30, 5 users) set a joypad there, so the two consoles disagreed
# about Player 2 and River City Ransom desynced every few hundred frames.
input_max_users = "2"

# Rewind, run-ahead and preemptive frames load states every frame; fast and
# slow motion change the pace of a game the other device is paced against.
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
input_rewind = "nul"
input_rewind_btn = "nul"
input_rewind_axis = "nul"
input_hold_fast_forward = "nul"
input_hold_fast_forward_btn = "nul"
input_hold_fast_forward_axis = "nul"
input_toggle_fast_forward = "nul"
input_toggle_fast_forward_btn = "nul"
input_toggle_fast_forward_axis = "nul"
input_hold_slowmotion = "nul"
input_hold_slowmotion_btn = "nul"
input_hold_slowmotion_axis = "nul"
input_toggle_slowmotion = "nul"
input_toggle_slowmotion_btn = "nul"
input_toggle_slowmotion_axis = "nul"
