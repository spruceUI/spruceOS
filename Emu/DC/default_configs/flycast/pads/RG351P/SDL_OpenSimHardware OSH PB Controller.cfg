; UNVERIFIED pad map for RG351P (OpenSimHardware OSH PB Controller, 1209:3100), from RG351P.cfg's SDL map: raw A=b0 right,
; B=b1 bottom, X=b2 top, Y=b3 left, L2/R2 = b10/b11 buttons, d-pad hat 0 (256-259), left stick raw-inverted (a0~/a1~), right
; stick not. btn_menu left unbound: no guide button, the L3/R3 menu click is spruce's. Not checked on a device.
[analog]
bind0 = 0+:btn_analog_left
bind1 = 0-:btn_analog_right
bind2 = 1+:btn_analog_up
bind3 = 1-:btn_analog_down
bind4 = 2-:axis2_left
bind5 = 2+:axis2_right
bind6 = 3-:axis2_up
bind7 = 3+:axis2_down

[digital]
bind0 = 1:btn_a
bind1 = 0:btn_b
bind2 = 3:btn_x
bind3 = 2:btn_y
bind4 = 6:btn_start
bind5 = 4:btn_z
bind6 = 5:btn_c
bind7 = 10:btn_trigger_left
bind8 = 11:btn_trigger_right
bind9 = 256:btn_dpad1_up
bind10 = 257:btn_dpad1_down
bind11 = 258:btn_dpad1_left
bind12 = 259:btn_dpad1_right

[emulator]
dead_zone = 10
mapping_name = UNVERIFIED spruce RG351P
rumble_power = 100
saturation = 100
version = 3
