# DSperate settings tuned to feel like DraStic's defaults. Copy to
# ~/.config/dsperate/dsperate.ini (or pass --config configs/drastic.ini).
# Only keys that differ from DSperate's own defaults (configs/default.ini)
# are set; anything DraStic has no equivalent for keeps the DSperate default.
#
# DraStic is a controller-first handheld emulator: its fast forward is a
# toggle rather than a held button, its menu button is the pad's mode/home
# key, it draws without filtering, and it has no idle-loop skip or CPU
# interleave setting (its own timing model is described in
# docs/techniques/07-drastic-game-hacks.md).

[video]
layout = vertical
linear = false                  # DraStic's default screen filter is "none"
vsync = true

[audio]
volume = 100
mic = true

[emu]
jit = true
quantum = 0                     # event-bound: the closest thing to DraStic's timing
idle_skip = 1
ff_speed = 0                    # DraStic's fast forward is uncapped
ff_skip = 3

[pad]
a = b
b = a
x = y
y = x
l = leftshoulder
r = rightshoulder
start = start
select = back
stick_dpad = true
stylus_axis = right
stylus_button = rightstick

[hotkeys]
fast_forward = none             # toggled, as in DraStic, rather than held
fast_forward_toggle = Tab

[padhotkeys]
modifier = guide
fast_forward = none
fast_forward_toggle = mod++righttrigger
save_state = mod+rightshoulder
load_state = mod+leftshoulder
quit = mod+start+back
pause = mod+start                # opens the pause menu
layout_next = mod+back
screenshot = mod+y
