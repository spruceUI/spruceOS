# DSperate settings tuned to feel like melonDS's defaults. Copy to
# ~/.config/dsperate/dsperate.ini (or pass --config configs/melonds.ini).
# Only keys that differ from DSperate's own defaults (configs/default.ini)
# are set; anything melonDS has no equivalent for keeps the DSperate default.
#
# Sources: melonDS's Config.cpp defaults and its input-config dialog. Where a
# melonDS action has no DSperate counterpart (per-slot F1..F8 states, reset)
# the nearest thing is used and noted.

[video]
layout = vertical
linear = true                   # melonDS "screen filtering" is on by default

[audio]
volume = 100
mic = true

[emu]
jit = false                     # melonDS ships with the JIT off
quantum = 128                   # melonDS's fixed 128-cycle ARM9/ARM7 interleave
idle_skip = 0                   # melonDS has no idle-loop skip
ff_speed = 0                    # unlimited, like its "fast forward" with the FPS limit off

[keys]
a = x
b = z
x = s
y = a
l = q
r = w
start = Return
select = Right Shift
up = Up
down = Down
left = Left
right = Right

[hotkeys]
modifier = Left Shift           # melonDS saves with Shift+F1..F8 and loads with F1..F8;
save_state = mod+F1             # DSperate has one current slot, so Shift+F1 / F1 work
load_state = F1                 # that slot and F2/F3 (default) step through the others
fast_forward = Tab
fast_forward_toggle = none
fullscreen = F11
lid = Backspace
pause = none                    # unbound in melonDS (menu only)
quit = none
screenshot = none
volume_up = none
volume_down = none
mute = none
mic = none
