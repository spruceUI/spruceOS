# DSperate settings matching Knulli's "Advanced DraStic" hotkey scheme
# (https://knulli.org/play/hotkey-shortcuts/#advanced-drastic-hotkey-shortcuts).
# Copy over ~/.config/dsperate/dsperate.ini or pass --config. Everything not
# set here is DSperate's default (configs/default.ini); see configs/drastic.ini
# for DraStic's own defaults.
#
# Knulli's Function key is the pad's mode/home button, our "mod". Button
# names are SDL's, which go by position: DS A is the pad's "b", B is "a",
# X is "y", Y is "x". Knulli's L2/R2 are the triggers.

[padhotkeys]
modifier = guide
quit = mod+start                     # Function + Start
# Function + Select: d-pad/analog toggle (no equivalent; stick_dpad is always on)
# Function + Up: emulator menu (no menu yet)
save_state = mod+dpdown              # Function + Down
load_state = mod+dpright             # Function + Right
# Function + Left: blur toggle (video.linear; no hotkey yet)
layout_next = mod+b                  # Function + A: next screen layout
layout_prev = mod+a                  # Function + B: previous screen layout
fast_forward = mod+x                 # Function + Y, held
# Function + X: next bezel (no bezels)
screen_swap = +lefttrigger           # L2: swap first/second screen
# R2 is also Knulli's mic input; here the stylus click claims it first, so
# the mic stays on the default binding (left stick click).
mic = leftstick
slot_next = none
slot_prev = none
pause = none

[pad]
stylus_button = +righttrigger        # R2 touches with the crosshair
