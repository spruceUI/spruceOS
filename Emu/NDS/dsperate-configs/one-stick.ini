# DSperate settings. Command-line flags override this file. Two files next
# to it override it for one game: games/<rom name>.ini (the ROM's filename
# without .nds) and games/<GAMECODE>.ini (the four letters printed as
# "game: ... [XXXX]" at start); the filename one wins, and is where a layout
# picked with the hotkey is remembered.
# Every line is a comment showing the default; delete the # to change one.


[paths]
bios9 = /mnt/SDCARD/BIOS/nds/bios9.bin
bios7 = /mnt/SDCARD/BIOS/nds/bios7.bin
firmware = /mnt/SDCARD/BIOS/nds/firmware.bin
games = /mnt/SDCARD/Roms/NDS 
saves = /mnt/SDCARD/Saves/saves/dsperate
states = /mnt/SDCARD/Saves/states/dsperate
screenshots = /mnt/SDCARD/Saves/screenshots
cheats = /mnt/SDCARD/Emu/NDS/usrcheat.dat


[loader]
# The card the DS menu shows on a firmware boot. It is built into the emulator,
# so nothing has to be shipped beside it; a BootMenu.nds next to this file
# replaces it entirely, which is how a card with your own icon from
# tools/mkcart.py is used.
# title = Game Menu             # first banner line
# subtitle = Dariragan! Dagozuban!   # second line; empty for a one-line banner
# card = true                   # false boots the firmware with the slot empty

[video]
fullscreen = true
pip_alpha = 0.67


[audio]
mic = false


[emu]
cpu_oc = true
autosave = true
frameskip = 1
frameskip_capture = true


# DS buttons: a b x y l r start select up down left right.
# Keyboard values are SDL key names ("x", "Return", "Right Shift", "F5").
[keys]
# a = x
# b = z
# x = s
# y = a
# l = q
# r = w
# start = Return
# select = Right Shift
# up = Up
# down = Down
# left = Left
# right = Right

# Controller values are SDL controller button names (a b x y back guide
# start leftstick rightstick leftshoulder rightshoulder dpup dpdown dpleft
# dpright) or axes (+leftx -lefty +righttrigger ...). SDL names buttons by
# position, so the DS's A is the pad's "b".
[pad]
# a = b
# b = a
# x = y
# y = x
# l = leftshoulder
# r = rightshoulder
# start = start
# select = back
# up = dpup
# down = dpdown
# left = dpleft
# right = dpright
# stick_dpad = true             # left stick also works the d-pad
# stick_deadzone = 12000
stylus_axis = left              # right | left | none: the stick that moves the pen over the
                                # bottom screen (left takes the stick away from the d-pad)
# stylus_dpad = none            # a button; while held the d-pad moves the pen (e.g. leftshoulder)
stylus_button = +lefttrigger    # touches at the pen's position
# stylus_speed = 4.0            # pen pixels per frame at full tilt
# stylus_size = 2               # crosshair scale: arm width and centre dot, DS pixels (scaled up by the
                                # view's reduction when the bottom screen is the PiP inset / dominant secondary)
# stylus_hide = 90              # frames idle before the crosshair hides (0 = never shown)


[hotkeys]
quit = none


[padhotkeys]
# modifier = guide
quit = mod+a
pause = mod+y
fast_forward = +righttrigger
fast_forward_toggle = mod++righttrigger
# save_state = mod+rightshoulder
# load_state = mod+leftshoulder
# slot_next = mod+dpright
# slot_prev = mod+dpleft
# volume_up = none
# volume_down = none
layout_next = mod+dpup
layout_prev = mod+dpdown
screen_swap = mod++lefttrigger
# pip_corner_next = none
screenshot = mod+b
# mic = leftstick
fps = mod+x