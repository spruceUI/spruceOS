# DSperate settings. Command-line flags override this file. Two files next
# to it override it for one game: games/<rom name>.ini (the ROM's filename
# without .nds) and games/<GAMECODE>.ini (the four letters printed as
# "game: ... [XXXX]" at start); the filename one wins, and is where a layout
# picked with the hotkey is remembered.
# Every line is a comment showing the default; delete the # to change one.

[user]


[paths]
bios9 = /mnt/SDCARD/BIOS/nds/bios9.bin
bios7 = /mnt/SDCARD/BIOS/nds/bios7.bin
firmware = /mnt/SDCARD/BIOS/nds/firmware.bin
games = /mnt/SDCARD/Roms/NDS 
saves = /mnt/SDCARD/Saves/saves/dsperate
states = /mnt/SDCARD/Saves/states/dsperate
screenshots = /mnt/SDCARD/Saves/screenshots
cheats = /mnt/SDCARD/Emu/NDS/usrcheat.dat


[loader]


[video]
fullscreen = true
layout = single 
vsync = false


[audio]
mic = false


[cart]


[emu]
cpu_oc = true
timing_oc = true
fast_load = true
autosave = true
autoload = true
ff_skip = 4
frameskip = 3


[keys]


[pad]
stylus_axis = left              # right | left | none: the stick that moves the pen over the
stylus_button = +lefttrigger    # touches at the pen's position


[hotkeys]
quit = none


[padhotkeys]
quit = mod+a
pause = mod+y
fast_forward = +righttrigger
fast_forward_toggle = mod++righttrigger
layout_next = mod+dpup
layout_prev = mod+dpdown
screen_swap = mod++lefttrigger
screenshot = mod+b
fps = mod+x


[cheevos]
enabled = true
