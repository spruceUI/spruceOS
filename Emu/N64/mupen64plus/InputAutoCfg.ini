; Powkiddy RGB30 (dArkMoss). Its pad enumerates as "retrogame_joypad", which
; matched no section above, so mupen fell back to [Keyboard] and the only input
; reaching the game was the couple of keys gptokeyb2 synthesises - d-pad, stick,
; Start and the shoulders were all dead.
;
; Two things stop the Xbox entry above from being reusable here: that pad
; reports its d-pad as BUTTONS b13-b16 rather than hat(0), and its triggers are
; buttons rather than analog axes.
;
; Mapped entirely from the joystick, deliberately - no key() entries. The Xbox
; section takes A/B from gptokeyb2 as key(97)/key(98); doing that here would let
; gptokeyb2 fire a second, wrong button alongside the real one. With no key()
; bindings in this section gptokeyb2's output simply goes nowhere.
;
; Button and axis numbers are the ones in RGB30.cfg's SDL_GAMECONTROLLER_MAP,
; which its comment records as read off the hardware from SDL rather than
; derived.
;
; A is SOUTH (b0) and B is WEST (b3), not the buttons marked A and B. That is
; spruce's convention for N64 and it mirrors the real controller, where the big
; A sits at the bottom and B is up and to its left. defkeys.gptk already encodes
; the same thing for the devices that reach mupen through gptokeyb2 - its
; "B->A button" and "Y->B button" comments mean physical B (south) becomes N64
; A and physical Y (west) becomes N64 B. On this pad b0=BTN_SOUTH is the button
; marked B and b3=BTN_WEST is the one marked Y.
[Linux: retrogame_joypad]
plugged = True
mouse = False
AnalogDeadzone = 4096,4096
AnalogPeak = 32768,32768
DPad R = button(16)
DPad L = button(15)
DPad D = button(14)
DPad U = button(13)
Start = button(9)
Z Trig = button(6)
B Button = button(3)
A Button = button(0)
C Button R = axis(2+,2400)
C Button L = axis(2-,2400)
C Button D = axis(3+,2400)
C Button U = axis(3-,2400)
R Trig = button(5)
L Trig = button(4)
Mempak switch = key(44)
Rumblepak switch = key(46)
X Axis = axis(0-,0+)
Y Axis = axis(1-,1+)
