; UNVERIFIED (not device-tested) Spruce N64 layout, RG351P (OpenSimHardware OSH PB Controller, 1209:3100): B/Y = N64 A/B, L2/L1/R1 = Z/L/R, A/X/R2 = C-Down/Left/Right, right stick = C too, d-pad = hat 0;
; Raw SDL numbers from RG351P.cfg SDL_GAMECONTROLLER_MAP (left stick inverted, a0~/a1~, as in ROCKNIX RK3326 mupen64plus-sa default.ini); L3/R3 (b8/b9) left free for the menu-button hotkeys. Copied over InputAutoCfg.ini at each launch.
[Keyboard]
plugged = True
mouse = False
DPad R = key(100)
DPad L = key(101)
DPad D = key(115)
DPad U = key(119)
Start = key(13)
Z Trig = key(122)
B Button = key(98)
A Button = key(97)
C Button R = key(108)
C Button L = key(106)
C Button D = key(107)
C Button U = key(105)
R Trig = key(99)
L Trig = key(120)
Mempak switch = key(44)
Rumblepak switch = key(46)
X Axis = key(276,275)
Y Axis = key(273,274)

[Linux: OpenSimHardware OSH PB Controller]
plugged = True
mouse = False
AnalogDeadzone = 4096,4096
AnalogPeak = 32768,32768
DPad R = hat(0 Right)
DPad L = hat(0 Left)
DPad D = hat(0 Down)
DPad U = hat(0 Up)
Start = button(6)
Z Trig = button(10)
B Button = button(3)
A Button = button(1)
C Button R = axis(2+,2400) button(11)
C Button L = axis(2-,2400) button(2)
C Button D = axis(3+,2400) button(0)
C Button U = axis(3-,2400)
R Trig = button(5)
L Trig = button(4)
Mempak switch = key(44)
Rumblepak switch = key(46)
