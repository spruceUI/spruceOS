  #########################################
#####   RetroArch   #####
  #########################################
# Raw joypad button indices - RetroArch's hotkey binds do not go through the
# joypad autoconfig the way the player binds do, so these are driver-numbered.
#
# These are the udev numbers, which the shipped
# retroarch-AnbernicRG_XX-universal.cfg is written against. RetroArch's linuxraw
# driver numbers the pad identically, so the 32-bit build is covered too. The
# 64-bit build drives the pad through SDL2, which
# numbers the same buttons three higher - it enumerates the volume and power
# keys on this node first - so Select is 9 and Start 10 there. That correction
# happens in apply_xx_hotkey_for_driver, once the binary is known.
#
# Measured on an RG CubeXX by pressing each button and logging both the SDL
# index and the evdev code. Worth knowing before touching any of this: the pad
# hands out evdev codes in its own button order rather than semantically, so
# BTN_C is the Y button and BTN_Z is R1. They look like phantom buttons and are
# not.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="6"
# Was "3", which is the X button under every driver on this line. Nobody who
# picked "Start" in the menu ever got Start.
RA_START_VAL="7"
RA_HOME_VAL="14"
