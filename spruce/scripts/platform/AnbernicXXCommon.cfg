export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="/dev/input/event1"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/event1"
export EVENT_PATH_POWER="/dev/input/event0"


export B_POWER="1 116"
    
