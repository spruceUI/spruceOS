export B_VOLUP="1 115" # has actual key codes like the buttons
export B_VOLUP_2="1 115" # only registers 0 on release, no 1.
export B_VOLDOWN="1 114" # has actual key codes like the buttons
export B_VOLDOWN_2="1 114" # only registers 0 on release, no 1.
export B_MENU="1 312" #both 312 and 354 are being fired off?
export B_HOME="DOESNT_EXIST"

export STICK_LEFT="3 2 -4096" # negative for left
export STICK_RIGHT="3 2 4096" # positive for right
export STICK_UP="3 3 -4096"   # negative for up
export STICK_DOWN="3 3 4096"  # positive for down

