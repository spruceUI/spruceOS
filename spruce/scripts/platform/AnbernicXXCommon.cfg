#!/bin/sh

# NOTE: many of these values are unverified.

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Anbernic"
# Empty on purpose: spruce does not update BaseOS. firmwareUpdate.sh rejects
# this BRAND before it reads any of these, so nothing consumes them.
export FW_FILE=""
export TARGET_FW_VERSION=""
export REQ_MB_TO_UPDATE_FW=""
# Shared by the whole XX line: spruce is built around one card in many devices,
# so these settings travel with the card instead of staying on the device they
# were set on.
export SYSTEM_JSON="/mnt/SDCARD/Saves/anbernic-rg-xx-system.json"
export SD_DEV="/dev/mmcblk1p1"
# BaseOS mounts the card at /mnt/sdcard and makes /mnt/SDCARD a symlink to it.
# Anything that compares this against /proc/mounts - unmount_all, stage 2's kill
# loop - reads the resolved path, so the symlinked form silently matches nothing
# and the shutdown unmounts nothing. Flip.cfg uses the lowercase form for the
# same reason.
export SD_MOUNTPOINT="/mnt/sdcard"
export PLATFORM_ARCHITECTURE="aarch64"


  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

export DISPLAY_TEXT_ELF_WIDTH="not applicable"
export DISPLAY_ROTATION="0"

  ########################
#####   CPU SETTINGS   #####
  ########################

# root@ANBERNIC:/sys/devices/system/cpu/cpu0/cpufreq# cat scaling_available_frequencies
# 480000 720000 936000 1008000 1104000 1200000 1320000 1416000 1512000
export DEVICE_MIN_CORES_ONLINE=0123
export CPU_SMART_CORES_ONLINE=0123
export DEVICE_MAX_CORES_ONLINE=0123
export DEVICE_POWERSAVE_LOW_FREQ=480000
export DEVICE_POWERSAVE_HIGH_FREQ=1512000
export CPU_SMART_MIN_FREQ=480000
export CPU_PERF_MAX_FREQ=1512000
export CPU_OVERCLOCK_MAX_FREQ=1512000
export CONSERVATIVE_POLICY_DIR="/tmp"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export BATTERY="/sys/class/power_supply/axp2202-battery"
export LED_PATH=""
export DEVICE_BRIGHTNESS_PATH=""
# Not applicable: the XX line has no rumble GPIO. There is no /sys/class/motor,
# no timed_output, no exported gpio and nothing named vibra/motor anywhere in
# sysfs. The motor is driven through evdev force feedback on the pad itself -
# "ANBERNIC-keys" advertises EV_FF, and its FF bitmask decodes to FF_RUMBLE,
# FF_PERIODIC, SQUARE, TRIANGLE, SINE and GAIN. Confirmed on an RG SP by
# uploading an FF_RUMBLE effect to /dev/input/event1 and playing it: the motor
# buzzes. So this uses the Pixel2's approach rather than the GPIO one that
# Flip, Brick and SmartPro use, and EVENT_PATH_READ_INPUTS_SPRUCE below is
# already the right node.
export RUMBLE_GPIO="not applicable"

  ###############################################
#####   SOFTWARE CHARACTERISTICS AND QUIRKS   #####
  ###############################################

export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin:/mnt/SDCARD/spruce/bin64"
# The only SDL2 that can reach this panel is the mali-fbdev build staged in
# dll-mali. RetroArch and every other emulator inherit this path; PyUI sets its
# own in launch.sh.
export LD_LIBRARY_PATH="/mnt/SDCARD/App/PyUI/dll-mali:/mnt/SDCARD/spruce/flip/lib:/usr/lib:/usr/lib/aarch64-linux-gnu"
export SPRUCE_ETC_DIR="/mnt/SDCARD/trimui/etc"

# SDL gamecontroller mapping for the built-in pad, consumed by SDL emulators
# under BaseOS (which ships no mapping for it). Every H700 Anbernic reports the
# same GUID and name "ANBERNIC-keys", so SDL cannot tell models apart - we pick
# the map by the exact BASEOS_TARGET instead. Face/dpad/shoulders/guide/start/
# select and the left stick are identical across the line; only the triggers and
# stick-clicks move: devices WITH analog sticks put L3/R3 at b12/b15 and shift
# L2/R2 to b13/b14, while stickless devices have no L3/R3 and keep L2/R2 at
# b12/b13. Indices verified live on the CubeXX and cross-checked against every
# MustardOS rgXX sdl_map.
_XX_GC_STICK="19000000010000000100000000010000,ANBERNIC-keys,a:b3,b:b4,x:b6,y:b5,leftshoulder:b7,rightshoulder:b8,lefttrigger:b13,righttrigger:b14,guide:b11,start:b10,back:b9,dpup:h0.1,dpdown:h0.4,dpleft:h0.8,dpright:h0.2,leftx:a0,lefty:a1,leftstick:b12,rightx:a2,righty:a3,rightstick:b15,platform:Linux,"
_XX_GC_NOSTICK="19000000010000000100000000010000,ANBERNIC-keys,a:b3,b:b4,x:b6,y:b5,leftshoulder:b7,rightshoulder:b8,lefttrigger:b12,righttrigger:b13,guide:b11,start:b10,back:b9,dpup:h0.1,dpdown:h0.4,dpleft:h0.8,dpright:h0.2,leftx:a0,lefty:a1,platform:Linux,"
# Name the stickless models; everything else, known or new, takes the stick
# map. Most of the line has sticks, so an unrecognised target is likelier to
# be right that way round. Known stick targets: rg34xxsp, rg35xxh,
# rg35xxpro, rg40xxh, rg40xxv, rgcubexx.
case "$(sed -n 's/^BASEOS_TARGET=//p' /etc/baseos-release 2>/dev/null)" in
    rg28xx|rg34xx|rg35xxplus|rg35xxsp|rgsp)
        export SDL_GAMECONTROLLER_MAP="$_XX_GC_NOSTICK" ;;
    *)
        export SDL_GAMECONTROLLER_MAP="$_XX_GC_STICK" ;;
esac

# BaseOS ships a BusyBox userland with no python at all, so use the aarch64
# runtime we already bundle for the Miyoo Flip - same architecture, and
# spruce/flip/lib is on LD_LIBRARY_PATH above. Named unconditionally rather than
# probed: the bundled one is the only interpreter that carries the site-packages
# spruce needs (sdl2, psutil, serial), so preferring a system python if one ever
# appeared would be a downgrade, not a fallback.
export DEVICE_PYTHON3_PATH="/mnt/SDCARD/spruce/flip/bin/python3.10"
export DEVICE_SUPPORTS_PORTMASTER="true"

# Ports run outside the platform cfg's own LD_LIBRARY_PATH, so name the two
# directories a port actually needs: the mali SDL2 that can reach this panel,
# and the aarch64 runtime the bundled python and PortMaster helpers link
# against. Without this run_port builds LD_LIBRARY_PATH with a leading empty
# entry, which means "the current directory".
export PORTS_LD_LIBRARY_PATH="/mnt/SDCARD/App/PyUI/dll-mali:/mnt/SDCARD/spruce/flip/lib:/usr/lib:/usr/lib/aarch64-linux-gnu:/mnt/SDCARD/spruce/h700/ports-lib64"
export DEVICE_CAN_USE_EXTERNAL_CONTROLLER="false"
export DEVICE_USES_64_BIT_RA="true"
# The 32-bit RA option had two blockers here and both are now gone.
#
# BaseOS harvests exactly one armhf library - libc.so.6, and only so the vendor
# bluetooth binary runs - with no 32-bit SDL2, GL or ALSA behind it, so
# ra32.universal could not load at all. spruce ships the 32-bit closure itself in
# spruce/h700/lib32 (17 libs; BaseOS supplies the remaining armhf loader and
# libc from its own harvest) and setup_for_retroarch puts them on
# LD_LIBRARY_PATH. Upstream was asked to harvest them instead and preferred not
# to widen BaseOS, so we carry them - consistent with the Mali blobs spruce
# already ships for Flip, Brick and Mini.
#
# Input was the second blocker: the 32-bit SDL2 dlopens libudev and enumerates
# nothing where no udevd runs. RetroArch's linuxraw joypad driver reads the
# legacy js0 instead and needs no udev, so the 32-bit build uses that via
# retroarch-AnbernicRG_XX-baseos32.cfg. Verified on a CubeXX: ra32.h700 loads
# and runs, and RetroArch reports "ANBERNIC-keys configured in port 1".
export DEVICE_HAS_32_BIT_RA="true"

# The H700-tuned RetroArch. ra64.universal runs here too, but its "gl" driver
# has no fbdev context to fall back on, so it reaches the Mali blob the long way
# round through SDL2; ra64.h700 is built --enable-mali_fbdev and talks to it
# directly. RA_BIN_64 keeps the per-game raBuild selector honest - see
# run_retroarch() in ra_functions.sh.
export RA_BIN="ra64.h700"
export RA_BIN_64="ra64.h700"
export RA_BIN_32="ra32.h700"
# Relative name (like every other device), so PPSSPP launches as
# ./PPSSPPSDL_h700 from EMU_DIR - button_actions.sh detects the running emulator
# with `pgrep -f "./PPSSPPSDL"`, which an absolute path would miss.
export PSP_BIN="PPSSPPSDL_h700"
export MUPEN_DIR="mupen64plus"
export PCSX_BIN="pcsx_64"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

