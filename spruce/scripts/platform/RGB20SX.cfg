#!/bin/sh
# Powkiddy RGB20SX on dArkMoss: the RGB30 board with an RTL8723DS radio and a
# 5000mAh battery, booting the RGB30 image. Only what differs is set here.

. /mnt/SDCARD/spruce/scripts/platform/RGB30.cfg

export SYSTEM_JSON="/mnt/SDCARD/App/PyUI/config/rgb20sx-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/rgb30/rgb20sx-system.json"
export PLATFORM_MIGRATE_FROM="RGB30"

# It has the FN key the RGB30 lacks, so both stick clicks stay L3/R3.
export B_MENU="1 316"        # BTN_MODE
export B_L3="1 317"
export B_R3="1 318"
