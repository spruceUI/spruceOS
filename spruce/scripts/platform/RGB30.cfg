#!/bin/sh
# Powkiddy RGB30 (RK3566, 720x720) on dArkMoss. The base OS side is in
# dArkMossCommon.cfg; only the panel, pad and codec facts live here.

. /mnt/SDCARD/spruce/scripts/platform/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Powkiddy"
# PyUI reads and writes its system config beside the app; the shell must read
# the same file or volume at boot is whatever the mixer powered on at.
export SYSTEM_JSON="/mnt/SDCARD/App/PyUI/config/rgb30-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/rgb30/rgb30-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# Square 1:1 panel, same geometry as the RG CubeXX.
export DISPLAY_WIDTH="720"
export DISPLAY_HEIGHT="720"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="1:1"
export DISPLAY_TEXT_ELF_WIDTH="680"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export RUMBLE_PWMCHIP="pwmchip1"
# Path VALUES are inverted on this hardware: "HP" selects the speaker and
# "SPK" the headphones. Confirmed by the device's own 002-audio_path and MinUI.
export AUDIO_PATH_SPK="HP"
export AUDIO_PATH_HP="SPK"
export DEVICE_NUM_ANALOG_STICKS=2
# dArkOS's PortMaster support is first-class and glibc 2.41 is real, so
# harbourmaster offers more here than on any other spruce device. Controller
# mapping and the mod_<CFW_NAME>.txt shim are still open.
export DEVICE_SUPPORTS_PORTMASTER="true"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# singleadc-joypad WITHOUT the rocknix- prefix (MinUI's keymon reads
# /sys/bus/platform/devices/singleadc-joypad/hp); the Rocknix spelling is
# probed second so a Rocknix card does not silently bind nothing.
export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-singleadc-joypad-event-joystick /dev/input/by-path/platform-rocknix-singleadc-joypad-event-joystick"
export PAD_NAME_CANDIDATES=""
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-singleadc-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# Layout: rk805 pwrkey event0, adc-keys event1, gpio-keys event2 (the volume
# rocker), retrogame_joypad event3. device_init resolves and persists them.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export SPRUCE_INPUT_NODES_FILE="/tmp/rgb30_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

# No menu button on this device, so one stick click becomes one: Button
# Settings > Menu button. get_config_value is not defined yet at this point,
# so read the file directly; anything but R3 leaves the L3 default.
_rgb30_menu_button="$(jq -r '.menuOptions."Button Settings".menuButton.selected // "L3"' \
    /mnt/SDCARD/Saves/spruce/spruce-config.json 2>/dev/null)"
if [ "R3" = "$_rgb30_menu_button" ]; then
    export B_MENU="1 318"        # BTN_THUMBR
    export B_L3="1 317"
    export B_R3="DOESNT_EXIST"
else
    export B_MENU="1 317"        # BTN_THUMBL
    export B_L3="DOESNT_EXIST"
    export B_R3="1 318"
fi
unset _rgb30_menu_button

export B_START="1 315"
export B_SELECT="1 314"
export B_HOME="DOESNT_EXIST"

# Label-named like the Anbernic line: SDL's positional b0 is 304, which is the
# button marked B on this case, so a and b are swapped from SDL's built-in map.
# `export_sdl_gamecontroller_map positional` swaps them back for callers that
# want SDL convention. GUID and indices read off the hardware from SDL itself.
export SDL_GAMECONTROLLER_MAP="19009b4d4b4800000111000000010000,retrogame_joypad,a:b1,b:b0,x:b2,y:b3,back:b8,guide:b10,start:b9,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b11,rightstick:b12,dpup:b13,dpdown:b14,dpleft:b15,dpright:b16,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 2"
export STICK_RIGHT_2="3 2"
export STICK_UP_2="3 3"
export STICK_DOWN_2="3 3"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH="/sys/class/extcon/hdmi/cable.0/state"
export HDMI_WIDTH="1280"
export HDMI_HEIGHT="720"
export HEADPHONE_STATE_PATH="/sys/bus/platform/devices/singleadc-joypad/hp"

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# 0-255 panel; MinUI's SetBrightness table, tuned on this hardware.
export SYSTEM_BRIGHTNESS_0="4"
export SYSTEM_BRIGHTNESS_1="6"
export SYSTEM_BRIGHTNESS_2="10"
export SYSTEM_BRIGHTNESS_3="16"
export SYSTEM_BRIGHTNESS_4="32"
export SYSTEM_BRIGHTNESS_5="48"
export SYSTEM_BRIGHTNESS_6="64"
export SYSTEM_BRIGHTNESS_7="96"
export SYSTEM_BRIGHTNESS_8="128"
export SYSTEM_BRIGHTNESS_9="192"
export SYSTEM_BRIGHTNESS_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

# udev driver numbers this pad the same way SDL does: 8 SELECT, 9 START.
# RA_HOME_VAL is unverified; the device has no home button.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="11"
