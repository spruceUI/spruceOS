#!/bin/sh
# Powkiddy RGB30 platform specific variables.
#
# The RGB30 runs dArkMoss on TF1 - our fork of dArkOS, which is Debian trixie -
# handing control to spruce on TF2. See github.com/spruceUI/dArkMoss.
#
# Two things make this platform unlike the others:
#   - The rootfs is a mutable btrfs volume on TF1, not a read-only image, so
#     things written under / do persist. TF2 is a separate card, mounted at
#     /mnt/SDCARD by the base image before spruce starts.
#   - Networking is NetworkManager, not a bare wpa_supplicant. See RGB30.sh.
#     (Both of these read "squashfs" and "connman" until 2026-08-29 - stale
#     MossySpruce/JELOS text that outlived the move to a Debian base and had
#     already produced one real bug in the WiFi toggle.)
#
# The SoC is the same RK3566 as the Miyoo Flip, so the CPU and GPU sections
# below start from Flip.cfg. Anything marked UNVERIFIED still needs measuring
# on hardware.

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Powkiddy"
# PyUI (devices/rgb30/rgb30.py) reads and writes its system config at
# App/PyUI/config/rgb30-system.json, not the Saves/ path the miyoo devices use.
# The shell must read the SAME file or the two disagree - which is exactly what
# left volume screaming at boot: set_volume_to_config read a Saves/ file that
# never existed, so it never applied the configured level (vol=0) and the mixer
# stayed at its power-on max. Point both at PyUI's file.
export SYSTEM_JSON="/mnt/SDCARD/App/PyUI/config/rgb30-system.json"
export PLATFORM_ARCHITECTURE="aarch64"

# TF2 is mounted at /mnt/SDCARD by dArkMoss's mount-spruce.sh, which waits for
# the card and picks the device itself, so discover the node from /proc/mounts
# rather than hardcoding it - it is mmcblk2p1 on this board but that depends on
# probe order.
export SD_MOUNTPOINT="/mnt/SDCARD"
export SD_DEV="$(awk '$2=="/mnt/SDCARD"{print $1; exit}' /proc/mounts 2>/dev/null)"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# Square 1:1 panel, the same geometry as the Anbernic RG CubeXX, so the
# existing 720x720 themes and PyUI layouts apply unchanged.
export DISPLAY_WIDTH="720"
export DISPLAY_HEIGHT="720"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="1:1"
export DISPLAY_TEXT_ELF_WIDTH="680"

  ########################
#####   CPU SETTINGS   #####
  ########################

# RK3566, four Cortex-A55. Frequency table is the SoC's, shared with the Flip.
#408000 600000 816000 1104000 1416000 1608000 1800000 1992000
export DEVICE_MIN_CORES_ONLINE=0
export DEVICE_MAX_CORES_ONLINE=0123
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1104000

export CPU_SMART_CORES_ONLINE=0123
export CPU_SMART_GOVENOR="ondemand"
export CPU_SMART_MIN_FREQ=408000
export CPU_SMART_MAX_FREQ=1800000
export CPU_PERF_MAX_FREQ=1800000
export CPU_OVERCLOCK_MAX_FREQ=1992000
export CONSERVATIVE_POLICY_DIR=/sys/devices/system/cpu/cpu0/cpufreq/conservative

# NOT the Flip's /sys/class/devfreq/dmc, despite the shared SoC. Taken from a
# live RGB30's 010-governors, which names the Mali devfreq node directly.
export GPU_GOVENOR_DIR="/sys/devices/platform/fde60000.gpu/devfreq/fde60000.gpu"

# Read off the hardware rather than inherited. On the Flip these GPU_* variables
# do not address a GPU at all - GPU_GOVENOR_DIR there is /sys/class/devfreq/dmc -
# so the Flip's values are the memory controller's:
#
#   DMC steps: 324000000 528000000 780000000 1056000000
#   GPU steps: 800000000 700000000 600000000 400000000 300000000 200000000
#
# This file repointed the directory at the real Mali node but kept the Flip's
# numbers, so every value below named a frequency the GPU cannot select. 324000000
# is the DMC's MINIMUM; as a GPU ceiling it left powersave pinning the GPU at
# 200MHz of 800 in every mode, permanently.
export GPU_SMART_GOVERNOR="simple_ondemand"
export GPU_SMART_MAX_FREQ="800000000"
export GPU_PERFORMANCE_GOVERNOR="performance"
export GPU_PERFORMANCE_MAX_FREQ="800000000"
# 800MHz is the top step, so there is no headroom above PERFORMANCE. Overclock
# repeats it rather than naming a frequency that does not exist.
export GPU_OVERCLOCK_GOVERNOR="performance"
export GPU_OVERCLOCK_MAX_FREQ="800000000"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export BATTERY="/sys/class/power_supply/battery"
# A live RGB30 reports DEVICE_LED_CONTROL=true and DEVICE_LED_CHARGING=true, so
# there is an LED - the sysfs path just has not been captured yet.
export LED_PATH="not applicable"
export RUMBLE_PWMCHIP="pwmchip1"           # from the device's 020-gpios
# Speaker and headphone path names are INVERTED on this hardware: the value for
# the speaker is "HP" and for headphones is "SPK". Straight from the device's
# 002-audio_path, and MinUI's msettings.c agrees.
export AUDIO_PATH_CONTROL="Playback Path"
export AUDIO_PATH_SPK="HP"
export AUDIO_PATH_HP="SPK"
export DEVICE_BRIGHTNESS_PATH="/sys/class/backlight/backlight/brightness"  # confirmed in MinUI msettings.c

  ###############################################
#####   SOFTWARE CHARACTERISTICS AND QUIRKS   #####
  ###############################################

# dArkMoss is a full Debian trixie userland with its own /usr, so the system
# paths come first and we append ours - the reverse of the BusyBox platforms.
export PATH=/mnt/SDCARD/spruce/bin64:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
# /usr/lib/aarch64-linux-gnu, not just /usr/lib: this is a Debian aarch64 base,
# so that is where the system libraries actually are. Without it the /usr/lib
# entry resolves almost nothing and the base is effectively absent from the path.
#
# NOTE, not yet acted on - same note as the RGB30 block in App/PyUI/launch.sh,
# and this file is the wider blast radius of the two because it covers the whole
# spruce process tree, RetroArch included. flip/lib sitting ahead of the system
# dirs is backwards on a Debian base: it carries 59 buster-era libraries trixie
# also ships, among them libsystemd (LIBSYSTEMD_245 against the base's 257),
# libwayland-client and libdecor-0, all of which SDL2 dlopens. Nothing in spruce
# is known to be broken by it today, and this ordering is the one the RGB30 is
# known to boot with, so reordering is a deliberate hardware test rather than a
# tidy-up. Do it on its own, not folded into another change.
export LD_LIBRARY_PATH="/mnt/SDCARD/spruce/flip/lib:/usr/lib/aarch64-linux-gnu:/usr/lib:/lib"
export SPRUCE_ETC_DIR="/mnt/SDCARD/Saves/spruce/etc"
export DEVICE_PYTHON3_PATH=/mnt/SDCARD/spruce/flip/bin/python3

export DEVICE_CAN_USE_EXTERNAL_CONTROLLER="true"
export DEVICE_USES_64_BIT_RA="true"
export DEVICE_HAS_32_BIT_RA="false"
export RA_BIN="ra64.universal"
export DEVICE_SUPPORTS_PORTMASTER="false"                         # revisit after Phase 1

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# Input mapping derived from MinUI's own rgb30 port, which ships and works on
# this hardware. MinUI reads the pad through SDL joystick indices rather than
# evdev, so the codes below are reconstructed: SDL2 assigns joystick button
# indices in ascending evdev-code order, and walking MinUI's JOY_* table back
# through that ordering lands on the standard gamepad codes. The reconstruction
# is confirmed at two independent points - MinUI's keymon.c reads raw evdev and
# names 317 and 318 directly, commenting that they appear as SDL 11 and 12,
# which is exactly where this ordering puts them.
#
# The driver is singleadc-joypad WITHOUT the rocknix- prefix. That is settled,
# not guessed: keymon.c reads
# /sys/bus/platform/devices/singleadc-joypad/hp for headphone state.
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-singleadc-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# MinUI opens event0 through event4 and js0 rather than naming one node, so the
# power and volume keys are not pinned to a known index. RGB30.sh finds them.
export EVENT_PATH_POWER="/dev/input/event0"                       # UNVERIFIED
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"                      # UNVERIFIED

# device_init's capability probe resolves which node actually carries the volume
# keys (event1 here, not the event0 default) and writes it to this file. Read it
# back so the separately-launched button watchdogs get the resolved node too -
# an export from device_init never reaches them.
[ -f /tmp/rgb30_input_nodes ] && . /tmp/rgb30_input_nodes

export B_POWER="1 116"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

# 317 and 318 are BTN_THUMBL and BTN_THUMBR, the standard stick-click codes,
# and the device really does have two sticks (a live UnofficialOS card reports
# ANALOG_STICKS=2). MinUI still uses them as its two Menu buttons, because the
# RGB30 has no dedicated menu button and PyUI needs one.
#
# So this is a deliberate trade, not a hardware limit: spruce gets a menu button
# and gives up L3/R3. Revisit on hardware if emulators want the stick clicks -
# RetroArch does not use them today (its hotkey is 8 and menu toggle is 2).
export B_L3="DOESNT_EXIST"   # spent on B_MENU below
# There is genuinely no menu or home button: a live RGB30 aliases
# DEVICE_BTN_MODE to 8 (select), so driver index 10 exists but no physical
# button drives it. spruce needs a menu button, so the left stick click becomes
# one - the same trade MinUI makes. The right click stays R3 so emulators keep
# one, which is what UnofficialOS's es_input does with both.
export B_MENU="1 317"     # BTN_THUMBL, left stick click
export B_R3="1 318"       # BTN_THUMBR, right stick click

export B_START="1 315"
export B_SELECT="1 314"
export B_HOME="DOESNT_EXIST"

# Settled from a live RGB30's own /storage/.config/profile.d/050-modifiers:
#   DEVICE_KEY_VOLUMEDOWN=114
#   DEVICE_KEY_VOLUMEUP=115
# So the standard evdev naming holds, and MinUI's keymon has these backwards -
# which is exactly the inconsistency its own platform.h flags with a "these were
# swapped from keymon?" note. Do not copy MinUI here.
export B_VOLUP="1 115"
export B_VOLDOWN="1 114"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 2"
export STICK_RIGHT_2="3 2"
export STICK_UP_2="3 3"
export STICK_DOWN_2="3 3"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH="/sys/class/extcon/hdmi/cable.0/state"
export HDMI_WIDTH="1280"
export HDMI_HEIGHT="720"
export HEADPHONE_STATE_PATH="/sys/bus/platform/devices/singleadc-joypad/hp"

  #########################################
#####   VOLUME AND BRIGHTNESS MAPPING   #####
  #########################################

export SYSTEM_VOLUME_0="0"
export SYSTEM_VOLUME_1="5"
export SYSTEM_VOLUME_2="10"
export SYSTEM_VOLUME_3="15"
export SYSTEM_VOLUME_4="20"
export SYSTEM_VOLUME_5="25"
export SYSTEM_VOLUME_6="30"
export SYSTEM_VOLUME_7="35"
export SYSTEM_VOLUME_8="40"
export SYSTEM_VOLUME_9="45"
export SYSTEM_VOLUME_10="50"
export SYSTEM_VOLUME_11="55"
export SYSTEM_VOLUME_12="60"
export SYSTEM_VOLUME_13="65"
export SYSTEM_VOLUME_14="70"
export SYSTEM_VOLUME_15="75"
export SYSTEM_VOLUME_16="80"
export SYSTEM_VOLUME_17="85"
export SYSTEM_VOLUME_18="90"
export SYSTEM_VOLUME_19="95"
export SYSTEM_VOLUME_20="100"

# The panel is 0-255. This curve is MinUI's SetBrightness table verbatim -
# it was tuned on this hardware, so it beats anything derived from another
# device's ramp.
export SYSTEM_BRIGHTNESS_0="4"
export SYSTEM_BRIGHTNESS_1="6"
export SYSTEM_BRIGHTNESS_2="10"
export SYSTEM_BRIGHTNESS_3="16"
export SYSTEM_BRIGHTNESS_4="32"
export SYSTEM_BRIGHTNESS_5="48"
export SYSTEM_BRIGHTNESS_6="64"
export SYSTEM_BRIGHTNESS_7="96"
export SYSTEM_BRIGHTNESS_8="128"
export SYSTEM_BRIGHTNESS_9="192"
export SYSTEM_BRIGHTNESS_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

# Confirmed against a live RGB30 running UnofficialOS, reading its
# .config/retroarch/retroarch.cfg directly:
#   input_joypad_driver     = "udev"
#   input_enable_hotkey_btn = "8"
#   input_exit_emulator_btn = "9"
# 8 and 9 are SELECT and START in the table above, so RA's udev driver numbers
# this pad the same way SDL does - the divergence seen on the H700 line does not
# happen here. RA_HOME_VAL is the one value still unverified: the RGB30 has no
# home button, and the live config does not bind one.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="11"
