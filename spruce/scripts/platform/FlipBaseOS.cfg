#!/bin/sh
# Miyoo Flip under BaseOS-my355 (apommel/baseos-my355): sourced by Flip.cfg when
# /etc/baseos-release exists, after the stock values, which these override.
# Same hardware, so still PLATFORM=Flip. Builtins only: every script sources this file.

export SPRUCE_FLIP_BASEOS=1

# The BaseOS project the Firmware Update app follows, and its offline fallback.
export BASEOS_REPO="apommel/baseos-my355"
export TARGET_BASEOS_VERSION="1.1.0"
export BASEOS_UPDATE_FINISH="reboot, install it and start up again on the new version"

# The card is on /mnt/SDCARD (left slot mmcblk2p1, else this card's own mmcblk1p5);
# mmcblk1p1 is BaseOS's U-Boot, so never fall back to the stock SD_DEV.
export SD_MOUNTPOINT="/mnt/SDCARD"
SD_DEV=""
while read -r _flip_dev _flip_mp _flip_rest; do
    [ "$_flip_mp" = "/mnt/SDCARD" ] && { SD_DEV="$_flip_dev"; break; }
done < /proc/mounts
unset _flip_dev _flip_mp _flip_rest
export SD_DEV
