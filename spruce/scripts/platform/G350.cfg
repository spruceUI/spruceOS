#!/bin/sh
# BatleXP G350 (RK3326, 640x480) on dArkMoss: the RG351MP board family on the
# rg351 4.4 kernel, same odroidgo3-joypad pad as the A10 Mini (identical
# product/revision/name and button codes, confirmed against both units'
# rk3326-*-linux.dts). CPU/backlight values are G350's own DTS, not copied.

. /mnt/SDCARD/spruce/scripts/platform/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="G350"
export SYSTEM_JSON="/mnt/SDCARD/App/PyUI/config/g350-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/g350/g350-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="4:3"
export DISPLAY_TEXT_ELF_WIDTH="600"

  ########################
#####   CPU SETTINGS   #####
  ########################

# RK3326, four Cortex-A35. G350's cpu0_opp_table deletes the 816 and 1248 MHz
# nodes (the A10 Mini deletes 1416/1512 instead): 408000 600000 1008000
# 1200000 1296000 1416000 1512000 all exist on this unit.
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1008000

export CPU_SMART_MIN_FREQ=408000
export CPU_SMART_MAX_FREQ=1416000
export CPU_PERF_MAX_FREQ=1416000
export CPU_OVERCLOCK_MAX_FREQ=1512000

# Mali-G31: 400 480 520 MHz (same gpu_opp_table deletions as the A10 Mini).
export GPU_GOVENOR_DIR="/sys/devices/platform/ff400000.gpu/devfreq/ff400000.gpu"
export GPU_SMART_MAX_FREQ="520000000"
export GPU_PERFORMANCE_MAX_FREQ="520000000"
export GPU_OVERCLOCK_MAX_FREQ="520000000"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
# No softvol "Master" on the rk3326 base (and /etc/asound.conf is dropped at
# boot), so volume goes to the rk817 codec's own control.
export VOLUME_CONTROL="Playback"
export DEVICE_NUM_ANALOG_STICKS=2
export DEVICE_SUPPORTS_PORTMASTER="true"
# The G350's dArkMoss image runs BatteryPlus (Knulli's voltage-based %); read it first.
export BATTERYPLUS_PERCENT_FILE="/tmp/battery.percent"
# Its image also ships bootlogo.py: save_poweroff shows the reboot/poweroff logo before PyUI exits.
export DARKMOSS_BOOTLOGO="/usr/local/sbin/bootlogo.py"
# Same chipset and Mali blob as the A10 Mini, which needed this to stop the
# base SDL drawing RetroArch upside down; unverified on G350 hardware itself.
export RA_SDL2_LIB="/mnt/SDCARD/App/PyUI/dll/libSDL2-2.0.so"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-odroidgo3-joypad-event-joystick"
export PAD_NAME_CANDIDATES="GO-Super Gamepad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-odroidgo3-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export SPRUCE_INPUT_NODES_FILE="/tmp/g350_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

# F1-F5 are BTN_TRIGGER_HAPPY1-5: select, start, L3, R3 and the F key.
export B_SELECT="1 704"
export B_START="1 705"
export B_L3="1 706"
export B_R3="1 707"
export B_MENU="1 708"
export B_HOME="DOESNT_EXIST"

# Same joypad-product/revision/name as the A10 Mini, so the same GUID.
export SDL_GAMECONTROLLER_MAP="190000004b4800000011000000010000,GO-Super Gamepad,a:b1,b:b0,x:b2,y:b3,back:b12,guide:b16,start:b13,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b14,rightstick:b15,dpup:b8,dpdown:b9,dpleft:b10,dpright:b11,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 3"
export STICK_RIGHT_2="3 3"
export STICK_UP_2="3 4"
export STICK_DOWN_2="3 4"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH=""
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# G350's backlight-levels run 0-255 (default 200), not the A10 Mini's 0-160
# (default 80): its table scaled to the same percentages of max.
export SYSTEM_BRIGHTNESS_0="5"
export SYSTEM_BRIGHTNESS_1="6"
export SYSTEM_BRIGHTNESS_2="10"
export SYSTEM_BRIGHTNESS_3="16"
export SYSTEM_BRIGHTNESS_4="32"
export SYSTEM_BRIGHTNESS_5="48"
export SYSTEM_BRIGHTNESS_6="64"
export SYSTEM_BRIGHTNESS_7="96"
export SYSTEM_BRIGHTNESS_8="128"
export SYSTEM_BRIGHTNESS_9="191"
export SYSTEM_BRIGHTNESS_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="12"
RA_START_VAL="13"
RA_HOME_VAL="16"
