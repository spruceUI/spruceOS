#!/bin/sh
# Miniloong Pocket 1 (RK3566, 960x720) on dArkMoss. The base OS side is in
# dArkMossCommon.cfg; only the panel, pad and codec facts live here. Read off
# the unit under dArkMoss 2026-09-26 unless marked UNVERIFIED.

. /mnt/SDCARD/spruce/scripts/platform/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Miniloong"
# PyUI reads and writes its system config beside the app; the shell must read
# the same file.
export SYSTEM_JSON="/mnt/SDCARD/App/PyUI/config/miniloong-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/miniloong/miniloong-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The DSI panel is a 720x960 portrait mode used in landscape, but SDL/KMSDRM
# clients already see it as landscape: RetroArch and display_text.elf are
# upright at 0 (270 put the splash a quarter turn off). PyUI keeps its own 270.
export DISPLAY_WIDTH="960"
export DISPLAY_HEIGHT="720"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="4:3"
export DISPLAY_TEXT_ELF_WIDTH="900"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

# The pad advertises FF_RUMBLE under dArkMoss, so rumble is the common evdev path.
# Not inverted on this unit; the codec's items are OFF RCV SPK HP ... and the
# base's own jack switch uses them by name.
export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
export DEVICE_NUM_ANALOG_STICKS=1
# Same pad ids as the RGB30 (bus 0019, 484b:1101 v0100, "retrogame_joypad"),
# so the same SDL GUID and map. harbourmaster learns the unit from App/PortMaster/launch.sh.
export SDL_GAMECONTROLLER_MAP="19009b4d4b4800000111000000010000,retrogame_joypad,a:b1,b:b0,x:b2,y:b3,back:b8,guide:b10,start:b9,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b11,rightstick:b12,dpup:b13,dpdown:b14,dpleft:b15,dpright:b16,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"
export DEVICE_SUPPORTS_PORTMASTER="true"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# Same singleadc-joypad driver and node as the RGB30; the pad is "retrogame_joypad".
export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-singleadc-joypad-event-joystick"
export PAD_NAME_CANDIDATES="retrogame_joypad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-singleadc-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# Layout: rk805 pwrkey event0, gpio-keys-vol event1 (the rocker),
# retrogame_joypad event2, rk-headset event3. device_init resolves and persists them.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export VOLUME_KEYS_ON_PAD="0"
export SPRUCE_INPUT_NODES_FILE="/tmp/miniloong_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"
export B_B="1 304"
export B_X="1 307"   # BTN_NORTH
export B_Y="1 308"   # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

export B_L3="1 317"
export B_R3="1 318"

export B_START="1 315"
export B_SELECT="1 314"
export B_MENU="1 316"  # BTN_MODE, a real button
export B_HOME="DOESNT_EXIST"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 4"
export STICK_RIGHT_2="3 4"
export STICK_UP_2="3 3"
export STICK_DOWN_2="3 3"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH="/sys/class/drm/card0-HDMI-A-1/status"
export HDMI_WIDTH="1280"
export HDMI_HEIGHT="720"
# The jack is the extcon named rk-headset, resolved by Miniloong.sh.
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# Measured 2026-09-04: the panel is black at raw 60 and below, first lights at
# 62, no visible change above ~135. Level 0 is the dimmest safe level.
export SYSTEM_BRIGHTNESS_0="70"
export SYSTEM_BRIGHTNESS_1="77"
export SYSTEM_BRIGHTNESS_2="83"
export SYSTEM_BRIGHTNESS_3="90"
export SYSTEM_BRIGHTNESS_4="96"
export SYSTEM_BRIGHTNESS_5="103"
export SYSTEM_BRIGHTNESS_6="109"
export SYSTEM_BRIGHTNESS_7="116"
export SYSTEM_BRIGHTNESS_8="122"
export SYSTEM_BRIGHTNESS_9="129"
export SYSTEM_BRIGHTNESS_10="135"

  #########################
#####   RetroArch Keys   #####
  #########################

# Same pad and udev driver as the RGB30, so the same indices. UNVERIFIED in game.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="11"
