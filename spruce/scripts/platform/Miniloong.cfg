#!/bin/sh
# Miniloong Pocket 1 (RK3566, 960x720) on dArkMoss. The base OS side is in
# dArkMossCommon.cfg; only the panel, pad and codec facts live here. Values
# marked UNVERIFIED were measured on the vendor firmware and still need
# confirming under the dArkMoss kernel.

. /mnt/SDCARD/spruce/scripts/platform/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Miniloong"
# PyUI (devices/miniloong) still keeps its system config in Saves/; the shell
# must read the same file. Moves beside the app with the PyUI rework.
export SYSTEM_JSON="/mnt/SDCARD/Saves/miniloong-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/miniloong/miniloong-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The DSI panel is a 720x960 portrait mode used in landscape. Whether the
# dArkMoss kernel already rotates the scanout is UNVERIFIED; the direction
# here is the vendor firmware's.
export DISPLAY_WIDTH="960"
export DISPLAY_HEIGHT="720"
export DISPLAY_ROTATION="270"
export DISPLAY_ASPECT_RATIO="4:3"
export DISPLAY_TEXT_ELF_WIDTH="900"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

# Rumble is a PWM channel on the vendor kernel; unexporting it latches the
# motor ON, so it is exported once and never unexported. UNVERIFIED here.
export RUMBLE_PWMCHIP="pwmchip0"
export RUMBLE_PWM_CHANNEL="0"
export RUMBLE_PWM_PERIOD="1000000"
# Not inverted on this unit: dArkOS's own headphone switch for the Miniloong
# selects HP for headphones and SPK for the speaker. UNVERIFIED.
export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
export DEVICE_NUM_ANALOG_STICKS=1
# No SDL controller map and no harbourmaster entry for this unit yet.
export DEVICE_SUPPORTS_PORTMASTER="false"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# The pad's by-path name under the dArkMoss kernel is UNVERIFIED, so every
# plausible link is tried, then the vendor kernel's evdev name.
export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-loong1_joypad-event-joystick /dev/input/by-path/platform-singleadc-joypad-event-joystick /dev/input/by-path/platform-retrogame_joypad-event-joystick"
export PAD_NAME_CANDIDATES="Loong Gamepad|retrogame_joypad|singleadc-joypad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-loong1_joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# The volume keys are on the gamepad node on the vendor kernel (114/115 seen on
# the pad 2026-09-04). device_init resolves and persists the real layout.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export VOLUME_KEYS_ON_PAD="0"
export SPRUCE_INPUT_NODES_FILE="/tmp/miniloong_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

# D-pad is a hat on the vendor kernel. UNVERIFIED.
export B_LEFT="3 16 -1"
export B_RIGHT="3 16 1"
export B_UP="3 17 -1"
export B_DOWN="3 17 1"

export B_A="1 305"
export B_B="1 304"
export B_X="1 307"   # BTN_NORTH, measured 2026-09-04
export B_Y="1 308"   # BTN_WEST

export B_L1="1 310"
export B_L2="1 312"  # BTN_TL2: triggers are keys, no ABS 2/5
export B_R1="1 311"
export B_R2="1 313"  # BTN_TR2

export B_L3="1 317"
export B_R3="1 318"

export B_START="1 315"
export B_SELECT="1 314"
export B_MENU="1 316"
export B_HOME="DOESNT_EXIST"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 4"
export STICK_RIGHT_2="3 4"
export STICK_UP_2="3 3"
export STICK_DOWN_2="3 3"

  ###############
#####   HDMI   #####
  ###############

# No extcon node known for this unit; Miniloong.sh detects headphones through
# the codec instead.
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# Measured 2026-09-04: the panel is black at raw 60 and below, first lights at
# 62, no visible change above ~135. Level 0 is the dimmest safe level.
export SYSTEM_BRIGHTNESS_0="70"
export SYSTEM_BRIGHTNESS_1="77"
export SYSTEM_BRIGHTNESS_2="83"
export SYSTEM_BRIGHTNESS_3="90"
export SYSTEM_BRIGHTNESS_4="96"
export SYSTEM_BRIGHTNESS_5="103"
export SYSTEM_BRIGHTNESS_6="109"
export SYSTEM_BRIGHTNESS_7="116"
export SYSTEM_BRIGHTNESS_8="122"
export SYSTEM_BRIGHTNESS_9="129"
export SYSTEM_BRIGHTNESS_10="135"

  #########################
#####   RetroArch Keys   #####
  #########################

# Indices from the sdl2 joypad driver on the vendor firmware; UNVERIFIED for
# the udev driver.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="4"
RA_START_VAL="6"
RA_HOME_VAL="5"
