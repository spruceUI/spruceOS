#!/bin/sh
# Miniloong Pocket 1 platform specific variables
#
# RK3566 / 4x Cortex-A55 / Mali-G52 - the same silicon as the Miyoo Flip - on the
# vendor's own buildroot firmware (loong_* daemons, Weston, glibc 2.38, writable
# ext4 rootfs). Spruce enters through the rootfs stub installed by the stock
# loong_upgrade OTA path (spruce/miniloong/), then the shared boot session.
#
# Values marked UNVERIFIED were read from Leaf/Jawaka source, not from a board
# on the bench; the open items are tracked in ~/ai/CFW/Miniloong/TODO.md.

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Miniloong"
# No vendor firmware image flow on this platform: check_if_fw_needs_update is
# always false, and FW_FILE stays empty so nothing looks for an image.
export FW_FILE=""
export TARGET_FW_VERSION="0"
export REQ_MB_TO_UPDATE_FW=0
export SYSTEM_JSON="/mnt/SDCARD/Saves/miniloong-system.json"
export SYSTEM_PATH="/mnt/SDCARD/spruce/miniloong"
# Stock mounts the card at /mnt/sdcard; /mnt/SDCARD is the bind the rootfs stub
# adds (the Flip firmware ships that symlink, this one does not).
export SD_MOUNTPOINT="/mnt/sdcard"
export SD_DEV="$(awk '$2=="/mnt/sdcard"{print $1; exit}' /proc/mounts 2>/dev/null)"
export PLATFORM_ARCHITECTURE="aarch64"


  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

export DISPLAY_TEXT_ELF_WIDTH="900"
export DISPLAY_WIDTH="960"
export DISPLAY_HEIGHT="720"
# The DSI panel is one fixed 720x960 portrait mode used in landscape (Jawaka
# device_mlp1.c:1322) - the A30's 480x640 situation - so the A30's rotation
# values are the starting point. Direction UNVERIFIED (MLP1-003).
export DISPLAY_ROTATION="270"
export DISPLAY_ASPECT_RATIO="4:3"

  ########################
#####   CPU SETTINGS   #####
  ########################

# Same RK3566 OPP table as the Flip:
# 408000 600000 816000 1104000 1416000 1608000 1800000 1992000
export DEVICE_MIN_CORES_ONLINE=0
export DEVICE_MAX_CORES_ONLINE=0123
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1104000

export CPU_SMART_CORES_ONLINE=01
export CPU_SMART_GOVENOR="ondemand"
export CPU_SMART_MIN_FREQ=408000
export CPU_SMART_MAX_FREQ=1800000
export CPU_PERF_MAX_FREQ=1800000
export CPU_OVERCLOCK_MAX_FREQ=1992000
export CONSERVATIVE_POLICY_DIR=/sys/devices/system/cpu/cpu0/cpufreq/conservative

# The Mali itself (the Flip's cfg points these at the DRAM controller, see
# SPR-MED-158; this follows the RGB30 and drives the GPU node Jawaka uses).
# Available: 200 300 400 600 700 800 900 MHz.
export GPU_GOVENOR_DIR="/sys/devices/platform/fde60000.gpu/devfreq/fde60000.gpu"
export GPU_SMART_GOVERNOR="simple_ondemand"
export GPU_SMART_MAX_FREQ="800000000"
export GPU_PERFORMANCE_GOVERNOR="performance"
export GPU_PERFORMANCE_MAX_FREQ="800000000"
export GPU_OVERCLOCK_GOVERNOR="performance"
export GPU_OVERCLOCK_MAX_FREQ="900000000"


  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export BATTERY="/sys/class/power_supply/battery"
export LED_PATH="not applicable"
export DEVICE_BRIGHTNESS_PATH="/sys/class/backlight/backlight/brightness"
# Rumble is a PWM channel, not a GPIO (Jawaka input_proxy_mlp1.c). Unexporting
# it latches the motor ON on this driver: export once, never unexport.
export RUMBLE_PWMCHIP="pwmchip0"
export RUMBLE_PWM_CHANNEL="0"
export RUMBLE_PWM_PERIOD="1000000"
# rk817 codec is ALSA card 1 here (card 0 on the Flip); the speaker amp has a
# separate gate the stock daemons drive - see spk_gate_watchdog in Miniloong.sh.
export MINILOONG_AUDIO_CARD="1"
export MINILOONG_SPK_GATE="/sys/kernel/powerCtrl/spk_ctl"
# PyUI and RetroArch run on KMSDRM, which needs the DRM master that stock
# Weston (S49weston) holds. 1 = stop Weston in device_init. 0 = leave it
# running (the Wayland route; see research doc section 4).
export MINILOONG_STOP_WESTON="1"

  ###############################################
#####   SOFTWARE CHARACTERISTICS AND QUIRKS   #####
  ###############################################

# The aarch64 payload is shared with the Flip (spruce/flip): same glibc floor,
# same Mali-G52. No /usr/miyoo here.
export PATH=/mnt/SDCARD/spruce/bin64:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
export LD_LIBRARY_PATH="/mnt/SDCARD/spruce/flip/lib:/usr/lib:/lib"
export SPRUCE_ETC_DIR="/mnt/SDCARD/spruce/miniloong/etc"
export DEVICE_PYTHON3_PATH=/mnt/SDCARD/spruce/flip/bin/python3
export DEVICE_SUPPORTS_PORTMASTER="false"
export DEVICE_CAN_USE_EXTERNAL_CONTROLLER="true"
export DEVICE_USES_64_BIT_RA="true"
export DEVICE_HAS_32_BIT_RA="false"
export RA_BIN="ra64.universal"
export PSP_BIN="PPSSPPSDL_Flip"
export MUPEN_DIR="mupen64plus"
export PCSX_BIN="pcsx_64"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# The pad is a kernel evdev device with a stable by-path link
# (Jawaka input_roster_mlp1.c:316). Power is the rk805 pwrkey node. The volume
# keys are ON THE GAMEPAD NODE: the loong1_joypad DT node declares
# VOLUMEDOWN_key (114) and VOLUMEUP_key (115), and a raw capture on 2026-09-04
# saw both codes on the pad (SPR-MED-183). Every pad watcher therefore already
# receives them; EVENT_PATH_VOLUME stays parked on the power node so nothing
# reads the pad twice, and VOLUME_KEYS_ON_PAD tells buttons_watchdog to leave
# volume to PyUI while a menu is up. Both are resolved at boot by device_init
# and persisted for the watchdogs, which re-source this file.
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-loong1_joypad-event-joystick"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_VOLUME="/dev/input/event0"        # parked on the power node (keys are on the pad)
export EVENT_PATH_POWER="/dev/input/event0"         # rk805 pwrkey, resolved at boot
export VOLUME_KEYS_ON_PAD="0"                        # set to 1 by device_init when the pad reports 114/115
[ -f /tmp/miniloong_input_nodes ] && . /tmp/miniloong_input_nodes

# Standard Linux gamepad codes, the same table as the Flip. UNVERIFIED (MLP1-002).
export B_POWER="1 116"

export B_LEFT="3 16 -1"  # negative for left
export B_RIGHT="3 16 1"  # positive for right
export B_UP="3 17 -1"    # negative for up
export B_DOWN="3 17 1"   # positive for down

export B_A="1 305"
export B_B="1 304"
export B_X="1 307"   # BTN_NORTH - measured on the MLP1 2026-09-04 (the Flip's driver has 308 here)
export B_Y="1 308"   # BTN_WEST

export B_L1="1 310"
export B_L2="1 312"  # BTN_TL2: the pad declares the triggers as KEYS, no ABS 2/5
export B_R1="1 311"
export B_R2="1 313"  # BTN_TR2

export B_L3="1 317"
export B_R3="1 318"

export B_START="1 315"
export B_SELECT="1 314"
export B_START_2="enter_pressed"
export B_SELECT_2="rctrl_pressed"

export B_VOLUP="1 115"
export B_VOLUP_2="volume up"
export B_VOLDOWN="1 114"
export B_VOLDOWN_2="volume down"
export B_MENU="1 316"
export B_HOME="DOESNT_EXIST"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"

export STICK_LEFT_2="3 4"
export STICK_RIGHT_2="3 4"
export STICK_UP_2="3 3"
export STICK_DOWN_2="3 3"

  #########################################
#####   VOLUME AND BRIGHTNESS MAPPING   #####
  #########################################

# rk817 "DAC Playback Volume" is 0-255 with a very steep taper. Leaf measured on
# hardware: ~167 barely audible, 210 the comfortable ceiling, 252 painful. The
# first table (150..210, 3 raw per step) put six inaudible steps at the bottom
# and made one press of the volume keys a ~1 dB change nobody could hear
# (188 <-> 191 on 2026-09-04 read as "volume keys don't work"; SPR-MED-182).
# This one starts just above audibility and climbs ~3.4 raw per step to 232:
# Leaf pins its DAC at 210 as the calibrated maximum and runs user volume in
# software below it, so 232 is ~8 dB of headroom above that ceiling and 20 raw
# under painful - loud enough to be a real top step, not a blast. Check level
# 20 by ear on the speaker; lower the top if it distorts. 0 mutes through the
# Playback Path instead.
# PyUI's DAC_TABLE in devices/miniloong/miniloong_pocket1.py mirrors this list
# (contract test); change both together.
export SYSTEM_VOLUME_0="0"
export SYSTEM_VOLUME_1="168"
export SYSTEM_VOLUME_2="171"
export SYSTEM_VOLUME_3="175"
export SYSTEM_VOLUME_4="178"
export SYSTEM_VOLUME_5="181"
export SYSTEM_VOLUME_6="185"
export SYSTEM_VOLUME_7="188"
export SYSTEM_VOLUME_8="192"
export SYSTEM_VOLUME_9="195"
export SYSTEM_VOLUME_10="198"
export SYSTEM_VOLUME_11="202"
export SYSTEM_VOLUME_12="205"
export SYSTEM_VOLUME_13="208"
export SYSTEM_VOLUME_14="212"
export SYSTEM_VOLUME_15="215"
export SYSTEM_VOLUME_16="219"
export SYSTEM_VOLUME_17="222"
export SYSTEM_VOLUME_18="225"
export SYSTEM_VOLUME_19="229"
export SYSTEM_VOLUME_20="232"

# Backlight raw values at or below 55 flicker on this panel (Jawaka
# device_mlp1.c:26), so the floor sits above it.
export SYSTEM_BRIGHTNESS_0="60"
export SYSTEM_BRIGHTNESS_1="70"
export SYSTEM_BRIGHTNESS_2="85"
export SYSTEM_BRIGHTNESS_3="100"
export SYSTEM_BRIGHTNESS_4="120"
export SYSTEM_BRIGHTNESS_5="140"
export SYSTEM_BRIGHTNESS_6="160"
export SYSTEM_BRIGHTNESS_7="180"
export SYSTEM_BRIGHTNESS_8="200"
export SYSTEM_BRIGHTNESS_9="225"
export SYSTEM_BRIGHTNESS_10="255"


  #########################################
#####   RetroArch Keys   #####
  #########################################
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="4"
RA_START_VAL="6"
RA_HOME_VAL="5"
