#!/bin/sh
# Powkiddy V10 (RK3326, 320x480 portrait panel shown as 480x320) on dArkMoss's
# v10 unit: the rg351 kernel the G350 uses, with rk3326-odroidgo2-linux-v11.dtb,
# pad "GO-Advance Gamepad (rev 1.1)". Button codes, backlight range and the
# audio fixes come from a hardware probe of a V10 running dArkOS 09022026.
# One SD slot: spruce lives on the SPRUCEOS partition firstboot adds to TF1.

. /mnt/SDCARD/spruce/scripts/platform/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Powkiddy"
export SPRUCE_DEVICE_NAME="Powkiddy V10"
export SYSTEM_JSON="/mnt/SDCARD/Saves/v10-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/darkmoss/json/v10-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The panel is physically 320x480 portrait (fbcon=rotate:3); the base SDL
# (dArkMoss build_sdl2.sh installs the odroidgoa RGA ROT_270 build for v10)
# and PyUI (screen_rotation 270) both rotate, so everything else renders at
# this landscape size with no rotation of its own.
export DISPLAY_WIDTH="480"
export DISPLAY_HEIGHT="320"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="3:2"
export DISPLAY_TEXT_ELF_WIDTH="450"

  ########################
#####   CPU SETTINGS   #####
  ########################

# RK3326, four Cortex-A35, stock OGA 1.1 OPP table tops out at 1296 MHz.
export DEVICE_POWERSAVE_LOW_FREQ=816000
export DEVICE_POWERSAVE_HIGH_FREQ=1008000

# Measured on the V10 (NextUI port): ondemand/schedutil on this 4.4 kernel dip
# to 408 MHz mid-game and the sound stutters. Rockchip's interactive governor
# with a 1008 MHz floor fixed it.
export CPU_SMART_GOVENOR="interactive"
export CPU_SMART_MIN_FREQ=1008000
export CPU_SMART_MAX_FREQ=1296000
export CPU_PERF_MAX_FREQ=1296000
export CPU_OVERCLOCK_MAX_FREQ=1296000

# Mali-G31: 400 480 520 MHz, as the other RK3326 dArkMoss units.
export GPU_GOVENOR_DIR="/sys/devices/platform/ff400000.gpu/devfreq/ff400000.gpu"
export GPU_SMART_MAX_FREQ="520000000"
export GPU_PERFORMANCE_MAX_FREQ="520000000"
export GPU_OVERCLOCK_MAX_FREQ="520000000"

# Memory clock changes stall the bus and make the sound crackle (measured on
# the V10). This kernel's dmc has no "performance" governor, so V10.sh's
# set_dram_governor pins it with "userspace" at the top frequency in every mode.
export DRAM_DEVFREQ_DIR="/sys/class/devfreq/dmc"
export DRAM_POWERSAVE_GOVERNOR="pin"
export DRAM_SMART_GOVERNOR="pin"
export DRAM_PERFORMANCE_GOVERNOR="pin"
export DRAM_OVERCLOCK_GOVERNOR="pin"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
# No softvol "Master" on the rk3326 base (and /etc/asound.conf is dropped at
# boot), so volume goes to the rk817 codec's own control.
export VOLUME_CONTROL="Playback"
export DARKMOSS_VOLUME_READ_MAPPED=1
export DARKMOSS_SEED_SYSTEM_JSON=1
export DEVICE_NUM_ANALOG_STICKS=0
export DEVICE_SUPPORTS_PORTMASTER="true"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-odroidgo2-joypad-event-joystick"
export PAD_NAME_CANDIDATES="GO-Advance Gamepad (rev 1.1)|GO-Advance Gamepad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-odroidgo2-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# Power key: rk8xx_pwrkey on event0 (probe). The volume buttons are pad
# buttons (705/708), not KEY_VOLUME*, so the pad watcher already sees them and
# nothing else has to be read for volume.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export SPRUCE_INPUT_NODES_FILE="/tmp/v10_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 706"   # BTN_TRIGGER_HAPPY3
export B_R2="1 707"   # BTN_TRIGGER_HAPPY4

export B_SELECT="1 704"  # BTN_TRIGGER_HAPPY1, the "-" button
export B_START="1 709"   # BTN_TRIGGER_HAPPY6, the "+" button
export B_VOLUP="1 708"   # BTN_TRIGGER_HAPPY5
export B_VOLDOWN="1 705" # BTN_TRIGGER_HAPPY2
export B_L3="DOESNT_EXIST"
export B_R3="DOESNT_EXIST"
# No menu or home button. PyUI takes SELECT+START as MENU (devices/darkmoss/v10.py);
# in game, RetroArch's SELECT hotkeys cover the menu, save and load.
export B_MENU="DOESNT_EXIST"
export B_HOME="DOESNT_EXIST"

# gamecontrollerdb's entry for this pad, with A/B and X/Y label-named like the
# other dArkMoss units (a:b1 is 305, the button marked A).
export SDL_GAMECONTROLLER_MAP="190000004b4800000010000001010000,GO-Advance Gamepad (rev 1.1),a:b1,b:b0,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,dpdown:b9,dpleft:b10,dpright:b11,dpup:b8,back:b12,lefttrigger:b14,righttrigger:b15,start:b17,platform:Linux,"

export STICK_LEFT="DOESNT_EXIST"
export STICK_RIGHT="DOESNT_EXIST"
export STICK_UP="DOESNT_EXIST"
export STICK_DOWN="DOESNT_EXIST"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH=""
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# /sys/class/backlight/backlight runs 0-255 on the V10, as on the G350.
export SYSTEM_BRIGHTNESS_0="5"
export SYSTEM_BRIGHTNESS_1="6"
export SYSTEM_BRIGHTNESS_2="10"
export SYSTEM_BRIGHTNESS_3="16"
export SYSTEM_BRIGHTNESS_4="32"
export SYSTEM_BRIGHTNESS_5="48"
export SYSTEM_BRIGHTNESS_6="64"
export SYSTEM_BRIGHTNESS_7="96"
export SYSTEM_BRIGHTNESS_8="128"
export SYSTEM_BRIGHTNESS_9="191"
export SYSTEM_BRIGHTNESS_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="12"
RA_START_VAL="17"
RA_HOME_VAL="nul"
