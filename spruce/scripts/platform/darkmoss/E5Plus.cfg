#!/bin/sh
# GameMT E5 Plus (RK3566, 720x1280 portrait panel used as 1280x720) on dArkMoss.
# The base OS side is in dArkMossCommon.cfg; only the panel, pad and codec facts
# live here. Built from the dArkMoss device tree (patches/e5plus in dArkMoss),
# not yet read off a running unit: everything marked UNVERIFIED wants checking.

. /mnt/SDCARD/spruce/scripts/platform/darkmoss/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="GameMT"
export SPRUCE_DEVICE_NAME="GameMT E5 Plus"
# PyUI reads and writes its system config beside the app; the shell must read
# the same file.
export SYSTEM_JSON="/mnt/SDCARD/Saves/e5plus-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/darkmoss/json/e5plus-system.json"
# Seed a fresh card's system json at boot (as the G350, V10 and XU Mini M do):
# without it the boot-time volume restore finds no file and the softvol Master
# stays at the image's saved level (about -20 dB) until the menu next applies
# the volume - seen on hardware as a quiet speaker on the first boot after an
# install, fixed by the first headphone plug/unplug.
export DARKMOSS_SEED_SYSTEM_JSON=1

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The DSI panel is 720x1280 portrait, mounted landscape the other way round
# from the Miniloong's (dArkMoss boots it with fbcon=rotate:1). dArkMoss's
# system SDL rotates DSI output with RGA (ROT_90), so SDL/KMSDRM clients see
# 1280x720 at 0, as on the Miniloong. PyUI uses its own SDL and turns its
# canvas itself (90, in e5plus.py).
export DISPLAY_WIDTH="1280"
export DISPLAY_HEIGHT="720"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="16:9"
export DISPLAY_TEXT_ELF_WIDTH="1200"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

# The pad advertises FF_RUMBLE (pwm14), so rumble is the common evdev path.
# rk817 codec as on the Miniloong: items OFF RCV SPK HP ...; not known to be
# inverted as on the RGB30 (UNVERIFIED - swap these two if speaker and
# headphones come out the wrong way round).
export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
export DEVICE_NUM_ANALOG_STICKS=2
# Same pad ids as the RGB30 (bus 0019, 484b:1101 v0100, "retrogame_joypad") and
# the same key set, so the same SDL GUID and map.
export SDL_GAMECONTROLLER_MAP="19009b4d4b4800000111000000010000,retrogame_joypad,a:b1,b:b0,x:b2,y:b3,back:b8,guide:b10,start:b9,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b11,rightstick:b12,dpup:b13,dpdown:b14,dpleft:b15,dpright:b16,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"
# A real menu button (F, BTN_MODE) like the Miniloong, so its pad seeds.
export SATURN_PAD_TABLE="Miniloong"
export FLYCAST_PAD_MAP="Miniloong"
export DEVICE_SUPPORTS_PORTMASTER="true"
# Four plain gpio LEDs: led3, workled, left_joystick, right_joystick.
export LED_PATH="/sys/class/leds/workled"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-singleadc-joypad-event-joystick"
export PAD_NAME_CANDIDATES="retrogame_joypad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-singleadc-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# Nodes: rk805 pwrkey, adc-keys (the volume rocker, KEY_VOLUMEUP/DOWN),
# retrogame_joypad, rk-headset. device_init resolves and persists them.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export VOLUME_KEYS_ON_PAD="0"
export SPRUCE_INPUT_NODES_FILE="/tmp/e5plus_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

export B_L3="1 317"
export B_R3="1 318"

export B_START="1 315"
export B_SELECT="1 314"
export B_MENU="1 316"  # F, BTN_MODE
export B_HOME="DOESNT_EXIST"

# The side volume keys report nothing on this unit (the adc-keys line sits at
# 0 V, which also reads as a stuck VOLUMEUP), so take spruce's no-volume-key
# combo, as on the V10: SELECT + R3 = volume up, SELECT + L3 = volume down.
# This also stops spruce acting on the phantom VOLUMEUP. Drop these two lines
# if the keys are ever repaired.
export B_VOLUP="DOESNT_EXIST"
export B_VOLDOWN="DOESNT_EXIST"

# Left stick ABS_X/ABS_Y; right stick ABS_RX/ABS_RY (the dArkMoss kernel swaps
# and inverts the E5 Plus's right stick into that order).
export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"
export STICK_LEFT_2="3 3"
export STICK_RIGHT_2="3 3"
export STICK_UP_2="3 4"
export STICK_DOWN_2="3 4"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH="/sys/class/drm/card0-HDMI-A-1/status"
export HDMI_WIDTH="1280"
export HDMI_HEIGHT="720"
# The jack is the extcon named rk-headset, resolved by E5Plus.sh.
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# 0-255 levels on the stock E5 Plus curve (level 1 is already ~9 % duty), so
# the RGB30's table. UNVERIFIED on the panel.
export SYSTEM_BACKLIGHT_LEVEL_0="4"
export SYSTEM_BACKLIGHT_LEVEL_1="6"
export SYSTEM_BACKLIGHT_LEVEL_2="10"
export SYSTEM_BACKLIGHT_LEVEL_3="16"
export SYSTEM_BACKLIGHT_LEVEL_4="32"
export SYSTEM_BACKLIGHT_LEVEL_5="48"
export SYSTEM_BACKLIGHT_LEVEL_6="64"
export SYSTEM_BACKLIGHT_LEVEL_7="96"
export SYSTEM_BACKLIGHT_LEVEL_8="128"
export SYSTEM_BACKLIGHT_LEVEL_9="192"
export SYSTEM_BACKLIGHT_LEVEL_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

# Same pad and udev driver as the RGB30, so the same indices. UNVERIFIED in game.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="11"
