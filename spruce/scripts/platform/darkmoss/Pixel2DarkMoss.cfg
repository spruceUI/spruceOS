#!/bin/sh
# GKD Pixel 2 (RK3326S, 480x640 portrait) on dArkMoss's pixel2 unit, 5.10 kernel; "Pixel2" is Twig-Next.
# Values are from its dts (kernel series 0001-0010); boot, sound and rumble were seen on a unit (2026-10-27).
# One SD slot: spruce lives on the SPRUCEOS partition firstboot adds to TF1.

. /mnt/SDCARD/spruce/scripts/platform/darkmoss/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="GKD"
export SPRUCE_DEVICE_NAME="GKD Pixel 2"
export SYSTEM_JSON="/mnt/SDCARD/Saves/pixel2-darkmoss-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/darkmoss/json/pixel2-darkmoss-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# 480x640 portrait panel (fbcon=rotate:3): the base SDL (RGA ROT_270, as the V10's)
# and PyUI (270) both rotate, so the rest renders at this landscape size.
export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="4:3"
export DISPLAY_TEXT_ELF_WIDTH="600"

  ########################
#####   CPU SETTINGS   #####
  ########################

# The PX30S OPP table (px30.dtsi): 408000 600000 816000 1008000 1200000 1248000
# 1296000 1416000 1512000
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1200000

export CPU_SMART_MIN_FREQ=408000
export CPU_SMART_MAX_FREQ=1416000
export CPU_PERF_MAX_FREQ=1416000
export CPU_OVERCLOCK_MAX_FREQ=1512000

# Mali-G31 at 200-520 MHz on dArkMossCommon's governors. The DMC is off in the default dtb; the px30s
# dtb (/darkmoss-px30s on BOOT) runs it at 194/328/1056 MHz on the kernel's governor, left alone here.
export GPU_GOVENOR_DIR="/sys/devices/platform/ff400000.gpu/devfreq/ff400000.gpu"
export GPU_SMART_MAX_FREQ="520000000"
export GPU_PERFORMANCE_MAX_FREQ="520000000"
export GPU_OVERCLOCK_MAX_FREQ="520000000"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

# The pad advertises FF_RUMBLE (pwm0, kernel series 0004/0008), so rumble is the common evdev path.
export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
# No softvol "Master" on the rk3326 base; the 5.10 rk817 codec's volume is
# "DAC Playback Volume" (4.4: "Playback Volume"); seen working on a unit (2026-10-26).
export VOLUME_CONTROL="DAC"
# dArkMossCommon opt-ins: read the volume on the mapped (-M) scale set_volume writes, and seed
# a fresh card's system json before the boot backlight is set.
export DARKMOSS_VOLUME_READ_MAPPED=1
export DARKMOSS_SEED_SYSTEM_JSON=1
export DEVICE_NUM_ANALOG_STICKS=0
export DEVICE_SUPPORTS_PORTMASTER="true"
# The RGB30 build targets the A55 and dies with SIGILL on the A35.
export PSP_BIN="PPSSPPSDL_dArkMoss3326"
# No RA_SDL2_LIB: PyUI turns its own frames; RetroArch keeps the base's ROT_270 SDL.

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-gamekiddy-joypad-event-joystick"
export PAD_NAME_CANDIDATES="pixel2_joypad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-gamekiddy-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

# Fallbacks: dArkMossCommon.sh finds the rk817 pwrkey and gpio-keys nodes by name.
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export SPRUCE_INPUT_NODES_FILE="/tmp/pixel2_darkmoss_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

export B_SELECT="1 314"
export B_START="1 315"
export B_L3="DOESNT_EXIST"
export B_R3="DOESNT_EXIST"
export B_MENU="1 704"  # BTN_TRIGGER_HAPPY1, the F1 key
export B_HOME="DOESNT_EXIST"

# GUID from the dts's joypad-* ids (BUS_HOST, 0x0001, 0x2102, rev 0x0100); indices in key-code
# order, with b10 the BTN_THUMBR the K5 singleadc-joypad always advertises (no button sends it).
export SDL_GAMECONTROLLER_MAP="19000000010000000221000000010000,pixel2_joypad,a:b1,b:b0,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,dpup:b11,dpdown:b12,dpleft:b13,dpright:b14,guide:b15,platform:Linux,"

export STICK_LEFT="DOESNT_EXIST"
export STICK_RIGHT="DOESNT_EXIST"
export STICK_UP="DOESNT_EXIST"
export STICK_DOWN="DOESNT_EXIST"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH=""
# The rk817 card's extcon cable "HEADPHONE" (rockchip_multicodecs): 1 with a plug in.
HEADPHONE_STATE_PATH=""
for _cable in /sys/class/extcon/extcon*/cable.*; do
    [ "$(cat "$_cable/name" 2>/dev/null)" = "HEADPHONE" ] && HEADPHONE_STATE_PATH="$_cable/state" && break
done
export HEADPHONE_STATE_PATH

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# 256 pwm-backlight levels; the table Twig-Next's Pixel2.cfg uses for the same node.
export SYSTEM_BACKLIGHT_LEVEL_0="1"
export SYSTEM_BACKLIGHT_LEVEL_1="25"
export SYSTEM_BACKLIGHT_LEVEL_2="50"
export SYSTEM_BACKLIGHT_LEVEL_3="75"
export SYSTEM_BACKLIGHT_LEVEL_4="100"
export SYSTEM_BACKLIGHT_LEVEL_5="125"
export SYSTEM_BACKLIGHT_LEVEL_6="150"
export SYSTEM_BACKLIGHT_LEVEL_7="175"
export SYSTEM_BACKLIGHT_LEVEL_8="200"
export SYSTEM_BACKLIGHT_LEVEL_9="225"
export SYSTEM_BACKLIGHT_LEVEL_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="15"
