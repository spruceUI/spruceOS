#!/bin/sh
# MagicX Mini Zero 28 platform specific variables (MagicX A133P family; see
# device_functions/magicx_a133p.sh). The base marks the model in /usr/magicx/device.

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="MagicX"
export FW_FILE=""
export TARGET_FW_VERSION=""
export REQ_MB_TO_UPDATE_FW=1280 # probably will never come up
export SYSTEM_JSON="/mnt/SDCARD/Saves/magicx-zero28-system.json"
export SYSTEM_PATH="/mnt/SDCARD/magicx"
export SD_DEV="/dev/mmcblk1p1" # need to verify this
export SD_MOUNTPOINT="/mnt/SDCARD"
export PLATFORM_ARCHITECTURE="aarch64"


  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

export DISPLAY_TEXT_ELF_WIDTH="600"
export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"
export DISPLAY_ROTATION="0"   # the kernel rotates the framebuffer (oakMOSS 100/020 + degree0)
export DISPLAY_ASPECT_RATIO="4:3"

  ########################
#####   CPU SETTINGS   #####
  ########################

export DEVICE_MIN_CORES_ONLINE=03
export CPU_SMART_CORES_ONLINE=0123
export DEVICE_MAX_CORES_ONLINE=0123
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1488000
export CPU_SMART_MIN_FREQ=1008000
export CPU_PERF_MAX_FREQ=1800000
export CPU_OVERCLOCK_MAX_FREQ=2000000
export CONSERVATIVE_POLICY_DIR=/sys/devices/system/cpu/cpufreq/conservative

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export BATTERY="/sys/class/power_supply/axp2202-battery"
export LED_PATH="not applicable"          # not really, but keeps it from pooping on the root
export DEVICE_BRIGHTNESS_PATH="/tmp/b"    # not really, but keeps it from pooping on the root
export RUMBLE_GPIO="gpio227"
export DEVICE_NUM_ANALOG_STICKS=2
# Onboard radio is a Realtek RTL8189-class SDIO part, not TrimUI's XR829: the boot
# log shows 8189es bringing up wlan0 and xradio tearing the SDIO card down after it.
export WIFI_ONBOARD_MODULE="8189es"
# Touch: the Zero 28 has no touchscreen. Zero40.cfg turns this on; the node is
# resolved at device_init (magicx_resolve_event_paths) into EVENT_PATH_TOUCH.
export DEVICE_HAS_TOUCHSCREEN="false"
export EVENT_PATH_TOUCH=""

  ###############################################
#####   SOFTWARE CHARACTERISTICS AND QUIRKS   #####
  ###############################################

export PATH=/mnt/SDCARD/spruce/scripts/bin:/mnt/SDCARD/spruce/smartpro/bin/:/mnt/SDCARD/spruce/bin64:/usr/magicx/bin:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
export LD_LIBRARY_PATH="/usr/magicx/lib:/usr/lib:/lib:/mnt/SDCARD/spruce/flip/lib"
export SPRUCE_ETC_DIR="/mnt/SDCARD/trimui/etc"
export DEVICE_PYTHON3_PATH=/mnt/SDCARD/spruce/flip/bin/python3.10
export DEVICE_SUPPORTS_PORTMASTER="true"
export PORTS_LD_LIBRARY_PATH="/mnt/SDCARD/spruce/flip/lib/:/usr/lib:/mnt/SDCARD/spruce/flip/muOS/usr/lib/:/mnt/SDCARD/spruce/flip/muOS/lib/:/usr/lib32:/mnt/SDCARD/spruce/flip/lib32/:/mnt/SDCARD/spruce/flip/muOS/usr/lib32/:/usr/magicx/lib:/usr/lib:/lib"
export DEVICE_CAN_USE_EXTERNAL_CONTROLLER="true"
export DEVICE_USES_64_BIT_RA="true"
export RA_BIN="ra64.universal"
export PSP_BIN="PPSSPPSDL_TrimUI"
export PCSX_BIN="pcsx_64"
export MUPEN_DIR="mupen64plus"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# !!! all of the below needs validation !!!

# The input nodes are resolved by name each time this cfg is sourced: a literal
# export would put the fallback numbering back over what device_init resolved.
_magicx_pad=""; _magicx_pwr=""; _magicx_touch=""
for _d in /sys/class/input/event*; do
    case "$(cat "$_d/device/name" 2>/dev/null)" in
        magicx-input) [ -n "$_magicx_pad" ] || _magicx_pad="/dev/input/${_d##*/}" ;;
        axp2202-pek)  [ -n "$_magicx_pwr" ] || _magicx_pwr="/dev/input/${_d##*/}" ;;
        *ouch*|*ts*|*gt9*|*ft5*|*oodix*|*ocal*|*axs*) [ -n "$_magicx_touch" ] || _magicx_touch="/dev/input/${_d##*/}" ;;
    esac
done 2>/dev/null
export EVENT_PATH_SEND_TO_DRASTIC="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_READ_INPUTS_SPRUCE="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_VOLUME="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_POWER="${_magicx_pwr:-/dev/input/event0}"
# The event numbers above are fallbacks: device_init re-resolves the simplepad
# gamepad, the AXP power key and the touchscreen by kernel device name.

export B_POWER="1 116"
    
# simplepad ("magicx-input", UART MCU pad): the d-pad, MENU and the volume keys are
# plain key codes, the triggers buttons, and A/B and X/Y sit on TrimUI's B/A and Y/X.
export B_LEFT="1 105"
export B_RIGHT="1 106"
export B_UP="1 103"
export B_DOWN="1 108"

export B_A="1 305"
export B_B="1 304"
export B_X="1 308"
export B_Y="1 307"

export B_L1="1 310"
export B_L2="1 312"
export B_R1="1 311"
export B_R2="1 313"

export B_L3="1 317" # also logs left fnkey stuff
export B_R3="1 318" # also logs right fnkey stuff

export B_START="1 315"
export B_START_2="enter_pressed" # only registers 0 on release, no 1.
export B_SELECT="1 314"
export B_SELECT_2="rctrl_pressed" # registers both 1 and 0

export B_VOLUP="1 115" # has actual key codes like the buttons
export B_VOLUP_2="volume up" # only registers 0 on release, no 1.
export B_VOLDOWN="1 114" # has actual key codes like the buttons
export B_VOLDOWN_2="volume down" # only registers 0 on release, no 1.
export B_MENU="1 158" # KEY_BACK, measured on the Zero 28 (timed capture, 2026-09-16); 353 rides along with A and is ignored
export B_HOME="DOESNT_EXIST"

# SDL2 GameController mapping for the pad, inherited by every SDL2 program spruce
# launches. Numbers are the pad's SDL order; right stick on ABS_Z/ABS_RZ = axes 2/3.
# SDL numbers the pad's keys as evdev enumerates them: codes 288 and up first, ascending, then the
# rest ascending. This pad: b0=304 b1=305 b2=307 b3=308 b4=L1 b5=R1 b6=L2 b7=R2 b8=SELECT b9=START
# b10=L3(317) b11=R3(318) b12=353(A's rider) b13=UP b14=LEFT b15=RIGHT b16=DOWN b17=VOL- b18=VOL+
# b19=MENU(158) b20/b21=272/273 (the driver's virtual-mouse buttons). Derived from boards/zero28/board.dts
# and the simplepad driver; the same derivation reproduces the XU20's measured numbering exactly.
export SDL_GAMECONTROLLERCONFIG="1900000012b400006666000000010000,magicx-input,a:b0,b:b1,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,leftstick:b10,rightstick:b11,dpup:b13,dpleft:b14,dpright:b15,dpdown:b16,guide:b19,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"

# Left stick layout for PyUI's MagicX key map (MinUI zero28: ABS_X horizontal, ABS_Y
# vertical). SWAP_XY exchanges the evdev axes, INVERT_* negates after the swap.
export MAGICX_STICK_SWAP_XY=0
export MAGICX_STICK_INVERT_X=0
export MAGICX_STICK_INVERT_Y=0
export STICK_LEFT="3 0 -32767" # negative for left
export STICK_RIGHT="3 0 32767" # positive for right
export STICK_UP="3 1 -32767"   # negative for up
export STICK_DOWN="3 1 32767"  # positive for down

export STICK_LEFT_2="3 4 -32767" # negative for left
export STICK_RIGHT_2="3 4 32767" # positive for right
export STICK_UP_2="3 3 -32767"   # negative for up
export STICK_DOWN_2="3 3 32767"  # positive for down

  #########################################
#####   VOLUME AND BRIGHTNESS MAPPING   #####
  #########################################

export SYSTEM_VOLUME_0="0"
export SYSTEM_VOLUME_1="12"
export SYSTEM_VOLUME_2="25"
export SYSTEM_VOLUME_3="38"
export SYSTEM_VOLUME_4="51"
export SYSTEM_VOLUME_5="63"
export SYSTEM_VOLUME_6="78"
export SYSTEM_VOLUME_7="89"
export SYSTEM_VOLUME_8="102"
export SYSTEM_VOLUME_9="114"
export SYSTEM_VOLUME_10="127"
export SYSTEM_VOLUME_11="140"
export SYSTEM_VOLUME_12="153"
export SYSTEM_VOLUME_13="165"
export SYSTEM_VOLUME_14="178"
export SYSTEM_VOLUME_15="191"
export SYSTEM_VOLUME_16="204"
export SYSTEM_VOLUME_17="216"
export SYSTEM_VOLUME_18="229"
export SYSTEM_VOLUME_19="242"
export SYSTEM_VOLUME_20="255"

  #########################################
#####   RetroArch Keys   #####
  #########################################
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="4"
RA_START_VAL="6"
RA_HOME_VAL="5"
