#!/bin/sh
# MagicX XU Mini M (RK3326, 480x640 portrait) on dArkMoss "as-is": the same
# RG351MP board family as A10 Mini/G350, but on a relabeled RG351V kernel DTS
# with the xu10-joypad driver. Pad and panel values are from Knulli's
# rk3326-magicx-mini-m.dtb; none of it has been read off a running unit yet.

. /mnt/SDCARD/spruce/scripts/platform/dArkMossCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="MagicX"
export SYSTEM_JSON="/mnt/SDCARD/App/PyUI/config/xumini-system.json"
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/xumini/xumini-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The panel is physically 480x640 portrait; the base SDL (build_sdl2.sh's own
# RGA ROT_90 patch) and PyUI (screen_rotation) both rotate, so every other
# consumer renders at this landscape size with no rotation of its own.
export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"
export DISPLAY_ROTATION="0"
export DISPLAY_ASPECT_RATIO="4:3"
export DISPLAY_TEXT_ELF_WIDTH="600"

  ########################
#####   CPU SETTINGS   #####
  ########################

# RK3326, four Cortex-A35, Mini M's own OPP table (patches/xumini/kernel/0001):
# 1008000 1200000 1248000 1296000
export DEVICE_POWERSAVE_LOW_FREQ=1008000
export DEVICE_POWERSAVE_HIGH_FREQ=1200000

export CPU_SMART_MIN_FREQ=1008000
export CPU_SMART_MAX_FREQ=1296000
export CPU_PERF_MAX_FREQ=1296000
export CPU_OVERCLOCK_MAX_FREQ=1296000

# Mali-G31: 400 480 520 MHz, as the other RK3326 dArkMoss units.
export GPU_GOVENOR_DIR="/sys/devices/platform/ff400000.gpu/devfreq/ff400000.gpu"
export GPU_SMART_MAX_FREQ="520000000"
export GPU_PERFORMANCE_MAX_FREQ="520000000"
export GPU_OVERCLOCK_MAX_FREQ="520000000"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export AUDIO_PATH_SPK="SPK"
export AUDIO_PATH_HP="HP"
export DEVICE_NUM_ANALOG_STICKS=1
export DEVICE_SUPPORTS_PORTMASTER="true"
# As on A10 Mini/G350: the base's SDL draws RetroArch wrong on this panel;
# PyUI's own SDL (RGA ROT_90) is upright.
export RA_SDL2_LIB="/mnt/SDCARD/App/PyUI/dll/libSDL2-2.0.so"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export PAD_NODE_CANDIDATES="/dev/input/by-path/platform-xu10-joypad-event-joystick"
export PAD_NAME_CANDIDATES="MagicX Mini-M Controller"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/by-path/platform-xu10-joypad-event-joystick"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"

export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="$EVENT_PATH_POWER"
export SPRUCE_INPUT_NODES_FILE="/tmp/xumini_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"
export B_R2="1 313"

export B_SELECT="1 314"
export B_START="1 315"
export B_L3="1 317"
export B_R3="1 318"
export B_MENU="1 704"  # BTN_TRIGGER_HAPPY1
export B_HOME="DOESNT_EXIST"

# GUID: BUS_HOST(0x19), vendor 0xC3B0, product 0x1100, revision 0x0100, the
# way A10Mini's GO-Super Gamepad GUID is built from odroidgo3-joypad's ids.
export SDL_GAMECONTROLLER_MAP="19000000b0c300000011000000010000,MagicX Mini-M Controller,a:b1,b:b0,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,leftstick:b10,rightstick:b11,dpup:b12,dpdown:b13,dpleft:b14,dpright:b15,guide:b16,leftx:a0,lefty:a1,platform:Linux,"

export STICK_LEFT="3 0"
export STICK_RIGHT="3 0"
export STICK_UP="3 1"
export STICK_DOWN="3 1"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH=""
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# The Mini M DTB's backlight tops out at 100 (max_brightness, measured on a
# unit); the A10Mini table's 120/160 were rejected with EINVAL.
export SYSTEM_BRIGHTNESS_0="3"
export SYSTEM_BRIGHTNESS_1="4"
export SYSTEM_BRIGHTNESS_2="6"
export SYSTEM_BRIGHTNESS_3="10"
export SYSTEM_BRIGHTNESS_4="20"
export SYSTEM_BRIGHTNESS_5="30"
export SYSTEM_BRIGHTNESS_6="40"
export SYSTEM_BRIGHTNESS_7="60"
export SYSTEM_BRIGHTNESS_8="80"
export SYSTEM_BRIGHTNESS_9="90"
export SYSTEM_BRIGHTNESS_10="100"

  #########################
#####   RetroArch Keys   #####
  #########################

RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="16"
