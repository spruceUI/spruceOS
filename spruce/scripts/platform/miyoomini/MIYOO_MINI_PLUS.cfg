#!/bin/sh
# Miyoo Mini Plus: 640x480, AXP223 PMIC (axp_test), Wi-Fi. Model facts only; the
# family facts are in MiyooMini.cfg. Node map v2, 2026-10-21.

export SPRUCE_DEVICE_NAME="Miyoo Mini Plus"
export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"

# device_init primes pwm0 for the backlight (MiyooMini.sh)
export MINI_PRIME_PWM_BACKLIGHT="true"

# set_powersave's clock at the PyUI screensaver; the bench overrides it from the environment
export MINI_POWERSAVE_MHZ="${MINI_POWERSAVE_MHZ:-400}"
