#!/bin/sh

. /mnt/SDCARD/spruce/scripts/platform/AnbernicXXCommon.cfg
 
  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"
export DISPLAY_ROTATION="270"
export DISPLAY_ASPECT_RATIO="4:3"

  ###################################
#####   RADIO (USB RTL8188EU)     #####
  ###################################

# The one XX model whose radio is USB, not the line's SDIO RTL8821CS.
# Consumed by AnbernicXXCommon.sh's radio contract. A BaseOS that ships the
# module (matching its own kernel) wins; the spruce payload is the fallback,
# rebuilt 2026-09-01 for BaseOS's kernel from the Allwinner sun50iw9 4.9.170
# tree (tools/rg28xx-8188eu). If a module ever refuses to load again,
# device_wifi_power_on turns the session radio-less cleanly with the reason in
# spruce.log instead of recovering toward it.
export WIFI_BUS="usb"
export WIFI_MODULE="8188eu"
if [ -f /lib/modules/8188eu.ko ]; then
    export WIFI_MODULE_PATH="/lib/modules/8188eu.ko"
else
    export WIFI_MODULE_PATH="/mnt/SDCARD/spruce/h700/rg28xx/8188eu.ko"
fi
# Every id the module binds, from its own usb aliases:
#   modinfo -F alias spruce/h700/rg28xx/8188eu.ko
# All 15, not a subset. This is the list that decides whether spruce believes
# the dongle exists, and it is the one that wins at runtime: helperFunctions.sh
# sources this cfg, App/PyUI/launch.sh sources helperFunctions.sh, so PyUI
# inherits WIFI_USB_IDS and its own USB_IDS tuple is only a fallback for being
# launched without it. Keep the two in the same order so a diff is obvious.
export WIFI_USB_IDS="0bda:8179 0bda:0179 0bda:f179 2357:010c 2357:0111 07b8:8179 2001:330f 2001:3310 2001:3311 2001:331b 0b05:18f0 7392:b811 0df6:0076 056e:4008 2c4e:0102"
