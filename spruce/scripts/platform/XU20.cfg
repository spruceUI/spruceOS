#!/bin/sh
# XU RETRO XU20 V32 (MagicX A133P family; see device_functions/magicx_a133p.sh): our
# userland on our own Tina 4.9.191 kernel behind stock boot0/U-Boot; verified 2026-09-17.

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="MagicX"
export FW_FILE=""
export TARGET_FW_VERSION=""
export REQ_MB_TO_UPDATE_FW=1280 # probably will never come up
export SYSTEM_JSON="/mnt/SDCARD/Saves/magicx-xu20-system.json"
export SYSTEM_PATH="/mnt/SDCARD/magicx"
export SD_DEV="/dev/mmcblk1p1" # need to verify this
export SD_MOUNTPOINT="/mnt/SDCARD"
export PLATFORM_ARCHITECTURE="aarch64"


  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# 3.2" RTP32HD016A, 1024x768 landscape DSI mounted upside down, so the UI is rotated
# 180 and touch is inverted on both axes. Must match magicx_xu20.py's screen_* defaults.
export DISPLAY_TEXT_ELF_WIDTH="984"
export DISPLAY_WIDTH="1024"
export DISPLAY_HEIGHT="768"
export DISPLAY_ROTATION="0"   # the kernel rotates the framebuffer (oakMOSS 100/020 + degree0)
export DISPLAY_ASPECT_RATIO="4:3"

  ########################
#####   CPU SETTINGS   #####
  ########################

export DEVICE_MIN_CORES_ONLINE=03
export CPU_SMART_CORES_ONLINE=0123
export DEVICE_MAX_CORES_ONLINE=0123
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1488000
export CPU_SMART_MIN_FREQ=1008000
export CPU_PERF_MAX_FREQ=1800000
export CPU_OVERCLOCK_MAX_FREQ=2000000
export CONSERVATIVE_POLICY_DIR=/sys/devices/system/cpu/cpufreq/conservative

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export BATTERY="/sys/class/power_supply/axp2202-battery"
# Real suspend to RAM (device_functions/magicx_a133p.sh); unset = faux sleep.
export MAGICX_REAL_SLEEP="1"
# Devices suspend one at a time: with async suspend (the kernel default) the XU20's device
# suspend never finishes (stuck after 5200000.ohci1-controller), so neither the key nor the
# RTC can wake it; with pm_async=0 it suspends and wakes on the key (2026-09-28).
export MAGICX_PM_ASYNC="0"
export LED_PATH="not applicable"          # not really, but keeps it from pooping on the root
export DEVICE_BRIGHTNESS_PATH="/tmp/b"    # not really, but keeps it from pooping on the root
# Rumble: PH3, the enable pin of the stock tree's io-vibrator regulator, same as the Zero 40.
export RUMBLE_GPIO="gpio227"
# RetroArch's rumble reads this (ra_functions.sh setup_rumble_env covers the boards it lists).
export RUMBLE_SYSFS_PATH="/sys/class/gpio/${RUMBLE_GPIO}/value"
# The SDL2 set the MagicX base ships (/usr/magicx/lib, SDL 2.26.1): what pysdl2 loads for an
# app that names no set of its own (PortMaster's GUI; PyUI pairs it with its own SDL2_image).
export DEVICE_PYSDL2_DLL_PATH="/usr/magicx/lib"
# simplepad node: joysticks = <0x0>. There are no analog sticks at all.
export DEVICE_NUM_ANALOG_STICKS=0
# Realtek RTL8189ES-class SDIO part on the in-kernel 8189es, verified 2026-09-17.
# The Zero 40 is the odd one out in this family with an XR829.
export WIFI_ONBOARD_MODULE="8189es"
# The touch driver is a module the base does not autoload (oakMOSS 090); device_init
# loads it once the board has settled (magicx_load_touch).
export MAGICX_TOUCH_MODULE="hynitron"
# The backlight PWM is inverted on this board: PyUI mirrors the level it sets
# (MagicXA133PDevice.BACKLIGHT_REVERSED) and pseudo sleep dims to raw 255, not 1.
export MAGICX_BACKLIGHT_REVERSED="1"
# Our kernel carries the driver, so there is nothing card-carried to prefer.
export MAGICX_RADIO_MODULES_DIR=""
# Touch: Hynitron hyn_ts on TWI1 addr 0x5a, five points, 1024x768, no axis swap
# (DTS ctp node); the node is resolved by capability bit and by name at device_init.
export DEVICE_HAS_TOUCHSCREEN="true"

  ###############################################
#####   SOFTWARE CHARACTERISTICS AND QUIRKS   #####
  ###############################################

export PATH=/mnt/SDCARD/spruce/scripts/bin:/mnt/SDCARD/spruce/smartpro/bin/:/mnt/SDCARD/spruce/bin64:/usr/magicx/bin:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
export LD_LIBRARY_PATH="/usr/magicx/lib:/usr/lib:/lib:/mnt/SDCARD/spruce/flip/lib"
export SPRUCE_ETC_DIR="/mnt/SDCARD/trimui/etc"
export DEVICE_PYTHON3_PATH=/mnt/SDCARD/spruce/flip/bin/python3.10
export DEVICE_SUPPORTS_PORTMASTER="true"
export PORTS_LD_LIBRARY_PATH="/mnt/SDCARD/spruce/flip/lib/:/usr/lib:/mnt/SDCARD/spruce/flip/muOS/usr/lib/:/mnt/SDCARD/spruce/flip/muOS/lib/:/usr/lib32:/mnt/SDCARD/spruce/flip/lib32/:/mnt/SDCARD/spruce/flip/muOS/usr/lib32/:/usr/magicx/lib:/usr/lib:/lib"
export DEVICE_CAN_USE_EXTERNAL_CONTROLLER="true"
export DEVICE_USES_64_BIT_RA="true"
export RA_BIN="ra64.universal"
export PSP_BIN="PPSSPPSDL_TrimUI"
export PCSX_BIN="pcsx_64"
export MUPEN_DIR="mupen64plus"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# !!! all of the below needs validation !!!

# The input nodes are resolved by name each time this cfg is sourced: a literal
# export would put the fallback numbering back over what device_init resolved.
_magicx_pad=""; _magicx_pwr=""; _magicx_touch=""
for _d in /sys/class/input/event*; do
    case "$(cat "$_d/device/name" 2>/dev/null)" in
        magicx-input) [ -n "$_magicx_pad" ] || _magicx_pad="/dev/input/${_d##*/}" ;;
        axp2202-pek)  [ -n "$_magicx_pwr" ] || _magicx_pwr="/dev/input/${_d##*/}" ;;
        *ouch*|*ts*|*gt9*|*ft5*|*oodix*|*ocal*|*axs*|*hyn*|*cst*) [ -n "$_magicx_touch" ] || _magicx_touch="/dev/input/${_d##*/}" ;;
    esac
done 2>/dev/null
# "hynitron" has no "ts" in it, so the name arm above carries *hyn*; the
# authoritative resolution at device_init is the multitouch capability bit.
export EVENT_PATH_TOUCH="${_magicx_touch}"
# The pad falls back to event2: the touch driver is a module device_init loads late
# (magicx_load_touch), so it now registers after the pad (simplepad, a boot module).
export EVENT_PATH_SEND_TO_DRASTIC="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_READ_INPUTS_SPRUCE="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_VOLUME="${_magicx_pad:-/dev/input/event2}"
export EVENT_PATH_POWER="${_magicx_pwr:-/dev/input/event0}"

# MagicX's stock trees give some buttons a second code (A: 353; on the XU20 also B: 158 and
# MENU: 256) for their Android launcher's confirm/back keys. oakMOSS images from 2026-09-26
# drop them, so one press is one key. The pad's key capabilities say which image this card is
# on (key 353 = bit 33 of word 5 of the bitmap); everything below that depends on it switches.
MAGICX_PAD_RIDERS=0
_caps=$(cat "/sys/class/input/${_magicx_pad##*/}/device/capabilities/key" 2>/dev/null)
[ -n "$_caps" ] && [ "$(echo "$_caps" | awk '{ if (NF < 6) { print 0; exit } w = $(NF-5); while (length(w) < 16) w = "0" w; d = index("0123456789abcdef", tolower(substr(w, 8, 1))) - 1; print (d >= 0 && int(d / 2) % 2) ? 1 : 0 }')" = 1 ] && MAGICX_PAD_RIDERS=1
export MAGICX_PAD_RIDERS
unset _caps
# The event numbers above are fallbacks: device_init re-resolves the simplepad
# gamepad, the AXP power key and the touchscreen by kernel device name.

export B_POWER="1 116"
    
# simplepad ("magicx-input"), codes read from the stock device tree. On images that still
# carry MagicX's second codes (MAGICX_PAD_RIDERS=1) A also sends 353, B 158 and MENU 256.
export B_LEFT="1 105"
export B_RIGHT="1 106"
export B_UP="1 103"
export B_DOWN="1 108"

export B_A="1 305" # A itself; with the second code, 353 follows on the next line of the same press
export B_B="1 304"
export B_X="1 308"
export B_Y="1 307"

export B_L1="1 310"
export B_L2="1 312"
export B_R1="1 311"
export B_R2="1 313"

export B_L3="1 317" # also logs left fnkey stuff
export B_R3="1 318" # also logs right fnkey stuff

export B_START="1 315"
export B_START_2="enter_pressed" # only registers 0 on release, no 1.
export B_SELECT="1 314"
export B_SELECT_2="rctrl_pressed" # registers both 1 and 0

export B_VOLUP="1 115" # has actual key codes like the buttons
export B_VOLUP_2="volume up" # only registers 0 on release, no 1.
export B_VOLDOWN="1 114" # has actual key codes like the buttons
export B_VOLDOWN_2="volume down" # only registers 0 on release, no 1.
# MENU: with the second codes it sends 158+256 and B also sends 158, so MENU is 256; without
# them MENU is plain 158.
if [ "$MAGICX_PAD_RIDERS" = 1 ]; then export B_MENU="1 256"; else export B_MENU="1 158"; fi
# The extra face button (the tree's switch-key, PH11): stock gives it code 0, which the kernel
# drops, so on older images it sends nothing. oakMOSS images from 2026-09-26 give it KEY_HOMEPAGE
# (172), the Smart Pro S's Home key, and spruce runs Button Settings > Home button action on it.
# Present when the pad reports key 172 (bit 44 of word 2 of its key bitmap).
_caps=$(cat "/sys/class/input/${_magicx_pad##*/}/device/capabilities/key" 2>/dev/null)
if [ -n "$_caps" ] && [ "$(echo "$_caps" | awk '{ if (NF < 3) { print 0; exit } w = $(NF-2); while (length(w) < 16) w = "0" w; d = index("0123456789abcdef", tolower(substr(w, 5, 1))) - 1; print (d >= 0 && d % 2) ? 1 : 0 }')" = 1 ]; then
    export B_HOME="1 172"
else
    export B_HOME="DOESNT_EXIST"
fi
unset _caps

# PyUI's shared MagicX key map reads these so a board can re-dial the map from its
# cfg. With the second codes MENU is 256 and 158 is ignored because B also sends it.
if [ "$MAGICX_PAD_RIDERS" = 1 ]; then
    export MAGICX_MENU_CODES="256"
    export MAGICX_IGNORED_CODES="353,158,272,273"
else
    export MAGICX_MENU_CODES="158"
    export MAGICX_IGNORED_CODES="272,273"
fi

# SDL2 GameController mapping for the pad, inherited by every SDL2 program spruce
# launches. Numbers are SDL's evdev order; switch-key (code 0) takes slot b11.
# SDL numbers the pad's keys as evdev enumerates them: codes 288 and up first, ascending, then the
# rest ascending. This pad (positional face codes, no stick click): b0=304 b1=305 b2=307 b3=308 b4=L1
# b5=R1 b6=L2 b7=R2 b8=SELECT b9=START b10=353(A's rider) b11=UP b12=LEFT b13=RIGHT b14=DOWN b15=VOL-
# b16=VOL+ b17=158 b18=256. Measured on the unit 2026-09-22 by injecting key events (the d-pad used to
# be b12..b15 and guide b19: copied from the Zero 40, which has b10=L3 and so sits one higher). The
# switch-key node's code 0 takes no slot: the kernel clears KEY_RESERVED at registration. MENU sends
# 158 AND 256, and B sends 158 as its second code, so guide sits on 256 (b18), never on 158. The two
# ABS axes are the kernel's centred placeholders (oakMOSS patch 086) so SDL counts the pad as a
# joystick at all; they are deliberately not mapped, this board has no stick.
# Without the second code (MAGICX_PAD_RIDERS=0) 353 is gone and everything after it moves down
# one slot: dpup:b10 dpleft:b11 dpright:b12 dpdown:b13 guide:b16.
if [ "$MAGICX_PAD_RIDERS" = 1 ]; then
    export SDL_GAMECONTROLLERCONFIG="1900000012b400006666000000010000,magicx-input,a:b0,b:b1,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,dpup:b11,dpleft:b12,dpright:b13,dpdown:b14,guide:b18,platform:Linux,"
else
    export SDL_GAMECONTROLLERCONFIG="1900000012b400006666000000010000,magicx-input,a:b0,b:b1,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,dpup:b10,dpleft:b11,dpright:b12,dpdown:b13,guide:b16,platform:Linux,"
fi

# No analog sticks on this board (simplepad joysticks = <0x0>), so the stick
# orientation knobs stay neutral and the stick bindings are empty.
export MAGICX_STICK_SWAP_XY=0
export MAGICX_STICK_INVERT_X=0
export MAGICX_STICK_INVERT_Y=0
export STICK_LEFT=""
export STICK_RIGHT=""
export STICK_UP=""
export STICK_DOWN=""

export STICK_LEFT_2=""
export STICK_RIGHT_2=""
export STICK_UP_2=""
export STICK_DOWN_2=""

  #########################################
#####   VOLUME AND BRIGHTNESS MAPPING   #####
  #########################################

export SYSTEM_VOLUME_0="0"
export SYSTEM_VOLUME_1="12"
export SYSTEM_VOLUME_2="25"
export SYSTEM_VOLUME_3="38"
export SYSTEM_VOLUME_4="51"
export SYSTEM_VOLUME_5="63"
export SYSTEM_VOLUME_6="78"
export SYSTEM_VOLUME_7="89"
export SYSTEM_VOLUME_8="102"
export SYSTEM_VOLUME_9="114"
export SYSTEM_VOLUME_10="127"
export SYSTEM_VOLUME_11="140"
export SYSTEM_VOLUME_12="153"
export SYSTEM_VOLUME_13="165"
export SYSTEM_VOLUME_14="178"
export SYSTEM_VOLUME_15="191"
export SYSTEM_VOLUME_16="204"
export SYSTEM_VOLUME_17="216"
export SYSTEM_VOLUME_18="229"
export SYSTEM_VOLUME_19="242"
export SYSTEM_VOLUME_20="255"

  #########################################
#####   RetroArch Keys   #####
  #########################################
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="4"
RA_START_VAL="6"
RA_HOME_VAL="5"
