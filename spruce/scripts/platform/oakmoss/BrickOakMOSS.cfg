#!/bin/sh
# The TrimUI Brick on oakMOSS (our Tina on the card; the base marks it in /usr/magicx/device as brick): a
# variant of the Brick. None of TrimUI's userland or libraries are there, so the base paths are the oakMOSS
# boards' (PowkiddyCommon.cfg), the card is wherever /mnt/SDCARD is, and TrimUI's awimg updater is not its.

export PLATFORM_PARENT="Brick"
. /mnt/SDCARD/spruce/scripts/platform/tina-stock/Brick.cfg
export PLATFORM_CHIP="a133p"   # oakMOSSCommon.sh sources oakmoss_a133p.sh, over platform/a133p.sh
# PyUI runs as the env-driven SPRUCE device (App/PyUI/spruce-device-env.sh), the other oakMOSS
# boards' way; the stock Brick keeps TRIMUI_BRICK until its own hardware pass.
export PYUI_ENV_DEVICE="true"

export FW_FILE=""
export SD_DEV="$(awk '$2=="/mnt/SDCARD"{print $1; exit}' /proc/mounts 2>/dev/null)"
export DEVICE_PYSDL2_DLL_PATH="/usr/magicx/lib"
export WIFI_USB_MODULES_DIR=""   # no dongle modules for this kernel on the card; the XR829 is onboard
export PATH=/mnt/SDCARD/spruce/scripts/bin:/mnt/SDCARD/spruce/smartpro/bin/:/mnt/SDCARD/spruce/bin64:/usr/magicx/bin:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
export LD_LIBRARY_PATH="/usr/magicx/lib:/usr/lib:/lib:/usr/lib/oakmoss"
export PORTS_LD_LIBRARY_PATH="/usr/lib/oakmoss:/usr/lib:/usr/lib32:/usr/magicx/lib:/usr/lib:/lib"
OAKMOSS_FLIP_LD_PATH="/usr/magicx/lib:/usr/lib:/lib:/mnt/SDCARD/spruce/flip/lib"
OAKMOSS_FLIP_PORTS_PATH="/mnt/SDCARD/spruce/flip/lib/:/usr/lib:/mnt/SDCARD/spruce/flip/muOS/usr/lib/:/mnt/SDCARD/spruce/flip/muOS/lib/:/usr/lib32:/mnt/SDCARD/spruce/flip/lib32/:/mnt/SDCARD/spruce/flip/muOS/usr/lib32/:/usr/magicx/lib:/usr/lib:/lib"
