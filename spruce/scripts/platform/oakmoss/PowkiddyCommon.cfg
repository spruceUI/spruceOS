#!/bin/sh
# Powkiddy V90S and V20 platform variables (A133P on oakMOSS, WiFi only through a USB dongle; not the
# V10, which is dArkMoss): what V90S.cfg and V20.cfg share. They source this file, then add their own.

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="Powkiddy"
export FW_FILE=""
export TARGET_FW_VERSION=""
export REQ_MB_TO_UPDATE_FW=1280 # probably will never come up
export SYSTEM_PATH="/mnt/SDCARD/magicx"
# oakMOSS hosts spruce from SD2 or from SD1's SPRUCEOS partition, so ask /proc/mounts.
export SD_DEV="$(awk '$2=="/mnt/SDCARD"{print $1; exit}' /proc/mounts 2>/dev/null)"
export SD_MOUNTPOINT="/mnt/SDCARD"
export PLATFORM_ARCHITECTURE="aarch64"


  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

export DISPLAY_TEXT_ELF_WIDTH="600"
export DISPLAY_WIDTH="640"
export DISPLAY_HEIGHT="480"
export DISPLAY_ROTATION="0"   # the panel is landscape-native: nothing rotates
export DISPLAY_ASPECT_RATIO="4:3"

  ########################
#####   CPU SETTINGS   #####
  ########################

export DEVICE_MIN_CORES_ONLINE=03
export CPU_SMART_CORES_ONLINE=0123
export DEVICE_MAX_CORES_ONLINE=0123
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1488000
export CPU_SMART_MIN_FREQ=1008000
export CPU_PERF_MAX_FREQ=1800000
export CPU_OVERCLOCK_MAX_FREQ=1800000   # the stock tree's OPP table ends at 1800 MHz
export CONSERVATIVE_POLICY_DIR=/sys/devices/system/cpu/cpufreq/conservative

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export BATTERY="/sys/class/power_supply/axp2202-battery"
# Faux sleep until real suspend has been tried on this board (MAGICX_REAL_SLEEP=1 turns it on).
export LED_PATH="not applicable"          # not really, but keeps it from pooping on the root
export DEVICE_BACKLIGHT_PATH="/tmp/b"    # not really, but keeps it from pooping on the root
# The V90S's motor is on the pad's force feedback, not a GPIO (vibrate() in powkiddy_a133p.sh).
export RUMBLE_GPIO="none"
# The SDL2 set the oakMOSS base ships (/usr/magicx/lib, SDL 2.26.1).
export DEVICE_PYSDL2_DLL_PATH="/usr/magicx/lib"
# No onboard radio: WiFi is a USB dongle on the USB-C port (utils/usb_wifi_dongle.sh), with the
# 8188eu/8812au modules the oakMOSS base builds for its own kernel. No WIFI_ONBOARD_MODULE.
export WIFI_USB_MODULES_DIR="/usr/lib/oakmoss/modules/usb-wifi"
export DEVICE_HAS_TOUCHSCREEN="false"
export EVENT_PATH_TOUCH=""

  ###############################################
#####   SOFTWARE CHARACTERISTICS AND QUIRKS   #####
  ###############################################

export PATH=/mnt/SDCARD/spruce/scripts/bin:/mnt/SDCARD/spruce/smartpro/bin/:/mnt/SDCARD/spruce/bin64:/usr/magicx/bin:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
export LD_LIBRARY_PATH="/usr/magicx/lib:/usr/lib:/lib:/usr/lib/oakmoss"
export SPRUCE_ETC_DIR="/mnt/SDCARD/trimui/etc"
export DEVICE_PYTHON3_PATH=/mnt/SDCARD/spruce/flip/bin/python3.10
export DEVICE_SUPPORTS_PORTMASTER="true"
export PORTS_LD_LIBRARY_PATH="/usr/lib/oakmoss:/usr/lib:/usr/lib32:/usr/magicx/lib:/usr/lib:/lib"
# oakMOSS images carry their own libraries in /usr/lib/oakmoss; on an older base without them,
# oakmoss_a133p.sh uses these spruce/flip paths instead.
MAGICX_FLIP_LD_PATH="/usr/magicx/lib:/usr/lib:/lib:/mnt/SDCARD/spruce/flip/lib"
MAGICX_FLIP_PORTS_PATH="/mnt/SDCARD/spruce/flip/lib/:/usr/lib:/mnt/SDCARD/spruce/flip/muOS/usr/lib/:/mnt/SDCARD/spruce/flip/muOS/lib/:/usr/lib32:/mnt/SDCARD/spruce/flip/lib32/:/mnt/SDCARD/spruce/flip/muOS/usr/lib32/:/usr/magicx/lib:/usr/lib:/lib"
export DEVICE_CAN_USE_EXTERNAL_CONTROLLER="true"
export DEVICE_USES_64_BIT_RA="true"
export RA_BIN="ra64.universal"
export PSP_BIN="PPSSPPSDL_TrimUI"
export MUPEN_DIR="mupen64plus"

  ###########################
#####   PYUI ENV DEVICE   #####
  ###########################

# PyUI runs as the env-driven SPRUCE device, set up from this file by App/PyUI/spruce-device-env.sh.
export PYUI_ENV_DEVICE="true"
export DEFAULT_CFG_PATH="/mnt/SDCARD/App/PyUI/main-ui/devices/magicx/magicx-system.json"
export REQUIRES_SURFACE_FORMAT_CONVERSION="true"
# The oakMOSS Powkiddy class's values, which PyUI no longer defaults (a board with sticks adds
# STICK_DEADZONE).
export POWER_OFF_CMD="poweroff"
export REBOOT_CMD="reboot"
export CONTROLLER_EVENT_FORMAT="llHHi"
# The gauge can read 0-1 % on a healthy cell; device_get_battery_percent corrects it.
export BATTERY_PERCENT_CMD="/mnt/SDCARD/App/PyUI/get-device-status.sh battery_percent"
# The radio is a USB dongle or nothing, so PyUI keeps asking rather than fixing it at launch.
export CHECK_WIFI_SUPPORT_CMD="/mnt/SDCARD/App/PyUI/get-device-status.sh wifi_radio"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# The input nodes are resolved by name each time this cfg is sourced: the pad (oakMOSS's
# adc-joypad driver, named per board), the volume keys on the LRADC (sunxi-keyboard) and the
# AXP2202 power key are three devices. The numbers are fallbacks only (not yet seen on a unit).
# POWKIDDY_PAD_NAME comes from the board's cfg.
_pk_pad=""; _pk_pwr=""; _pk_vol=""
for _d in /sys/class/input/event*; do
    case "$(cat "$_d/device/name" 2>/dev/null)" in
        "$POWKIDDY_PAD_NAME") [ -n "$_pk_pad" ] || _pk_pad="/dev/input/${_d##*/}" ;;
        axp2202-pek)          [ -n "$_pk_pwr" ] || _pk_pwr="/dev/input/${_d##*/}" ;;
        sunxi-keyboard)       [ -n "$_pk_vol" ] || _pk_vol="/dev/input/${_d##*/}" ;;
    esac
done 2>/dev/null
export POWKIDDY_PAD_NAME
export EVENT_PATH_SEND_TO_DRASTIC="${_pk_pad:-/dev/input/event3}"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="${_pk_pad:-/dev/input/event3}"
export EVENT_PATH_READ_INPUTS_SPRUCE="${_pk_pad:-/dev/input/event3}"
export EVENT_PATH_VOLUME="${_pk_vol:-/dev/input/event0}"
export EVENT_PATH_POWER="${_pk_pwr:-/dev/input/event1}"
# One code per press: no MagicX-style second codes on this pad.
export MAGICX_PAD_RIDERS=0

export B_POWER="1 116"

# The d-pad is a hat, as on the TrimUI line and the Flip; the face buttons carry the A133P
# line's codes (A 305, B 304, X 308, Y 307); MENU is the Mode button.
export B_LEFT="3 16 -1"  # negative for left
export B_RIGHT="3 16 1"  # positive for right
export B_UP="3 17 -1"    # negative for up
export B_DOWN="3 17 1"   # positive for down

export B_A="1 305"
export B_B="1 304"
export B_X="1 308"
export B_Y="1 307"

export B_L1="1 310"
export B_L2="1 312"
export B_R1="1 311"
export B_R2="1 313"

export B_START="1 315"
export B_START_2="enter_pressed" # only registers 0 on release, no 1.
export B_SELECT="1 314"
export B_SELECT_2="rctrl_pressed" # registers both 1 and 0

export B_VOLUP="1 115"
export B_VOLUP_2="volume up" # only registers 0 on release, no 1.
export B_VOLDOWN="1 114"
export B_VOLDOWN_2="volume down" # only registers 0 on release, no 1.
export B_MENU="1 316"
export B_HOME="DOESNT_EXIST"

# Sticks (the V20's): ABS_X/ABS_Y left and ABS_RX/ABS_RY right, the stock binding's order (Knulli's
# V20 tree swaps the right stick's two axes: confirm on a unit). PyUI's env device maps them from these.
export STICK_LEFT="3 0 -32767" # negative for left
export STICK_RIGHT="3 0 32767" # positive for right
export STICK_UP="3 1 -32767"   # negative for up
export STICK_DOWN="3 1 32767"  # positive for down

export STICK_LEFT_2="3 3 -32767" # negative for left
export STICK_RIGHT_2="3 3 32767" # positive for right
export STICK_UP_2="3 4 -32767"   # negative for up
export STICK_DOWN_2="3 4 32767"  # positive for down

  #########################################
#####   VOLUME AND BRIGHTNESS MAPPING   #####
  #########################################

export SYSTEM_VOLUME_0="0"
export SYSTEM_VOLUME_1="12"
export SYSTEM_VOLUME_2="25"
export SYSTEM_VOLUME_3="38"
export SYSTEM_VOLUME_4="51"
export SYSTEM_VOLUME_5="63"
export SYSTEM_VOLUME_6="78"
export SYSTEM_VOLUME_7="89"
export SYSTEM_VOLUME_8="102"
export SYSTEM_VOLUME_9="114"
export SYSTEM_VOLUME_10="127"
export SYSTEM_VOLUME_11="140"
export SYSTEM_VOLUME_12="153"
export SYSTEM_VOLUME_13="165"
export SYSTEM_VOLUME_14="178"
export SYSTEM_VOLUME_15="191"
export SYSTEM_VOLUME_16="204"
export SYSTEM_VOLUME_17="216"
export SYSTEM_VOLUME_18="229"
export SYSTEM_VOLUME_19="242"
export SYSTEM_VOLUME_20="255"

  #########################################
#####   RetroArch Keys   #####
  #########################################
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="4"
RA_START_VAL="6"
RA_HOME_VAL="5"
