#!/bin/sh
# Powkiddy V20 on oakMOSS: vertical, two sticks, L3/R3, no rumble (PD20, the V90S's motor PWM, is its R3).
# UNTESTED, carried from the V90S: the base marks it in /usr/magicx/device (v20); codes from boards/v20.

# The pad's name, read by PowkiddyCommon.cfg (sourced next) to find its input node.
POWKIDDY_PAD_NAME="Powkiddy V20 Gamepad"

. /mnt/SDCARD/spruce/scripts/platform/oakmoss/PowkiddyCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export SPRUCE_DEVICE_NAME="Powkiddy V20"
export SYSTEM_JSON="/mnt/SDCARD/Saves/powkiddy-v20-system.json"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export DEVICE_NUM_ANALOG_STICKS=2
export STICK_DEADZONE="16000"   # the oakMOSS Powkiddy class's; PyUI ignores the sticks without it
export B_L3="1 317"
export B_R3="1 318"

# SDL2 GameController mapping: as the V90S's, plus b11=L3 b12=R3 and the sticks on ABS_X/ABS_Y and
# ABS_RX/ABS_RY (a0..a3).
export SDL_GAMECONTROLLERCONFIG="19000000330100009011000088010000,Powkiddy V20 Gamepad,a:b0,b:b1,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,guide:b10,leftstick:b11,rightstick:b12,dpup:h0.1,dpright:h0.2,dpdown:h0.4,dpleft:h0.8,leftx:a0,lefty:a1,rightx:a2,righty:a3,platform:Linux,"
