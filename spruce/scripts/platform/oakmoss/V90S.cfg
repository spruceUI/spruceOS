#!/bin/sh
# Powkiddy V90S on oakMOSS: clamshell, no sticks, rumble on the pad. The base marks it in /usr/magicx/device
# (v90s); codes come from oakMOSS's board tree (boards/v90s): confirm them with evtest.

# The pad's name, read by PowkiddyCommon.cfg (sourced next) to find its input node.
POWKIDDY_PAD_NAME="Powkiddy V90S Gamepad"

. /mnt/SDCARD/spruce/scripts/platform/oakmoss/PowkiddyCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export SPRUCE_DEVICE_NAME="Powkiddy V90S"
export PLATFORM_CHIP="a133p"   # oakMOSSCommon.sh sources oakmoss_a133p.sh, over platform/a133p.sh
export SYSTEM_JSON="/mnt/SDCARD/Saves/powkiddy-v90s-system.json"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

export DEVICE_NUM_ANALOG_STICKS=0
export B_L3="DOESNT_EXIST"
export B_R3="DOESNT_EXIST"

# SDL2 GameController mapping. SDL numbers the keys in code order: b0=304 b1=305 b2=307 b3=308 b4=L1 b5=R1
# b6=L2 b7=R2 b8=SELECT b9=START b10=MODE; the d-pad is hat 0. Ids: bus 0x19, vendor 0x0133, product 0x1190.
export SDL_GAMECONTROLLERCONFIG="19000000330100009011000088010000,Powkiddy V90S Gamepad,a:b0,b:b1,x:b2,y:b3,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,back:b8,start:b9,guide:b10,dpup:h0.1,dpright:h0.2,dpdown:h0.4,dpleft:h0.8,platform:Linux,"
