# BlueZ 5.54 main.conf for TrimUI's A133P firmware: the stock file has every
# option at its default, and so does this one - except AlwaysPairable.
#
# spruce pairs through one-shot bluetoothctl calls, which register no agent.
# Without an agent BlueZ leaves the adapter non-bondable, so the kernel paired
# "no bonding", never stored the link key, and every pairing was gone after a
# reboot or a Bluetooth toggle. trimui_a133p.sh binds this over
# /etc/bluetooth/main.conf.

[General]
AlwaysPairable = true

[GATT]

[Policy]
